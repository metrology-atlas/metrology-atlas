id: timenet
name: TimeNet
summary: >-
  An open format and library for time-series datasets. The atlas's scripts build VitalDB into TimeNet databases
  that carry the per-case labels; the VitalDB reading itself is in vitaldb-reader.
repo: https://github.com/OpenTSLM/TimeNet
branch: main
visibility: public
docs: https://docs.timenet.ai
language: Python
description: |
  TimeNet stores time series with exact sample times and attached labels. [[software:vitaldb-bench]]
  (`vitaldb_bench.build`) builds the VitalDB release into TimeNet databases in short, resumable chunks and checks
  every stored value and time against the source files; the builds carry the per-case labels and the atlas's
  corrections, which they take from [[software:vitaldb-reader]].
role: |
  The VitalDB connector that turns a .vital file into TimeNet records (the adapter on top of
  [[software:vitaldb-reader]]) was written for this work and is not yet part of the public TimeNet repository: it
  is to be offered there. Until it is, the builds need it locally, and the studies of this atlas that read the
  recordings do so through [[software:vitaldb-reader]], which is public.
related: [vitaldb-bench, vitaldb-reader]
references: [timenet]
