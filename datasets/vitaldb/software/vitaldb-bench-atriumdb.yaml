id: vitaldb-bench-atriumdb
name: vitaldb-bench-atriumdb
summary: 'The AtriumDB side of the VitalDB work: builds, derived labels and benchmarks.'
repo: https://github.com/meshlab/vitaldb-bench-atriumdb
branch: main
visibility: private
local: ../../../vitaldb/vitaldb-bench-atriumdb
licence: GPL-3.0-or-later
language: Python
description: |
  Kept apart from [[software:vitaldb-bench]] because the AtriumDB SDK is GPL. It imports VitalDB cases into an
  AtriumDB dataset with the timing model's labels, writes the derived label families, and reads tracks back for
  the same fidelity and performance checks. It imports vitaldb-bench; vitaldb-bench never imports it.
related: [vitaldb-bench]
references: [atriumdb, apache-arrow, goodwin2020practical]
