id: icu-days
# Hand-written overlay on the generated file: anchor basis only.
value:
  anchor_basis: assumption
  anchor_note: >-
    The counting rule is not documented. Read as nights spent in the ICU (or completed days): 815 stays are 1 day and
    only 98 are 2, while counting calendar days touched would make 2 the commonest value for the usual overnight stay
    after surgery. Nights and completed days cannot be told apart without ICU times. In 37 cases the count reaches or
    exceeds the days from surgery to discharge ([[observation:icu-days-exceed-postop-stay]]).
description: >-
  Day count; the counting rule is not documented. Read as nights in the ICU (or completed days), with ±1 day
  uncertainty; see the anchor note below.
