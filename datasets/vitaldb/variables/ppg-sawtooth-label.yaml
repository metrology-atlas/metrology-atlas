id: ppg-sawtooth-label
name: PPG sawtooth tooth
summary: 'One label per tooth of the plethysmogram''s frame sawtooth: its slope and phase, the correction applied, and the
  sync error left.'
group: Derived labels/PPG timing labels
origin: derived
version: 0.0.2
type: event
source: ppg_sawtooth_labels.csv (label family ppg_sawtooth)
source_name: ppg_sawtooth
measurand: The ECG-to-PPG delay's sawtooth over one tooth, from one frame slip to the next ([[study:ppg-sawtooth]]), and
  the timing error left in the plethysmogram once it is corrected.
description: Each label runs from one slip to the next, or to the start or end of the analysed stretch, and carries the
  tooth's parameters, the applied correction (so a downstream method can undo it), each fiducial's error model, a tier and
  whether it is usable for pulse arrival time. Labelled so far in 265 recordings, over the first 90 minutes of each analysed stretch; one more of the 266 has too
  few matched beats for the whole-release slip fit and is not labelled.
derived_from:
- variable: snuadc-ecg-ii
  relation: computed-from
  form: snu-raw-step
  note: 'R peaks, interpolated: the ECG fiducial. Raw stamps in either SNUADC mode; the step-mode form, with the larger error, is named.'
- variable: snuadc-pleth
  relation: computed-from
  form: pleth-raw-step
  note: 'Pulse feet (intersecting tangent of the 0.5-10 Hz band-passed waveform): the PPG fiducial. Raw stamps in either SNUADC mode; the step-mode form, with the larger error, is named.'
- variable: snuadc-art
  relation: computed-from
  form: snu-raw-step
  note: Arterial upstrokes, where available, confirm slips (the reference). Raw stamps in either SNUADC mode; the step-mode form, with the larger error, is named.
algorithm: physiosync's rebuilt correction (fit_ecg_ppg_delay, method rebuilt) of the beat-to-beat ECG-to-PPG delay,
  from the whole-release slip fit (slips confirmed, or placed within an interval; each tooth creeps one frame between
  its slips); the sync error left in each tooth is summarised by drawing from the tooth's error model.
code:
- physiosync/physiosync/ecg_ppg.py
- physiosync/physiosync/labels.py
- vitaldb-bench/tools/measurement_export.py
propagation:
  method: study
  studies:
  - ppg-sawtooth
  - ppg-sawtooth-correction
  note: 'Each label carries its own sync error: mean, SD and 95th percentile.'
timing:
- id: pst-start
  name: 'as stored: the tooth''s interval, from its start'
  kind: as_stored
  support_s:
  - 9.8
  - 5398.8
  stamp_position: open
  bias_s: &id001
    median: -718.4
    p5: -3824.1
    p95: -159.0
    scope: recording
    status: measured
    evidence: label lengths, 1199 labels; label CSVs of the v2 run (physiosync 0.3.3, rebuilt correction; 265 recordings), tools/label_stats.py, measured
      5 Nov 2026
  look_ahead:
    lead_s:
    - 9.8
    - 5398.8
    basis: real
    note: 'Used at its start, the tooth carries its whole interval, and more: it is fitted over the recording. Both ends
      are stored, so its availability time is recoverable.'
  uncertainty:
    components: &id002
    - name: label ends
      type: B
      u_s: 0
      scope: recording
      evidence: the ends are the file's own stamps, copied exactly
  domain: recorder-pc
  status: measured
  evidence: 'label_families.py: start and end columns'
- id: pst-avail
  name: at the end of the recording (its availability time)
  default: true
  kind: per_recording
  uses_future: true
  support_s:
  - 9.8
  - 5398.8
  stamp_position: close
  removes_bias_s: *id001
  bias_s:
    name: held to the end of the recording
    median: 13695.9
    p5: 1947.6
    p95: 26293.6
    scope: recording
    status: measured
    evidence: from each label's end to the end of its recording (the last numeric delay label), 1199 labels;
      label CSVs of the v2 run (physiosync 0.3.3, rebuilt correction; 265 recordings), tools/label_stats.py, measured 5 Nov 2026
  uncertainty:
    upper_bound: false
    components: *id002
  correction: read the label once the recording has ended (available_at case_end)
  corrects:
  - pst-start
  domain: recorder-pc
  status: measured
  evidence: 'label_families.py: available_at case_end; the rate and offset priors also pool other recordings of the same
    setup'
value:
  kind: per-tooth fit
  status: measured
  studies:
  - ppg-sawtooth
  note: 'The sync error SD in these labels, median per tier: A 1.9 ms (749 teeth), B 3.6 ms (98), C 5.0 ms (14); U
    9.6 ms (123) and I 9.6 ms (182), not corrected (a sawtooth of unknown phase); N (33) has no slip. For A, B and C
    these are the model''s per-tier residuals from the injected benchmark of the detect fit, not measured for the
    rebuilt correction, whose end-to-end check is [[study:ppg-sawtooth-correction]]. 880 of 1,199 teeth (A, B and N)
    are usable for pulse arrival time.'
