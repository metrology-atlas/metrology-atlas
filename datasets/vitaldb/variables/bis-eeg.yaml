id: bis-eeg
name: BIS EEG
summary: The raw EEG from the BIS monitor at 128 Hz.
type: waveform
source_name: BIS/EEG1_WAV
device: bis
stamp_clock: recorder-pc
sample_clock: bis-clock
rate_hz: 128
unit: uV
timing:
- id: bis-sync
  name: after sync to the ECG (stamp model and the mode's constant)
  default: true
  kind: per_recording
  uses_future: true
  support_s:
  - 0
  - 0
  stamp_position: instant
  grid_s: 0.0078
  removes_bias_s: &id001
    median: -0.787
    p5: -0.97
    p95: -0.601
    n: 2702
    scope: recording
    status: measured
    evidence: EEG stamp minus the same burst on the stamp-model ECG, median per recording (reframe_stage3/bis_numbers.json)
  uncertainty:
    upper_bound: true
    interval95_s:
    - -0.233
    - 0.166
    components:
    - name: the recording's constant against its SNUADC mode's
      type: A
      distribution: empirical
      u_s: 0.058
      scope: recording
    - name: 'within the recording: drift and steps left by the stamp model'
      type: A
      distribution: empirical
      u_s: 0.0256
      scope: structured
      length_s: 480
      correlation: exponential
      evidence: correlation length 8 min, from the burst windows (stage 4b, corr_lengths.json)
    - name: sample or stamp grid
      type: B
      distribution: rectangular
      u_s: 0.0023
      scope: independent
  correction: stamp model and the SNUADC mode's EEG-ECG constant
  corrects:
  - bis-raw
  domain: reference
  status: measured
  evidence: 'held-out burst windows against the mode''s leave-one-out constant: robust SD 62 ms, median |error| 42 ms (2,710
    recordings, 36,928 windows); step mode 51 ms, others 94-129 ms; latency -0.80 s in link K'
- id: bis-own
  name: after sync with the recording's own bursts
  kind: per_recording
  uses_future: true
  support_s:
  - 0
  - 0
  stamp_position: instant
  grid_s: 0.0078
  removes_bias_s: *id001
  uncertainty:
    upper_bound: true
    interval95_s:
    - -0.116
    - 0.15
    components:
    - name: the recording's own constant, leave-one-window-out
      type: A
      distribution: empirical
      u_s: 0.0301
      scope: structured
      length_s: 480
      correlation: exponential
      evidence: correlation length 8 min, from the burst windows
    - name: sample or stamp grid
      type: B
      distribution: rectangular
      u_s: 0.0023
      scope: independent
  correction: stamp model and the recording's own EEG-ECG burst constant (needs 5 or more good burst windows)
  corrects:
  - bis-raw
  domain: reference
  status: measured
  evidence: 'each burst window against the median of the recording''s other windows: robust SD 30 ms, median |error| 20
    ms (2,710 recordings)'
- id: bis-shift
  name: raw stamps shifted by the release median
  kind: fixed_shift
  support_s:
  - 0
  - 0
  stamp_position: instant
  grid_s: 0.0078
  removes_bias_s: *id001
  uncertainty:
    upper_bound: true
    interval95_s:
    - -0.33
    - 0.267
    components:
    - name: 'between recordings: the constant is not known in advance'
      type: A
      distribution: empirical
      u_s: 0.1129
      scope: recording
    - name: 'within the recording: drift and BIS corrections'
      type: A
      distribution: empirical
      u_s: 0.1143
      scope: structured
      length_s: 8192
      correlation: rectangular
      evidence: one BIS correction cycle (8,192 s)
    - name: sample or stamp grid
      type: B
      distribution: rectangular
      u_s: 0.0023
      scope: independent
  correction: the release median, known in advance
  corrects:
  - bis-raw
  domain: bis
  status: measured
  evidence: 'raw burst windows against the release median: robust SD 171 ms (2,702 recordings, 36,788 windows)'
- id: bis-raw
  name: raw stamps
  kind: as_stored
  support_s:
  - 0
  - 0
  stamp_position: instant
  grid_s: 0.0078
  bias_s: *id001
  look_ahead:
    lead_s:
    - 0.6
    - 0.97
    note: 'On the working reference, a BIS EEG stamp comes 0.6-1.0 s before the event: raw BIS stamps put the EEG ahead
      of the SNUADC signals.'
  uncertainty:
    components:
    - name: between recordings
      type: A
      distribution: empirical
      u_s: 0.1129
      scope: recording
    - name: 'within the recording: drift and BIS corrections'
      type: A
      distribution: empirical
      u_s: 0.1143
      scope: structured
      length_s: 8192
      correlation: rectangular
      evidence: one BIS correction cycle (8,192 s)
    - name: sample or stamp grid
      type: B
      distribution: rectangular
      u_s: 0.0023
      scope: independent
  domain: bis
  status: measured
  evidence: 'EEG minus ECG for the same burst on the raw stamps: median -787 ms, p5-p95 -970 to -601 ms (2,702 recordings)'
tags:
- stub
chain:
- node: BIS clock
  clock: bis-clock
  kind: clock
  effect: The BIS monitor stamps its EEG on its own clock; for the same event its stamps come 0.60–0.97 s before
    the ECG's (look-ahead). It drifts +25 ppm against the PC and is pulled forward on a fixed 8,192 s timer (median +0.17 s).
  bias_s: [-0.97, -0.601]
  drift: +25 ppm against the PC; corrected every 8,192 s
  status: measured
  studies:
  - snuadc-stamp-sawtooth
- node: Synchronised to the ECG
  kind: correction
  effect: The stamp model removes the drift and corrections; one constant per SNUADC mode, from bursts seen in both
    the ECG and the EEG, removes the offset. What is left is a standard uncertainty of 63 ms with the mode's constant
    (an upper bound, median absolute error 42 ms) and 30 ms with the recording's own bursts (whole release).
  bias_s: [-0.97, -0.601]
  u_s: 0.0634
  status: measured
  studies:
  - snuadc-stamp-sawtooth
- node: Stored sample time
  kind: stamping
  effect: 'Samples at 128 Hz: one sample is 7.8 ms.'
  span_s:
  - 0.0078
  - 0.0078
  status: measured
