id: bis-index
name: BIS index
summary: The BIS depth-of-anaesthesia index, computed from a window of EEG.
type: numeric
source_name: BIS/BIS
device: bis
stamp_clock: bis-clock
timing:
- id: bis-num
  name: as stamped
  default: true
  kind: as_stored
  support_s:
  - 16
  - 61
  stamp_position: close
  bias_s:
    median: {parameter: bis-index-delay}
    p5: {parameter: bis-index-delay, use: p5}
    p95: {parameter: bis-index-delay, use: p95}
    scope: recording
    status: measured
  uncertainty:
    components:
    - name: delay spread
      type: A
      distribution: rectangular
      u_s: 0.2887
      scope: recording
  domain: bis
  status: measured
  evidence: stamped 3-4 s after the newest EEG it averages (p10-p90; p95 6 s), 3,297 good fits; window about 16 s (48%)
    or 29-61 s (40%); half the weight older than 31 s. Vital Recorder stamps the index, like the EEG, at arrival minus
    1 s (H.-C. Lee, 9 Nov 2026), so this delay against the EEG stamps is unaffected by it
  checked: 2026-11-01
  studies:
  - bis-index-delay
tags:
- stub
window:
  name: Trailing average
  parameter: bis-index-window
  description: Set per case on the monitor; not recorded.
delays:
- name: From the EEG window end
  parameter: bis-index-delay
  description: The same in every smoothing group.
# Links between variables (schema 0.4)
derived_from:
- variable: bis-eeg
  relation: same-source
  note: The BIS computes its index from its own EEG; the recorded EEG is that EEG, as the BIS exports it.
