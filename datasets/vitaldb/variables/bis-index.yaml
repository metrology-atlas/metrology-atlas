id: bis-index
name: BIS index
summary: The BIS depth-of-anaesthesia index, computed from a window of EEG.
type: numeric
source_name: BIS/BIS
device: bis
stamp_clock: bis-clock
timing:
- id: bis-num
  name: as stamped
  default: true
  kind: as_stored
  support_s:
  - 16
  - 61
  stamp_position: close
  bias_s:
    median: 3.5
    p5: 3.0
    p95: 4.0
    scope: recording
    status: measured
  uncertainty:
    components:
    - name: delay spread
      type: A
      distribution: rectangular
      u_s: 0.2887
      scope: recording
  domain: bis
  status: measured
  evidence: 3-4 s after its EEG window ends; window 16 s (48%) or 32-61 s (40%); half the weight older than 30 s
tags:
- stub
window:
  name: Trailing average
  parameter: bis-index-window
  description: Set per case on the monitor; not recorded.
delays:
- name: From the EEG window end
  parameter: bis-index-delay
  description: The same in every smoothing group.
# Links between variables (schema 0.4)
derived_from:
- variable: bis-eeg
  relation: same-source
  note: The BIS computes its index from its own EEG; the recorded EEG is that EEG, as the BIS exports it.
