id: solar8000-nibp
name: Non-invasive blood pressure
summary: Cuff blood pressure, recorded after each cuff cycle.
type: numeric
source_name: Solar8000/NIBP_MBP
device: solar8000
stamp_clock: recorder-pc
unit: mmHg
timing:
- id: nibp
  name: as stamped
  default: true
  kind: as_stored
  support_s:
  - 30
  - 40
  stamp_position: close
  bias_s:
    median: 30
    p5: 20
    p95: 40
    scope: independent
    status: measured
  uncertainty:
    components:
    - name: result delay
      type: A
      distribution: empirical
      u_s: 6.079
      scope: independent
  domain: recorder-pc
  status: measured
  evidence: result 20-40 s after the cuff measurement
tags:
- stub
references: [goodwin2021blood]
# Links between variables (schema 0.4)
measures:
- measurand: systolic-arterial-pressure
  tracks:
  - NIBP_SBP
  method: oscillometric cuff
- measurand: diastolic-arterial-pressure
  tracks:
  - NIBP_DBP
  method: oscillometric cuff
- measurand: mean-arterial-pressure
  tracks:
  - NIBP_MBP
  method: oscillometric cuff
# Value side: from the method comparison against the arterial line
value:
  uncertainty:
    components:
    - name: offset per patient
      type: A
      distribution: empirical
      u_s: 10.2
      scope: recording
      status: measured
      evidence: SD between patients of each patient's mean cuff-minus-arterial difference, 2,283 patients ([[parameter:nibp-between-patient-sd]])
    - name: scatter between readings
      type: A
      distribution: empirical
      u_s: 9.4
      scope: independent
      status: measured
      evidence: SD of cuff-minus-arterial differences within a patient, 12,238 readings ([[parameter:nibp-within-patient-sd]])
    note: Mean pressure only (NIBP_MBP). Measured against the arterial line, whose own error is in the difference, so both
      components are upper bounds. Only the scatter between readings averages away with repeated readings; the offset per
      patient does not.
  bias:
    value: -0.1
    scope: release
    status: measured
    evidence: cuff minus arterial over the cohort ([[parameter:nibp-art-bias]])
  status: measured
  studies:
  - cuff-vs-arterial-agreement
