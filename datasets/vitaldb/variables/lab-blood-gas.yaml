id: lab-blood-gas
name: Blood gas result time
summary: Time stamp of a blood gas result in the lab table.
group: Laboratory/Result times
type: event
source_name: lab_data (blood gas)
device: clinical-records
stamp_clock: hospital-records
timing:
- id: lab-bg
  name: lab timestamp
  default: true
  delay_s:
  - 190.0
  - 730.0
  interval_s:
  - 1.0
  - 1.0
  domain: records
  status: measured
  evidence: 3-12 min after the access (modes ~4, ~9 min); the value is known later
- id: lab-draw
  name: draw time from arterial access
  delay_s:
  - 10.0
  - 100.0
  interval_s:
  - 28.0
  - 117.0
  domain: records
  status: estimated
  evidence: access 28-117 s (p10-p90); matched 0-15 min (gas) or 0-30 min (central) before
tags:
- stub
chain:
- node: Hospital records clock
  clock: hospital-records
  kind: sync
  effect: The laboratory and anaesthesia record systems keep hospital time (KST). Their offset from UTC and from
    the recorder PC is not observable in the release, which shifts every case to 2100.
  status: assumed
- node: Blood draw
  kind: processing
  status: measured
  effect: Blood is drawn from the arterial line (an access, 28–117 s long) and analysed in theatre or sent on. The
    specimen is stamped 3–12 min after the draw; the lab_draw label marks the matched access.
  offset_s:
  - 190
  - 730
  residual_s:
  - 28
  - 117
  parameter: lab-bg-lag
  studies:
  - lab-timestamp-meaning
  - arterial-line-accesses
- node: Result known
  kind: processing
  status: assumed
  effect: The result follows an unrecorded turnaround; a value is known no earlier than its timestamp plus that
    turnaround.
- node: Stored lab time
  kind: stamping
  status: measured
  offset_s:
  - 1
  - 1
  effect: Whole seconds, one time per specimen shared by every analyte of the panel.
