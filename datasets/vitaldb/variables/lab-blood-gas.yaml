id: lab-blood-gas
name: Blood gas result time
summary: Time stamp of a blood gas result in the lab table.
group: Laboratory/Result times
type: event
source_name: lab_data (blood gas)
device: clinical-records
stamp_clock: hospital-records
timing:
- id: lab-bg
  name: lab timestamp
  default: true
  kind: as_stored
  support_s:
  - 0
  - 0
  stamp_position: instant
  grid_s: 1
  bias_s: &id001
    median: 460
    p5: 190
    p95: 730
    scope: independent
    status: measured
  uncertainty:
    components:
    - name: turnaround between samples
      type: A
      distribution: empirical
      u_s: 164.1337
      scope: independent
  domain: records
  status: measured
  evidence: 3-12 min after the access (modes about 4 and 9 min); the value is known later
- id: lab-draw
  name: draw time from arterial access
  kind: per_recording
  uses_future: true
  support_s:
  - 28
  - 117
  stamp_position: unknown
  removes_bias_s: *id001
  uncertainty:
    upper_bound: false
    components:
    - name: where in the access the draw is
      type: B
      distribution: rectangular
      u_s: 25.6921
      scope: independent
      status: estimated
  correction: matched arterial-line access
  corrects:
  - lab-bg
  domain: records
  status: estimated
  evidence: access 28-117 s (p10-p90); matched 0-15 min (gas) or 0-30 min (central) before; uses the waveform during and
    after the draw; a wrong match is not included
tags:
- stub
chain:
- node: Hospital records clock
  clock: hospital-records
  kind: sync
  effect: The laboratory and anaesthesia record systems keep hospital time (KST). Their offset from UTC and from
    the recorder PC is not observable in the release, which shifts every case to 2100.
  status: assumed
- node: Blood draw
  kind: processing
  status: measured
  effect: Blood is drawn from the arterial line (an access, 28–117 s long) and analysed in theatre or sent on. The
    specimen is stamped 3–12 min after the draw; the lab_draw label marks the matched access.
  offset_s:
  - 190
  - 730
  residual_s:
  - 28
  - 117
  parameter: lab-bg-lag
  studies:
  - lab-timestamp-meaning
  - arterial-line-accesses
- node: Result known
  kind: processing
  status: assumed
  effect: The result follows an unrecorded turnaround; a value is known no earlier than its timestamp plus that
    turnaround.
- node: Stored lab time
  kind: stamping
  status: measured
  offset_s:
  - 1
  - 1
  effect: Whole seconds, one time per specimen shared by every analyte of the panel.
