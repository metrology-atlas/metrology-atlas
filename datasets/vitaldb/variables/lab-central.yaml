id: lab-central
name: Central lab result time
summary: Time stamp of a central laboratory result in the lab table.
group: Laboratory/Result times
type: event
source_name: lab_data (central lab)
device: clinical-records
stamp_clock: hospital-records
timing:
- id: lab-central
  name: lab timestamp
  default: true
  kind: as_stored
  support_s:
  - 0
  - 0
  stamp_position: instant
  grid_s: 1
  bias_s: &id001
    median: 840
    p5: 480
    p95: 1440
    scope: independent
    status: measured
  uncertainty:
    components:
    - name: turnaround between samples
      type: A
      distribution: empirical
      u_s: 291.7933
      scope: independent
  domain: records
  status: measured
  evidence: about 8-24 min after the access (median about 14; weak); result after an unrecorded turnaround
- id: lab-draw
  name: draw time from arterial access
  kind: per_recording
  uses_future: true
  support_s:
  - 28
  - 117
  stamp_position: unknown
  removes_bias_s: *id001
  uncertainty:
    upper_bound: false
    components:
    - name: where in the access the draw is
      type: B
      distribution: rectangular
      u_s: 25.6921
      scope: independent
      status: estimated
  correction: matched arterial-line access
  corrects:
  - lab-central
  domain: records
  status: estimated
  evidence: access 28-117 s (p10-p90); matched 0-15 min (gas) or 0-30 min (central) before; uses the waveform during and
    after the draw; a wrong match is not included
tags:
- stub
chain:
- node: Hospital records clock
  clock: hospital-records
  kind: sync
  effect: The laboratory and anaesthesia record systems keep hospital time (KST). Their offset from UTC and from
    the recorder PC is not observable in the release, which shifts every case to 2100.
  status: assumed
- node: Blood draw
  kind: processing
  status: estimated
  effect: Drawn (often not from the arterial line), sent to the central lab and logged there about 8–24 min later.
  offset_s:
  - 480
  - 1440
  parameter: lab-central-lag
  studies:
  - lab-timestamp-meaning
- node: Result known
  kind: processing
  status: assumed
  effect: The result follows an unrecorded turnaround.
- node: Stored lab time
  kind: stamping
  status: measured
  offset_s:
  - 1
  - 1
  effect: Whole seconds, one time per specimen.
