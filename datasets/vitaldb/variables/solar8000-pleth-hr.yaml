id: solar8000-pleth-hr
name: Solar8000 pulse rate (PLETH_HR)
summary: Pulse rate from the oximeter, a mean of its last 10 pulse intervals leaving out outliers, rounded.
type: numeric
source_name: Solar8000/PLETH_HR
device: solar8000
stamp_clock: recorder-pc
unit: /min
timing:
- id: pleth-hr
  name: as stamped
  default: true
  kind: as_stored
  support_s:
  - 6.0
  - 11.0
  stamp_position: close
  bias_s:
    median: 4.5
    p5: 3.25
    p95: 5.75
    n: 6151
    scope: recording
    status: measured
    evidence: delay from the end of a window of 10 pulse intervals, per recording, recomputing PLETH_HR from the
      plethysmogram's pulses ([[parameter:pleth-hr-delay]])
  uncertainty:
    components:
    - name: between recordings
      type: A
      distribution: empirical
      u_s: 0.74
      scope: recording
      status: measured
      evidence: robust SD (1.4826 x median absolute deviation) of the per-recording delays, 6,151 recordings
  domain: recorder-pc
  status: measured
  evidence: 'a mean of the last 10 pulse intervals, leaving out those far from their median (6.0-11.0 s at the release''s 5th-95th percentile pulse intervals), reported
    4.5 s after it ends, so centred about 8.8 s before the stamp, which the comparison with heart rate confirms
    (8.5 s). Replaces, on 1 Nov 2026, the earlier form (delay 2.79 s, 5th-95th percentile -1.8 to 4.97 s, window 8-12 s;
    numerics-derivation-release), which assumed a median of about 12 beats and centred the window about 1 s too late.'
  studies:
  - pleth-hr-derivation
  - hr-vs-pulse-rate
  - numerics-derivation-release
  - spo2-latency
tags:
- stub
# Links between variables (schema 0.4)
measures:
- measurand: pulse-rate
  method: plethysmogram, monitor algorithm
derived_from:
- variable: snuadc-pleth
  relation: same-source
  note: 'Both come from the Solar8000''s oximeter module: the rate from its own processing, the waveform from its analogue
    output.'
