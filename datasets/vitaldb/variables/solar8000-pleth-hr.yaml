id: solar8000-pleth-hr
name: Solar8000 pulse rate (PLETH_HR)
summary: Pulse rate from the oximeter, over about 12 beats.
type: numeric
source_name: Solar8000/PLETH_HR
device: solar8000
stamp_clock: recorder-pc
unit: /min
timing:
- id: pleth-hr
  name: as stamped
  default: true
  kind: as_stored
  support_s:
  - 8
  - 12
  stamp_position: close
  bias_s:
    median: 2.79
    p5: -1.8
    p95: 4.97
    n: 6150
    scope: recording
    status: measured
  look_ahead:
    lead_s:
    - 0
    - 1.8
    basis: apparent
    note: The lower tail (down to -1.8 s) comes from poorly identified fits, not from a true lead (to check).
  uncertainty:
    components:
    - name: between recordings
      type: A
      distribution: empirical
      u_s: 2.0578
      scope: recording
  domain: recorder-pc
  status: measured
  evidence: 'delay from window end, against the recorded PLETH plus its 0.385 s delay: median 2.8 s (6,150 recordings, 29
    Oct); median of about 12 beats'
  studies:
  - numerics-derivation-release
  - spo2-latency
tags:
- stub
# Links between variables (schema 0.4)
measures:
- measurand: pulse-rate
  method: plethysmogram, monitor algorithm
derived_from:
- variable: snuadc-pleth
  relation: same-source
  note: 'Both come from the Solar8000''s oximeter module: the rate from its own processing, the waveform from its analogue
    output.'
