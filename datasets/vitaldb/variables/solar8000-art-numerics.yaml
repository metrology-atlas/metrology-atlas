id: solar8000-art-numerics
name: Solar8000 ART and CVP numerics
summary: Arterial and central venous pressure values from the Solar8000 monitor.
type: numeric
source_name: Solar8000/ART_MBP
device: solar8000
stamp_clock: recorder-pc
unit: mmHg
timing:
- id: solar-lab
  name: after the per-case delay label
  default: true
  kind: per_recording
  uses_future: true
  support_s:
  - 2
  - 5
  stamp_position: close
  removes_bias_s: &id001
    median: 1.3
    p5: 0.0
    p95: 2.74
    scope: recording
    status: measured
    evidence: 'label delays: systolic 1.05, diastolic 1.1, mean 1.7 s (medians); CVP 3.8 s (2.85-4.8)'
  uncertainty:
    upper_bound: false
    components:
    - name: per-case label
      type: A
      distribution: empirical
      u_s: 0.16
      scope: recording
      evidence: 'label SE median: ART 0.15-0.16 s, CVP 0.21 s'
  correction: per-case delay label
  corrects:
  - solar-win
  domain: solar8000
  status: measured
  evidence: 'numeric_delay labels (about 3,460 ART and 1,331 CVP recordings); windows: ART exponential average of 2-4 beats,
    CVP waveform mean over about 5 s (whole release, 29 Oct)'
  studies:
  - numerics-derivation-release
  - numeric-delay-variability
- id: solar-win
  name: as stamped
  kind: as_stored
  support_s:
  - 2
  - 5
  stamp_position: close
  bias_s: *id001
  uncertainty:
    components:
    - name: between recordings
      type: A
      distribution: empirical
      u_s: 0.8328
      scope: recording
  domain: solar8000
  status: measured
  evidence: label delays from window end (above); 2 s polls; CVP later (3.8 s median)
  studies:
  - numerics-derivation-release
tags:
- stub
delays:
- name: Mean arterial pressure
  parameter: art-mbp-delay
  description: EWMA ¼ per beat; systolic (median over 3 s) and diastolic (EWMA ½) are about 0.5 s shorter.
- name: CVP
  parameter: cvp-delay
  description: Waveform mean over 4 s; the slowest Solar8000 numeric.
