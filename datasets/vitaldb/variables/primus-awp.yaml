id: primus-awp
name: Airway pressure (Primus)
summary: Airway pressure from the Primus anaesthesia machine at 62.5 Hz.
type: waveform
source_name: Primus/AWP
device: primus
stamp_clock: recorder-pc
sample_clock: primus-clock
rate_hz: 62.5
unit: hPa
timing:
- id: primus-sync
  name: after breath matching
  default: true
  kind: per_recording
  uses_future: true
  support_s: &id001
  - 0
  - 0
  stamp_position: instant
  grid_s: 0.016
  removes_bias_s:
    median: {parameter: primus-awp-bias}
    p5: {parameter: primus-awp-bias, use: p5}
    p95: {parameter: primus-awp-bias, use: p95}
    n: 1067
    scope: recording
    status: measured
    evidence: AWP stamp minus the breath on the SNUADC CVP, median per recording, each stretch on its right breath
      (primus-awp-anchoring); includes airway-to-CVP physiology
  uncertainty:
    upper_bound: true
    interval95_s:
    - -4.41
    - 4.4
    likely_u_s: 0.0395
    components:
    - name: breath matching within the recording (a line per stretch between AWP pauses)
      type: A
      distribution: empirical
      u_s: 0.0766
      scope: structured
      length_s: 420
      correlation: exponential
      shared_with: Primus breath matching
      evidence: correlation length 7 min (stage 4b); the same correction for AWP and CO2, so it cancels between them
    - name: the recording's constant
      type: A
      distribution: empirical
      u_s: 0.0121
      scope: recording
      shared_with: Primus breath matching
    - name: sample or stamp grid
      type: B
      distribution: rectangular
      u_s: 0.0046
      scope: independent
    - name: breath identity (a stretch a whole breath off)
      type: A
      distribution: mixture
      u_s: {parameter: primus-breath-error-sd}
      scope: structured
      length_s: 3642
      correlation: rectangular
      shared_with: Primus breath matching
      evidence: after the breath rule, 12.4% of windows sit in a stretch still a whole breath off (0% with the stretch's
        own CVP pauses, 19% carried, 14% from the main mode); one error per stretch between AWP pauses (median 1 h);
        not Gaussian, so the 95% interval is the mixture's (primus-awp-anchoring)
  correction: breath matching to SNUADC (a slope and an offset per AWP stretch), each stretch's breath fixed by
    pauses in ventilation where they resolve it, else carried or taken nearest the main mode
  corrects:
  - primus-raw
  domain: reference
  status: measured
  evidence: 'held-out windows against CVP, signed, on the right breath: robust SD 79 ms, median absolute error 53 ms, 95% -262
    to +272 ms (1,067 recordings, 37,881 windows); likely value 40 ms from the part shared with the ART check (25%); with
    the breath error, 95% -4.41 to +4.40 s'
  studies:
  - primus-awp-conversion
  - primus-awp-anchoring
- id: primus-shift
  name: raw stamps shifted by the release median
  kind: fixed_shift
  support_s: *id001
  stamp_position: instant
  grid_s: 0.016
  removes_bias_s:
    median: {parameter: primus-awp-bias}
    p5: {parameter: primus-awp-bias, use: p5}
    p95: {parameter: primus-awp-bias, use: p95}
    n: 1067
    scope: recording
    status: measured
    evidence: AWP stamp minus the breath on the SNUADC CVP, median per recording, each stretch on its right breath
      (primus-awp-anchoring); includes airway-to-CVP physiology
  uncertainty:
    upper_bound: true
    components:
    - name: between recordings (includes airway-to-CVP physiology)
      type: A
      distribution: empirical
      u_s: {parameter: primus-awp-between-rsd}
      scope: recording
      shared_with: Primus clock
    - name: drift within a stretch (+104 ppm against the PC)
      type: B
      distribution: unknown
      u_s: 0.3
      scope: unknown
      status: estimated
      shared_with: Primus clock
      evidence: about 0.4 s per hour of stretch; not yet measured as a spread
  correction: release median, known in advance
  corrects:
  - primus-raw
  domain: primus
  status: measured
  evidence: 'per-recording lag (CVP minus AWP stamp), each stretch on its right breath: median 1.47 s, so a bias of -1.47 s;
    robust SD 0.70 s (1,067 recordings)'
  studies:
  - primus-awp-conversion
  - primus-awp-anchoring
- id: primus-raw
  name: raw stamps
  kind: as_stored
  support_s: *id001
  stamp_position: instant
  grid_s: 0.016
  bias_s:
    median: {parameter: primus-awp-bias}
    p5: {parameter: primus-awp-bias, use: p5}
    p95: {parameter: primus-awp-bias, use: p95}
    n: 1067
    scope: recording
    status: measured
    evidence: AWP stamp minus the breath on the SNUADC CVP, median per recording, each stretch on its right breath
      (primus-awp-anchoring); includes airway-to-CVP physiology
  uncertainty:
    components:
    - name: between recordings (includes airway-to-CVP physiology)
      type: A
      distribution: empirical
      u_s: {parameter: primus-awp-between-rsd}
      scope: recording
      shared_with: Primus clock
  domain: primus
  status: measured
  evidence: offset median -1.47 s, p5-p95 -3.55 to -0.44 s (1,067 recordings, CVP breaths, each stretch on its right
    breath; the stamps sit before the breath seen in the CVP), incl. AWP-CVP physiology; drifts +104 ppm against the PC
    between AWP pauses
  look_ahead:
    lead_s:
    - 0.44
    - 3.55
    basis: real
    note: >-
      The AWP stamps sit before the breath they record. Against the breath seen in the SNUADC CVP the lead is a median
      1.47 s (5th-95th percentile 0.44 to 3.55 s, each stretch on its right breath). Most of it is real on the recorder's
      own timeline: the PIP numerics, stamped by the PC on arrival, cannot exist before their breath, and they bound the
      AWP lead at a median [[value:primus-awp-lead-bound]] (5th-95th percentile 0.35 to 3.40 s), close to the lead
      against CVP; a few tenths of a second of that lead are the CVP reference's own delay and the airway-to-CVP
      physiology. The stamps are early because the recorder anchors each AWP stretch and counts samples from the
      anchor, and the anchor is set early (primus-awp-anchoring).
  studies:
  - primus-awp-conversion
  - primus-awp-anchoring
tags:
- stub
typed_ok:
- field: timing[primus-shift].uncertainty.components[1].u_s
  parameter: primus-awp-lead-bound
  why: the estimated drift within a stretch (0.3 s), not the lead bound's 5th percentile (0.35 s)
# Links between variables (schema 0.4)
measures:
- measurand: airway-pressure
  method: ventilator pressure sensor
