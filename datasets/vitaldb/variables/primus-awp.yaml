id: primus-awp
name: Airway pressure (Primus)
summary: Airway pressure from the Primus anaesthesia machine at 62.5 Hz.
type: waveform
source_name: Primus/AWP
device: primus
stamp_clock: recorder-pc
sample_clock: primus-clock
rate_hz: 62.5
unit: hPa
timing:
- id: primus-sync
  name: after breath matching
  default: true
  kind: per_recording
  uses_future: true
  support_s: &id001
  - 0
  - 0
  stamp_position: instant
  grid_s: 0.016
  removes_bias_s:
    median: 1.787
    p5: -0.693
    p95: 5.782
    n: 1067
    scope: recording
    status: measured
    evidence: AWP stamp minus the breath on the SNUADC CVP, median per recording; includes airway-to-CVP physiology
  uncertainty:
    upper_bound: true
    interval95_s:
    - -0.262
    - 0.272
    likely_u_s: 0.0395
    components:
    - name: breath matching within the recording (a line per stretch between AWP pauses)
      type: A
      distribution: empirical
      u_s: 0.0766
      scope: structured
      length_s: 420
      correlation: exponential
      shared_with: Primus breath matching
      evidence: correlation length 7 min (stage 4b); the same correction for AWP and CO2, so it cancels between them
    - name: the recording's constant
      type: A
      distribution: empirical
      u_s: 0.0121
      scope: recording
      shared_with: Primus breath matching
    - name: sample or stamp grid
      type: B
      distribution: rectangular
      u_s: 0.0046
      scope: independent
  correction: breath matching to SNUADC (a slope and an offset per AWP stretch)
  corrects:
  - primus-raw
  domain: reference
  status: measured
  evidence: 'held-out windows against CVP, signed: robust SD 79 ms, median absolute error 53 ms, 95% -262 to +272 ms (1,067
    recordings, 37,881 windows); likely value 40 ms from the part shared with the ART check (25%)'
  studies:
  - primus-awp-conversion
- id: primus-shift
  name: raw stamps shifted by the release median
  kind: fixed_shift
  support_s: *id001
  stamp_position: instant
  grid_s: 0.016
  removes_bias_s: &id002
    median: 1.787
    p5: -0.693
    p95: 5.782
    n: 1067
    scope: recording
    status: measured
    evidence: AWP stamp minus the breath on the SNUADC CVP, median per recording; includes airway-to-CVP physiology
  uncertainty:
    upper_bound: true
    components:
    - name: between recordings (includes airway-to-CVP physiology)
      type: A
      distribution: empirical
      u_s: 1.325
      scope: recording
      shared_with: Primus clock
    - name: drift within a stretch (+104 ppm against the PC)
      type: B
      distribution: unknown
      u_s: 0.3
      scope: unknown
      status: estimated
      shared_with: Primus clock
      evidence: about 0.4 s per hour of stretch; not yet measured as a spread
  correction: release median, known in advance
  corrects:
  - primus-raw
  domain: primus
  status: measured
  evidence: 'per-recording raw lag: median 1.8 s, robust SD 1.33 s (1,067 recordings)'
  studies:
  - primus-awp-conversion
- id: primus-raw
  name: raw stamps
  kind: as_stored
  support_s: *id001
  stamp_position: instant
  grid_s: 0.016
  bias_s: *id002
  uncertainty:
    components:
    - name: between recordings (includes airway-to-CVP physiology)
      type: A
      distribution: empirical
      u_s: 1.325
      scope: recording
      shared_with: Primus clock
  domain: primus
  status: measured
  evidence: offset median 1.8 s, p5-p95 -0.7 to +5.8 s (1,067 recordings, CVP breaths), incl. AWP-CVP physiology; drifts
    +104 ppm against the PC between AWP pauses
  look_ahead:
    lead_s:
    - 0
    - 0.69
    basis: apparent
    note: The lower tail (stamp before the CVP breath) is mostly airway-to-CVP physiology in the reference, not a true lead.
  studies:
  - primus-awp-conversion
tags:
- stub
# Links between variables (schema 0.4)
measures:
- measurand: airway-pressure
  method: ventilator pressure sensor
