id: primus-numerics
name: Primus ETCO2, PIP and RR
summary: End-tidal CO2, peak pressure and respiratory rate from the Primus, polled about every 7 s.
type: numeric
source_name: Primus/ETCO2
device: primus
stamp_clock: recorder-pc
timing:
- id: primus-lab
  name: after the per-case delay label
  default: true
  delay_s:
  - 0.07
  - 0.57
  interval_s:
  - 7.0
  - 30.0
  domain: primus
  status: measured
  evidence: 'numeric_delay label SE p10-p90 0.07-0.57 s (RR_CO2 weaker: SE ~1 s)'
  corrected_delay_s:
  - 0.75
  - 7.6
  correction: per-case delay label
  corrects:
  - primus-num
- id: primus-num
  name: as stamped
  delay_s:
  - 0.75
  - 7.6
  interval_s:
  - 7.0
  - 30.0
  domain: primus
  status: measured
  evidence: 'from window end: ETCO2 0.75-3.4, PIP 3.65-6.5, RR 1.6-7.6 s; 7 s polls, RR over 30 s'
tags:
- stub
delays:
- name: ETCO2
  parameter: etco2-delay
  description: Value of the last completed breath.
- name: PIP
  parameter: pip-delay
  description: Value of the last completed breath, from the end of inspiration.
- name: RR
  parameter: rr-delay
  description: 60 / mean breath interval over 30 s.
