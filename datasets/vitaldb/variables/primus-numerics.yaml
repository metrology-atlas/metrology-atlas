id: primus-numerics
name: Primus ETCO2, PIP and RR
summary: End-tidal CO2, peak pressure and respiratory rate from the Primus, polled about every 7 s.
type: numeric
source_name: Primus/ETCO2
device: primus
stamp_clock: recorder-pc
timing:
- id: primus-lab
  name: after the per-case delay label
  default: true
  kind: per_recording
  uses_future: true
  support_s:
  - 3
  - 30
  stamp_position: close
  removes_bias_s:
    median: 3.0
    p5: 0.55
    p95: 8.5
    scope: recording
    status: measured
    evidence: 'label delays: ETCO2 median 1.55 s, PIP 4.6 s, RR 4.3 s (p5-p95 over all three 0.55-8.5 s)'
  uncertainty:
    upper_bound: false
    components:
    - name: per-case label
      type: A
      distribution: empirical
      u_s: 0.21
      scope: recording
      evidence: 'label SE median: ETCO2 0.20 s, PIP 0.23 s; RR weaker, 1.0 s'
  correction: per-case delay label
  corrects:
  - primus-num
  domain: primus
  status: measured
  evidence: numeric_delay labels (6,186 ETCO2, 5,894 PIP, 6,114 RR recordings); the CO2-based delays are against the CO2
    waveform, which trails the breath by 3.6 s (sampling line)
- id: primus-num
  name: as stamped
  kind: as_stored
  support_s:
  - 3
  - 30
  stamp_position: close
  bias_s:
    median: 3.0
    p5: 0.55
    p95: 8.5
    scope: recording
    status: measured
  uncertainty:
    components:
    - name: between recordings and numerics
      type: A
      distribution: empirical
      u_s: 2.4164
      scope: recording
  domain: primus
  status: measured
  evidence: 'label delays from window end: ETCO2 1.55, PIP 4.6, RR 4.3 s (medians); 7 s polls; ETCO2 and PIP one breath,
    RR about 30 s'
tags:
- stub
delays:
- name: ETCO2
  parameter: etco2-delay
  description: Value of the last completed breath.
- name: PIP
  parameter: pip-delay
  description: Value of the last completed breath, from the end of inspiration.
- name: RR
  parameter: rr-delay
  description: 60 / mean breath interval over 30 s.
