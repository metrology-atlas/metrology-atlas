id: snuadc-art
name: Arterial pressure (SNUADC)
summary: Invasive arterial pressure, sampled by SNUADC at 500 Hz from the monitor's analogue output.
type: waveform
source_name: SNUADC/ART
device: snuadc
stamp_clock: recorder-pc
sample_clock: snuadc-sample
rate_hz: 500
unit: mmHg
timing:
- id: snu-model
  name: stamp-model time
  default: true
  kind: per_recording
  uses_future: true
  support_s:
  - 0
  - 0
  stamp_position: instant
  grid_s: 0.002
  removes_bias_s:
    median: 0.24
    p5: 0.01
    p95: 0.47
    scope: structured
    status: measured
    evidence: 'the sawtooth: stamps run late by up to 480 ms (stamp after the true time) before each downward correction'
  uncertainty:
    upper_bound: false
    components:
    - name: stamp-model residual where corrections are seen
      type: B
      distribution: unknown
      u_s: 0.0015
      scope: unknown
      status: estimated
      shared_with: SNUADC stamp model
    - name: 500 Hz samples
      type: B
      distribution: rectangular
      u_s: 0.0006
      scope: independent
  correction: 'stamp model (physiosync.stamp_clock): one rate, one offset per stretch'
  corrects:
  - snu-raw
  domain: reference
  status: estimated
  evidence: stamp-model residual where corrections are seen; recordings without corrections drift on the port's assumed
    rate by 31 ppm (spread between recordings; 76 ms/h median), carried by the clock domain; 100 Hz files 10 ms; this form
    is the working reference
  studies:
  - hum-snuadc-rate
  - art-240hz-timing
- id: snu-hum
  name: stamp-model time, SNUADC rate from the mains hum
  kind: per_recording
  uses_future: true
  support_s:
  - 0
  - 0
  stamp_position: instant
  grid_s: 0.002
  removes_bias_s:
    median: 0.24
    p5: 0.01
    p95: 0.47
    scope: structured
    status: measured
    evidence: 'the sawtooth: stamps run late by up to 480 ms (stamp after the true time) before each downward correction'
  uncertainty:
    upper_bound: false
    components:
    - name: stamp-model residual where corrections are seen
      type: B
      distribution: unknown
      u_s: 0.0015
      scope: unknown
      status: estimated
      shared_with: SNUADC stamp model
    - name: 500 Hz samples
      type: B
      distribution: rectangular
      u_s: 0.0006
      scope: independent
  correction: stamp model with the SNUADC rate from the mains hum where the stamps carry no correction (vitaldb-bench tools/hum_snuadc_rate.py,
    passed to physiosync.stamp_clock as rate_ppm)
  corrects:
  - snu-raw
  domain: reference-hum
  status: estimated
  evidence: '1,248 of the 3,622 recordings without stamp corrections have hum; elsewhere this form is the stamp-model form.
    Against the BIS bursts on 224 recordings not used to build it: drift 13 ppm (zero-centred robust SD) instead of 31 ppm,
    31 instead of 76 ms/h median'
  studies:
  - hum-snuadc-rate
  - art-240hz-timing
- id: snu-raw
  name: raw stamps
  kind: as_stored
  support_s:
  - 0
  - 0
  stamp_position: instant
  grid_s: 0.002
  bias_s:
    median: 0.24
    p5: 0.01
    p95: 0.47
    scope: structured
    status: measured
  uncertainty:
    components:
    - name: sawtooth position
      type: A
      distribution: rectangular
      u_s: 0.1386
      scope: structured
      length_s: 7488
      correlation: rectangular
      shared_with: SNUADC clock
      evidence: 'length: the step-mode correction period, 2.08 h'
  domain: snuadc-raw
  status: measured
  evidence: sawtooth up to 480 ms (step-mode corrections, downwards)
tags:
- stub
chain:
- node: SNUADC sample clock
  clock: snuadc-sample
  kind: clock
  effect: SNUADC samples on its own crystal; the recorder stamps each 0.2 s record from its model of that clock.
    In step mode the stamps drift (−63 ppm median) and are pulled back about 0.48 s whenever the drift reaches half
    a second; in frequent-correction mode they stay within about 10 ms. The atlas's stamp model refits the line.
  bias_s:
  - 0.01
  - 0.48
  u_s: 0.0016
  drift: −63 ppm median in step mode, pulled back about every 2.08 h
  status: measured
  link: snuadc-step-vs-pc
  studies:
  - snuadc-stamp-sawtooth
- node: Signal lost at resets
  kind: correction
  effect: At each step-mode reset about 18–20 ms of signal is never sampled, while every record still holds 100
    samples. The stamp model adds the loss back at the end of the last record before the new grid; samples inside
    that record can still be up to about 20 ms late.
  bias_s:
  - 0.0172
  - 0.0182
  u_s: 0.0058
  status: measured
  parameter: snuadc-reset-loss
  studies:
  - paced-ecg
- node: Monitor analogue output
  kind: transport
  effect: The arterial pressure reaches SNUADC as the patient monitor's analogue output. Any delay inside the monitor
    is common to the ECG and pressure channels and has not been measured.
  status: assumed
- node: Stored sample time
  kind: stamping
  effect: Sample j of a record sits at its stamp + j/500 s. Stamps run −0.95 ppm against the sample count (stamp
    arithmetic), and the five records after each reset are written out of order; the [[code:timenet/packages/timenet-connectors/src/timenet_connectors/datasets/vitaldb/vitaldb/connector.py|TimeNet import]] puts them back
    in sampling order.
  span_s:
  - 0.002
  - 0.002
  status: measured
# Links between variables (schema 0.4)
measures:
- measurand: arterial-pressure
  method: invasive, arterial line (the Solar8000's analogue output)
