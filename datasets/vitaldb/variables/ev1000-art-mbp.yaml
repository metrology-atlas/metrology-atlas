id: ev1000-art-mbp
name: EV1000 mean arterial pressure
summary: Mean arterial pressure from the EV1000 platform, updated every 20 s.
type: numeric
source_name: EV1000/ART_MBP
device: ev1000
stamp_clock: recorder-pc
unit: mmHg
timing:
- id: ev1000-sync
  name: after MAP alignment
  default: true
  kind: per_recording
  uses_future: true
  support_s:
  - 20
  - 20
  stamp_position: close
  removes_bias_s: &id001
    median: 1.6
    p95: 3.2
    scope: recording
    status: measured
    evidence: 'from the end of an assumed 20 s window: median 1.6 s (p25 0.9, p95 3.2; 579 cases)'
  uncertainty:
    upper_bound: true
    components:
    - name: MAP alignment residual
      type: A
      distribution: empirical
      u_s: 0.77
      scope: recording
      status: estimated
      evidence: per-recording residual SD p5-p95 0.25-2.4 s; geometric middle
  correction: MAP alignment to SNUADC ART
  corrects:
  - ev1000
  domain: reference
  status: measured
  evidence: residual SD 0.25-2.4 s (p5-p95); three-way loop closes, median +0.13 s
- id: ev1000
  name: as stamped
  kind: as_stored
  support_s:
  - 20
  - 20
  stamp_position: close
  bias_s: *id001
  uncertainty:
    components:
    - name: between recordings
      type: A
      distribution: empirical
      u_s: 0.9726
      scope: recording
  domain: ev1000
  status: measured
  evidence: 'from the end of an assumed 20 s window: median 1.6 s (p25 0.9, p95 3.2; 579 cases)'
tags:
- stub
# Links between variables (schema 0.4)
measures:
- measurand: mean-arterial-pressure
  method: invasive, the EV1000's own pressure sensor (to check)
