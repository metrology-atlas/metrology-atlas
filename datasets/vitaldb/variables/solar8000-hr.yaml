id: solar8000-hr
name: Solar8000 heart rate
summary: Heart rate from the Solar8000, in one of two delay groups per case.
type: numeric
source_name: Solar8000/HR
device: solar8000
stamp_clock: recorder-pc
unit: /min
timing:
- id: hr-lab
  name: after the per-case delay label
  default: true
  kind: per_recording
  uses_future: true
  support_s:
  - 6
  - 10
  stamp_position: close
  removes_bias_s:
    median: 3.75
    p5: 1.3
    p95: 5.35
    n: 6222
    scope: recording
    status: measured
  uncertainty:
    upper_bound: false
    components:
    - name: per-case label
      type: A
      distribution: empirical
      u_s: 0.256
      scope: recording
      evidence: label SE p10-p90 0.12-0.61 s; the 795 group-uncertain recordings carry a two-group mixture (2.3 s apart),
        not included
  correction: per-case delay label (early or late group)
  corrects:
  - hr-early
  - hr-late
  domain: solar8000
  status: measured
  evidence: numeric_delay labels, 6,222 recordings; window about 8 s (6-10 s), whole release 29 Oct
  studies:
  - numerics-derivation-release
  - hr-delay-groups
- id: hr-early
  name: as stamped, early group
  kind: as_stored
  support_s:
  - 6
  - 10
  stamp_position: close
  bias_s:
    median: 1.75
    p5: 0.8
    p95: 2.4
    scope: shared
    shared_with: the recording PC's delay group
    status: measured
  uncertainty:
    components:
    - name: within the group
      type: A
      distribution: empirical
      u_s: 0.4863
      scope: recording
  domain: solar8000
  status: measured
  evidence: label delays of the early group, 1,775 recordings
  studies:
  - numerics-derivation-release
  - hr-delay-groups
- id: hr-late
  name: as stamped, late group
  kind: as_stored
  support_s:
  - 6
  - 10
  stamp_position: close
  bias_s:
    median: 4.35
    p5: 3.45
    p95: 5.7
    scope: shared
    shared_with: the recording PC's delay group
    status: measured
  uncertainty:
    components:
    - name: within the group
      type: A
      distribution: empirical
      u_s: 0.6839
      scope: recording
  domain: solar8000
  status: measured
  evidence: label delays of the late group, 3,652 recordings; one extra 2 s poll; follows the PC
  studies:
  - numerics-derivation-release
  - hr-delay-groups
chain:
- node: Heart rate algorithm
  kind: window
  effect: The Solar8000 averages heart rate over a window of about 6–8 s of ECG.
  span_s:
  - 6.0
  - 8.0
  status: measured
- node: Polled by the recorder
  kind: transport
  effect: The value reaches the recorder 1.05–2.3 s after its window ends in the early group of cases, or 3.6–5.25
    s in the late group (one extra 2 s poll cycle). A per-case delay label fixes the offset to 0.12–0.61 s (standard
    error, p10–p90).
  bias_s: [0.8, 5.7]
  u_s: 0.256
  status: measured
- node: Stored stamp
  clock: recorder-pc
  kind: stamping
  effect: Stamped by the recorder on arrival, on a 1 ms grid; the receipt latency is not measured.
  bias_s:
  - 0.001
  - 0.02
  status: estimated
window:
  name: Heart rate window
  parameter: hr-window
  description: 60 / median R–R over about 6 s, truncated to a whole beat per minute.
delays:
- name: Early group
  parameter: hr-delay-early
  description: From the end of the window to the stamp, in about a third of cases.
- name: Late group
  parameter: hr-delay-late
  description: One 2 s poll later, in about two thirds of cases. The group belongs to the recording PC.
description: The Solar8000 computes heart rate from its own ECG as 60 / median R–R over about 6 s, truncated, and
  the recorder polls it every 2 s. The value is stamped on arrival, one or two polls after its window ends depending
  on the recording PC ([[observation:hr-two-delay-groups]]). Per-case delay labels fix the offset to a few hundred
  ms.
value:
  kind: single_resolution
  resolution: 1 /min, truncated
  step: 1
  anchor: floor
  anchor_basis: tested
  anchor_note: 'Truncation fits better than rounding in 98.6% of 6,343 recordings (numeric derivation, whole release, 29
    Oct): a recorded 72 means 72 to 73; on average the record is 0.5 /min low.'
  status: measured
