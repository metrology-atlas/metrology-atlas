id: solar8000-hr
name: Solar8000 heart rate
summary: Heart rate from the Solar8000, in one of two delay groups per case.
type: numeric
source_name: Solar8000/HR
device: solar8000
stamp_clock: recorder-pc
unit: /min
timing:
- id: hr-lab
  name: after the per-case delay label
  default: true
  kind: per_recording
  uses_future: true
  support_s: {parameter: hr-window-span, use: p10-p90}
  stamp_position: close
  removes_bias_s:
    median: {parameter: hr-label-delay, plus: {parameter: solar8000-poll-gap, scale: 0.5}}
    p5: {parameter: hr-label-delay, use: p5, plus: {parameter: solar8000-poll-gap, scale: 0.5}}
    p95: {parameter: hr-label-delay, use: p95, plus: {parameter: solar8000-poll-gap, scale: 0.5}}
    n: 6233
    scope: recording
    status: measured
  uncertainty:
    upper_bound: false
    components:
    - name: per-case label
      type: A
      distribution: empirical
      u_s: {parameter: hr-label-se}
      scope: recording
      evidence: label SE p10-p90 0.09-0.55 s; the 234 group-uncertain recordings carry a two-group mixture (2.3 s apart),
        not included
    - name: wait for the poll
      type: B
      distribution: rectangular
      u_s: {parameter: solar8000-poll-gap, rectangular: true}
      scope: independent
      evidence: a value waits between none and all of the 2 s record gap before the recorder stamps it
        (the delay fits' uniform phase); the monitor's HR and PLETH_HR change about 1 s later than this predicts, so the mean delay may be longer
        ([[study:numeric-delay-check]])
  correction: per-case delay label (early or late group)
  corrects:
  - hr-early
  - hr-late
  domain: recorder-pc
  status: measured
  evidence: numeric_delay labels with the 8-interval HR rule, 6,233 recordings, whole release 1 Nov; support the last 8 R-R
    intervals, p10-p90 over recordings (hr-derivation)
  studies:
  - numerics-derivation-release
  - hr-delay-groups
  - hr-derivation
  checked: 2026-11-07
- id: hr-early
  name: as stamped, early group
  kind: as_stored
  support_s: {parameter: hr-window-span, use: p10-p90}
  stamp_position: close
  bias_s:
    median: {parameter: hr-early-label-delay, plus: {parameter: solar8000-poll-gap, scale: 0.5}}
    p5: {parameter: hr-early-label-delay, use: p5, plus: {parameter: solar8000-poll-gap, scale: 0.5}}
    p95: {parameter: hr-early-label-delay, use: p95, plus: {parameter: solar8000-poll-gap, scale: 0.5}}
    scope: shared
    shared_with: the recording PC's delay group
    status: measured
  uncertainty:
    components:
    - name: within the group
      type: A
      distribution: empirical
      u_s: {parameter: hr-early-delay-rsd}
      scope: recording
    - name: wait for the poll
      type: B
      distribution: rectangular
      u_s: {parameter: solar8000-poll-gap, rectangular: true}
      scope: independent
      evidence: a value waits between none and all of the 2 s record gap before the recorder stamps it
        (the delay fits' uniform phase); the monitor's HR and PLETH_HR change about 1 s later than this predicts, so the mean delay may be longer
        ([[study:numeric-delay-check]])
  domain: recorder-pc
  status: measured
  evidence: label delays of the early group, 2,228 recordings (labels of 1 Nov); within-group spread as a robust SD
  studies:
  - numerics-derivation-release
  - hr-delay-groups
  - hr-derivation
  checked: 2026-11-07
- id: hr-late
  name: as stamped, late group
  kind: as_stored
  support_s: {parameter: hr-window-span, use: p10-p90}
  stamp_position: close
  bias_s:
    median: {parameter: hr-late-label-delay, plus: {parameter: solar8000-poll-gap, scale: 0.5}}
    p5: {parameter: hr-late-label-delay, use: p5, plus: {parameter: solar8000-poll-gap, scale: 0.5}}
    p95: {parameter: hr-late-label-delay, use: p95, plus: {parameter: solar8000-poll-gap, scale: 0.5}}
    scope: shared
    shared_with: the recording PC's delay group
    status: measured
  uncertainty:
    components:
    - name: within the group
      type: A
      distribution: empirical
      u_s: {parameter: hr-late-delay-rsd}
      scope: recording
    - name: wait for the poll
      type: B
      distribution: rectangular
      u_s: {parameter: solar8000-poll-gap, rectangular: true}
      scope: independent
      evidence: a value waits between none and all of the 2 s record gap before the recorder stamps it
        (the delay fits' uniform phase); the monitor's HR and PLETH_HR change about 1 s later than this predicts, so the mean delay may be longer
        ([[study:numeric-delay-check]])
  domain: recorder-pc
  status: measured
  evidence: label delays of the late group, 3,771 recordings (labels of 1 Nov); within-group spread as a robust SD; one
    extra 2 s poll; follows the PC
  studies:
  - numerics-derivation-release
  - hr-delay-groups
  - hr-derivation
  checked: 2026-11-07
chain:
- node: Heart rate algorithm
  kind: window
  effect: 'The Solar8000 computes heart rate as 60 over the mean of the last [[value:hr-window|number]] R–R intervals,
    leaving out those far from their median ([[study:hr-derivation]]), so [[value:hr-window-span]] of ECG at the median rate.'
  span_s: {parameter: hr-window-span, use: p10-p90}
  status: measured
- node: Polled by the recorder
  kind: transport
  effect: The value is ready 1.25–2.4 s after its window ends in the early group of cases, or 3.7–4.8 s in the late
    group (one extra 2 s poll cycle; p10–p90), and then waits up to one 2 s poll before the recorder stamps it
    ([[parameter:solar8000-poll-gap]]). A per-case delay label fixes the offset to a median
    [[value:hr-label-se]] (standard error).
  bias_s:
  - {parameter: hr-early-label-delay, use: p5}
  - {parameter: hr-late-label-delay, use: p95, plus: {parameter: solar8000-poll-gap}}
  u_s: {parameter: hr-label-se}
  status: measured
- node: Stored stamp
  clock: recorder-pc
  kind: stamping
  effect: Stamped by the recorder on arrival, on a 1 ms grid; the receipt latency is not measured.
  bias_s:
  - 0.001
  - 0.02
  status: estimated
window:
  name: Heart rate window
  parameter: hr-window
  description: 60 over the mean of the last 8 R–R intervals within about 10–25% of their median, truncated to a whole
    beat per minute.
delays:
- name: Early group
  parameter: hr-delay-early
  description: From the end of the window to the stamp, in about a third of cases.
- name: Late group
  parameter: hr-delay-late
  description: One 2 s poll later, in about two thirds of cases. The group belongs to the recording PC.
description: The Solar8000 computes heart rate from its own ECG as 60 over the mean of the last 8 R–R intervals, leaving
  out those far from their median, truncated ([[study:hr-derivation]]), and
  the recorder polls it every 2 s. The value is stamped on arrival, one or two polls after its window ends depending
  on the recording PC ([[observation:hr-two-delay-groups]]). Per-case delay labels fix the offset to a few hundred
  ms.
value:
  kind: single_resolution
  resolution: 1 /min, truncated
  step: 1
  anchor: floor
  anchor_basis: tested
  anchor_note: 'Truncation fits better than rounding in 98.6% of 6,343 recordings (numeric derivation, whole release, 29
    Oct): a recorded 72 means 72 to 73; on average the record is 0.5 /min low.'
  status: measured
# Links between variables (schema 0.4)
measures:
- measurand: heart-rate
  method: ECG, monitor algorithm
derived_from:
- variable: snuadc-ecg-ii
  relation: same-source
  note: The Solar8000 computes HR from its own ECG; SNUADC records that monitor's analogue ECG output.
