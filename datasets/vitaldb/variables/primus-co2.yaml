id: primus-co2
name: Capnogram (Primus)
summary: Sidestream CO2 from the Primus at 62.5 Hz; the sampling line delays it by a median 3.6 s ([[study:co2-sampling-line]]).
type: waveform
source_name: Primus/CO2
device: primus
stamp_clock: recorder-pc
sample_clock: primus-clock
rate_hz: 62.5
unit: mmHg
timing:
- id: primus-sync
  name: after breath matching
  default: true
  kind: per_recording
  uses_future: true
  support_s: &id001
  - 0.04
  - 0.04
  stamp_position: close
  grid_s: 0.016
  removes_bias_s:
    median: {parameter: primus-awp-bias}
    p5: {parameter: primus-awp-bias, use: p5}
    p95: {parameter: primus-awp-bias, use: p95}
    n: 1067
    scope: recording
    status: measured
    evidence: AWP stamp minus the breath on the SNUADC CVP, median per recording, each stretch on its right breath
      (primus-awp-anchoring); includes airway-to-CVP physiology
  uncertainty:
    upper_bound: true
    interval95_s:
    - -4.41
    - 4.4
    likely_u_s: 0.2553
    components:
    - name: breath matching within the recording (a line per stretch between AWP pauses)
      type: A
      distribution: empirical
      u_s: 0.0766
      scope: structured
      length_s: 420
      correlation: exponential
      shared_with: Primus breath matching
      evidence: correlation length 7 min (stage 4b); the same correction for AWP and CO2, so it cancels between them
    - name: the recording's constant
      type: A
      distribution: empirical
      u_s: 0.0121
      scope: recording
      shared_with: Primus breath matching
    - name: sampling line, between recordings
      type: A
      distribution: empirical
      u_s: 0.252
      scope: recording
    - name: breath identity (a stretch a whole breath off)
      type: A
      distribution: mixture
      u_s: {parameter: primus-breath-error-sd}
      scope: structured
      length_s: 3642
      correlation: rectangular
      shared_with: Primus breath matching
      evidence: the same breath matching as primus-awp, so the same breath error, and it cancels between AWP and CO2
        (primus-awp-anchoring)
    - &id002
      name: hold position on the sliding 40 ms update grid
      type: B
      distribution: rectangular
      u_s: 0.0115
      scope: independent
  correction: breath matching to SNUADC (a slope and an offset per AWP stretch)
  corrects:
  - primus-raw
  domain: reference
  status: measured
  evidence: 'held-out windows against CVP, signed, on the right breath: robust SD 79 ms, median absolute error 53 ms, 95% -262
    to +272 ms (1,067 recordings, 37,881 windows); likely value 40 ms from the part shared with the ART check (25%); with
    the breath error, 95% -4.41 to +4.40 s'
  bias_s:
    name: sampling line (sidestream transport) and the 40 ms hold
    median: 3.625
    p5: 0.874
    p95: 4.073
    n: 6341
    scope: recording
    status: measured
    evidence: CO2 fall after the AWP breath start, median per recording (co2_transit, 29 Oct) plus 20 ms for the sliding
      40 ms hold
  studies:
  - co2-sampling-line
  - ventilator-breath-matching
  - primus-co2-update-grid
  - primus-awp-anchoring
- id: primus-shift
  name: raw stamps shifted by the release median
  kind: fixed_shift
  support_s: *id001
  stamp_position: close
  grid_s: 0.016
  removes_bias_s: &id003
    median: 2.156
    p5: 0.073
    p95: 3.182
    n: 1067
    scope: recording
    status: measured
    evidence: 'the AWP bias (-1.469 s, each stretch on its right breath) plus the CO2 sampling line (3.625 s): sums of medians
      and of the tails, approximate'
  uncertainty:
    upper_bound: true
    components:
    - name: between recordings (includes airway-to-CVP physiology)
      type: A
      distribution: empirical
      u_s: {parameter: primus-awp-between-rsd}
      scope: recording
      shared_with: Primus clock
    - name: drift within a stretch (+104 ppm against the PC)
      type: B
      distribution: unknown
      u_s: 0.3
      scope: unknown
      status: estimated
      shared_with: Primus clock
      evidence: about 0.4 s per hour of stretch; not yet measured as a spread
    - *id002
  correction: release median, known in advance
  corrects:
  - primus-raw
  domain: primus
  status: measured
  evidence: 'per-recording offset: median 2.16 s (AWP bias plus the sampling line), robust SD 0.70 s (1,067 recordings)'
  studies:
  - co2-sampling-line
  - primus-co2-update-grid
  - primus-awp-anchoring
- id: primus-raw
  name: raw stamps
  kind: as_stored
  support_s: *id001
  stamp_position: close
  grid_s: 0.016
  bias_s: *id003
  uncertainty:
    components:
    - name: between recordings (includes airway-to-CVP physiology)
      type: A
      distribution: empirical
      u_s: {parameter: primus-awp-between-rsd}
      scope: recording
      shared_with: Primus clock
    - *id002
  domain: primus
  status: measured
  evidence: AWP offset median -1.47 s, p5-p95 -3.55 to -0.44 s (1,067 recordings, CVP breaths, each stretch on its right
    breath), incl. AWP-CVP physiology; drifts +104 ppm against the PC between AWP pauses; plus the 3.6 s sampling line,
    so +2.16 s (p5-p95 +0.07 to +3.18 s); the CO2 stamp comes after its breath in at least 95% of recordings
  studies:
  - co2-sampling-line
  - primus-co2-update-grid
  - primus-awp-anchoring
tags:
- stub
typed_ok:
- field: timing[primus-shift].uncertainty.components[1].u_s
  parameter: primus-awp-lead-bound
  why: the estimated drift within a stretch (0.3 s), not the lead bound's 5th percentile (0.35 s)
# Links between variables (schema 0.4)
measures:
- measurand: airway-co2
  method: sidestream capnography
