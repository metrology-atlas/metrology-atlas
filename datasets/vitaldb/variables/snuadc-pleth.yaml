id: snuadc-pleth
name: Plethysmogram (SNUADC)
summary: The pulse oximeter's plethysmogram, sampled by SNUADC at 500 Hz. It reaches SNUADC through the oximeter's
  own 30 Hz frame clock and a hardware delay of about 0.4 s.
type: waveform
source_name: SNUADC/PLETH
device: snuadc
stamp_clock: recorder-pc
sample_clock: snuadc-sample
rate_hz: 500
timing:
- id: pleth-shift
  name: stamp-model time, shifted by the oximeter delay
  default: true
  kind: fixed_shift
  support_s:
  - 0
  - 0
  stamp_position: instant
  grid_s: 0.033
  removes_bias_s:
    value: {parameter: pleth-chain-delay}
    scope: release
    status: measured
  uncertainty:
    upper_bound: false
    components:
    - name: oximeter hardware delay
      type: B
      distribution: rectangular
      u_s: 0.0115
      scope: release
      evidence: 0.365-0.405 s with the PAT range
    - name: stamp-model residual
      type: B
      distribution: unknown
      u_s: 0.0015
      scope: unknown
      status: estimated
      shared_with: SNUADC stamp model
    - name: 30 Hz frames
      type: B
      distribution: rectangular
      u_s: 0.0095
      scope: independent
  correction: one global hardware delay, known in advance
  corrects:
  - pleth
  - pleth-raw-step
  - pleth-raw-frequent
  domain: reference
  status: measured
  evidence: one global hardware delay (pat-offset-census), 0.385 s (0.365-0.405 s with the adopted PAT's 250-290 ms range)
- id: pleth
  name: stamp-model time
  kind: as_stored
  support_s:
  - 0
  - 0
  stamp_position: instant
  grid_s: 0.033
  bias_s:
    name: oximeter hardware delay
    value: {parameter: pleth-chain-delay}
    scope: release
    status: measured
  uncertainty:
    components:
    - name: oximeter hardware delay
      type: B
      distribution: rectangular
      u_s: 0.0115
      scope: release
    - name: stamp-model residual
      type: B
      distribution: unknown
      u_s: 0.0015
      scope: unknown
      status: estimated
      shared_with: SNUADC stamp model
    - name: 30 Hz frames
      type: B
      distribution: rectangular
      u_s: 0.0095
      scope: independent
  domain: reference
  status: measured
  evidence: one global hardware delay (pat-offset-census), 0.385 s; 30 Hz frames
- id: pleth-raw-step
  name: raw stamps, step mode
  kind: as_stored
  support_s:
  - 0
  - 0
  stamp_position: instant
  grid_s: 0.033
  bias_s:
    name: stamp sawtooth plus oximeter hardware delay
    median: 0.645
    p5: 0.415
    p95: 0.935
    scope: structured
    status: measured
  uncertainty:
    components:
    - name: sawtooth position
      type: A
      distribution: rectangular
      u_s: {parameter: snuadc-step-correction-size, rectangular: true}
      scope: structured
      length_s: {parameter: snuadc-step-period}
      correlation: rectangular
      shared_with: SNUADC clock
      evidence: 'the tooth height, 0.50 s, as a rectangular width; length: the step-mode correction period'
    - name: oximeter hardware delay
      type: B
      distribution: rectangular
      u_s: 0.0115
      scope: release
    - name: 30 Hz frames
      type: B
      distribution: rectangular
      u_s: 0.0095
      scope: independent
  domain: snuadc-raw
  mode: step
  status: measured
  evidence: 'the SNUADC raw stamps in step mode (snuadc-ecg-ii form snu-raw-step: median 0.26 s, p5-p95 0.03-0.55 s) plus the oximeter hardware delay, 0.385 s (pat-offset-census)'
  studies:
  - snuadc-stamp-sawtooth
  - pat-offset-census
- id: pleth-raw-frequent
  name: raw stamps, frequent-correction mode
  kind: as_stored
  support_s:
  - 0
  - 0
  stamp_position: instant
  grid_s: 0.033
  bias_s:
    name: stamps between corrections plus oximeter hardware delay
    median: 0.392
    p5: 0.388
    p95: 0.398
    scope: structured
    status: measured
  uncertainty:
    components:
    - name: position between corrections
      type: A
      distribution: rectangular
      u_s: 0.0014
      scope: structured
      length_s: 3300
      correlation: rectangular
      shared_with: SNUADC clock
      evidence: 'the tooth height, 5 ms, as a rectangular width; length: one forward step about every 55 minutes
        (median 1.1 per hour, [[parameter:snuadc-frequent-steps]])'
    - name: oximeter hardware delay
      type: B
      distribution: rectangular
      u_s: 0.0115
      scope: release
    - name: 30 Hz frames
      type: B
      distribution: rectangular
      u_s: 0.0095
      scope: independent
  domain: snuadc-raw
  mode: frequent
  status: measured
  evidence: 'the SNUADC raw stamps in frequent-correction mode (snuadc-ecg-ii form snu-raw-frequent: median 0.007 s, p5-p95 0.003-0.013 s) plus the oximeter hardware delay, 0.385 s (pat-offset-census)'
  studies:
  - snuadc-stamp-sawtooth
  - pat-offset-census
tags:
- stub
chain:
- node: SNUADC sample clock
  clock: snuadc-sample
  kind: clock
  effect: SNUADC samples on its own crystal; the recorder stamps each 0.2 s record from its model of that clock.
    In step mode the stamps drift (−63 ppm median) and are pulled back about 0.48 s whenever the drift reaches half
    a second; in frequent-correction mode they stay within about 10 ms. The atlas's stamp model refits the line.
  bias_s:
  - 0.01
  - 0.48
  u_s: 0.0016
  drift: −63 ppm median in step mode, pulled back about every 2.08 h
  status: measured
  link: snuadc-step-vs-pc
  studies:
  - snuadc-stamp-sawtooth
- node: Signal lost at resets
  kind: correction
  effect: At each step-mode reset about 18–20 ms of signal is never sampled, while every record still holds 100
    samples. The stamp model adds the loss back at the end of the last record before the new grid; samples inside
    that record can still be up to about 20 ms late.
  bias_s:
  - {parameter: snuadc-reset-loss, use: min}
  - {parameter: snuadc-reset-loss, use: max}
  u_s: 0.0058
  status: measured
  parameter: snuadc-reset-loss
  studies:
  - paced-ecg
- node: Pulse oximeter module
  kind: processing
  effect: 'The oximeter filters the plethysmogram and plays it out about 0.4 s late (one delay for the release: 0.385 s, with the adopted 0.27 s finger PAT; 0.365–0.405 s over its plausible range), in 33.3
    ms frames on its own clock. Its content runs 18–52 ppm against those frames, so every 11–31 min the delay
    steps by one frame: a sawtooth in the delay.'
  bias_s:
  - {parameter: pleth-chain-delay, use: min}
  - {parameter: pleth-chain-delay, use: max}
  drift: 18–52 ppm against its frames; one 33.3 ms slip every 11–31 min
  status: measured
  clock: oximeter-frame-clock
  studies:
  - ppg-frame-clock
  - ppg-sawtooth
  - ppg-offset-reference
  link: pleth-content-vs-frames
  parameter: pleth-chain-delay
- node: Frame slips corrected
  kind: correction
  effect: '[[software:physiosync]] detects the slips and removes the sawtooth; mid-tooth drift of 2–5 ms remains in trusted stretches.'
  bias_s:
  - 0.0
  - 0.0333
  u_s: 0.003
  status: measured
  studies:
  - ppg-sawtooth
  - ppg-art-reference
- node: Monitor analogue output
  kind: transport
  effect: The plethysmogram leaves the monitor as an analogue output; any delay there is not measured.
  status: assumed
- node: Stored sample time
  kind: stamping
  effect: Sample j of a record sits at its stamp + j/500 s. Stamps run −0.95 ppm against the sample count (stamp
    arithmetic), and the five records after each reset are written out of order; [[code:vitaldb-reader/src/vitaldb_reader/resets.py|vitaldb-reader]] puts them back
    in sampling order.
  span_s:
  - 0.002
  - 0.002
  status: measured
typed_ok:
- field: chain[0].bias_s[0]
  parameter: snuadc-raw-frequent-bias
  why: the sawtooth chain step's smallest offset (0.01 s just after a correction), not the frequent-mode p95
figures:
  - id: spectrum-snuadc-pleth
    file: spectrum-snuadc-pleth.png
    study: waveform-frequency-content
    theme: population results
    source: vitaldb-bench tools/spectra_agg.py (`$W/spectra/agg`)
    caption: >-
      The median over recordings of each recording's median one-minute power spectrum (line) and the interquartile range across recordings (band), in physical units per hertz on log axes, with the rounding floor (dashed). 6,140 recordings. The plethysmogram's content ends by about 8 Hz; a quarter of recordings carry a line near 24.5 Hz.
    alt: >-
      A log-log spectrum peaking near 1 Hz, falling steeply by 8 Hz to a floor just above the dashed rounding floor, with a small labelled peak at 24.5 Hz.
