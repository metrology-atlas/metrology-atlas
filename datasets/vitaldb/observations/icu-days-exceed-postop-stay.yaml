id: icu-days-exceed-postop-stay
name: Some ICU stays are longer than the postoperative stay
summary: >-
  In 37 cases the ICU day count reaches or exceeds the days from surgery to discharge, though the release describes it
  as the postoperative ICU stay. Most are emergencies with long stays before surgery, so the count probably includes
  ICU days before the operation.
status: likely
clocks: [hospital-records]
devices: [clinical-records]
variables: [icu-days]
studies: [value-registry-unmodelled]
description: |
  Days from surgery to discharge are counted from the midnight of the case day to the discharge midnight. Of 1,204
  cases with an ICU stay:

  | ICU days minus postoperative days | Cases | Emergency | In-hospital death | Median days before surgery |
  |---|---|---|---|---|
  | below 0 (expected) | 1,167 | 21% | 2% | 2 |
  | 0 | 6 | 67% | 33% | 8 |
  | 1 | 17 | 65% | 29% | 2 |
  | 2 or more | 14 | 64% | 57% | 16.5 |

  One of the 14 has an admission time about 42,650 days before surgery, a placeholder date rather than a stay.
consequence: |
  For these cases the ICU count is not a postoperative quantity, and the 17 cases one day over cannot be used to
  decide the counting rule.
handling: Flag ICU days greater than or equal to the postoperative stay; do not use them as postoperative ICU length.
