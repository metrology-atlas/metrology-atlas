id: snuadc-long-uncorrected
name: Long SNUADC recordings with no correction at all
summary: >-
  1,066 cases of 2.5 h or longer show no SNUADC correction, although at −65 ppm a 0.49 s step falls due within about
  2.1 h. Slower units, a third recorder mode, or both.
status: open
devices: [snuadc]
studies: [clock-correction-scan, drift-units]
consequence: |
  Short step-mode files with no reset can carry up to about 0.4 s of drift the model does not see; the stamp model
  gives them a rate of 0.
