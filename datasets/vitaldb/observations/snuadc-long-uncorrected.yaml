id: snuadc-long-uncorrected
name: Long SNUADC recordings with no correction at all
summary: >-
  1,066 cases of 2.5 h or longer, outside the frequent-correction mode, show no 0.49 s SNUADC correction (988 none
  at all, 78 a single small step), although at the step-mode median of −63 ppm a 0.49 s step falls due within about
  2.2 h. Explained by the Vital Recorder's rules: a fast converter is reset only once its count is 0.5 s ahead of the
  PC, and a new segment restarts the count, so a slower fast unit, or one whose segments are short, never reaches
  it. 81.8% of the 1,238 with a hum rate sit inside the window the rules allow, and 98.5% within the hum's noise
  ([[study:vital-recorder-stamping-rules]]). There is no third mode.
status: established
devices: [snuadc]
studies: [vital-recorder-stamping-rules, clock-correction-scan, drift-units, solar-snuadc-clock]
consequence: |
  Step-mode files with no reset can carry up to about 0.4 s of drift that the stamps do not show. The first stamp
  model gave them a rate of 0; the adopted one (model3) gives them their port's step-mode rate, which leaves a
  spread of about −135 to +122 ms/h (p10–p90) because each recording drifts at its own rate
  ([[study:snuadc-stamp-sawtooth]]).
