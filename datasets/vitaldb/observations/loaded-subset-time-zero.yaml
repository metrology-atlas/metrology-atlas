id: loaded-subset-time-zero
name: Time zero depends on the tracks loaded
summary: >-
  A file's time zero is its first record of any track. Loading only some tracks moves the zero to their first
  record: seconds later, and up to hours.
status: established
devices: [vital-recorder]
studies: [time-zeros, vitaldb-loader]
consequence: |
  Times "from the start" taken from different track subsets are not on one axis. The arrhythmia database's
  annotations count from the full file's zero.
handling: The [[code:vitaldb-reader/src/vitaldb_reader/vital_file.py|vitaldb-reader]] reads whole files, with record times in absolute file time; the TimeNet builds keep the full-file zero (vital_origin_s).
