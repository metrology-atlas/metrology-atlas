id: snuadc-overlapping-records
name: In 34 files the SNUADC records overlap throughout
summary: >-
  In 34 files the SNUADC records step back over their neighbours far more often than resets explain: in 20 of them
  4–95% of all record junctions overlap, by up to about 100 ms. The reset-order rule matches there by coincidence.
status: open
devices: [snuadc, vital-recorder]
studies: [reset-cluster-order]
consequence: |
  Read in file order, these files hold overlapping samples; reordered by the reset rule, they would be scrambled.
  Their timing should not be trusted until the cause is known.
handling: |
  The record-level signal survey (19 October) explains the worst of them: records written twice
  ([[observation:duplicated-records]], 8 recordings) and two interleaved streams
  ([[observation:interleaved-records]], 12 recordings), which also affect Primus and BIS. Drop the duplicates; treat
  interleaved tracks as unusable. The [[code:timenet/packages/timenet-connectors/src/timenet_connectors/datasets/vitaldb/vitaldb/resets.py|reset-order rule]]
  still needs a guard that skips such tracks before the next full build. None is in the current builds or clock
  fits.
code:
  - vitaldb-bench/tools/snuadc_stamp_census.py
