id: missed-beat-signature
name: The signature of a missed beat
summary: 'Tell how a rate numeric averages from how it disagrees with another measurement of the same rate: a window of
  a fixed time leaves ridges at a constant offset, a window counted in beats at a constant ratio, and a rule that ignores
  outlying intervals (a median, or a mean that leaves them out) leaves none from single missed beats.'
description: 'In the joint density of two rates (one numeric against another of the same rhythm), each kind of window leaves
  its own trace when one beat is missed:


  - **a window of a fixed time T** holds one beat fewer, so the rate drops by 60/T per minute whatever the rate: a line
  parallel to the diagonal;

  - **a window of N beats, averaged by a mean,** spans N + 1 beats with N intervals, so the rate is N/(N + 1) of the true
  one: a line through the origin;

  - **a median**, or **a mean that leaves out outlying intervals**, ignores one long interval: no line from single missed
  beats.


  So, for each value of one rate, find the strongest ridge just off the diagonal in the other, and test whether its position
  is a constant ratio or a constant offset across rates. A constant ratio says the window is counted in beats. Reading N
  from the ratio assumes a plain mean and single missed beats; in VitalDB''s pulse rate that reading gave 7–8, where recomputing
  the rate found an outlier-rejecting mean of 10 ([[study:pleth-hr-derivation]]), so confirm the rule by recomputation where
  the waveform exists. Lines at simple fractions far from the diagonal (1/2, 2/3, 3/4) come from sustained rhythms, such
  as every other beat making no pulse, and appear whatever the window. Needs only the two numerics, not their waveforms,
  so it works on datasets that store numerics alone.'
