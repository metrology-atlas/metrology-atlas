    file: examples/oliguria-labels.png
    theme: distributions of measured parameters
    source: vitaldb-bench examples/oliguria_labels.py
    caption: >-
      A: each case's probability of being oliguric, for the cases where it is neither 0 nor 1, coloured by the
      label the recorded numbers give. B: the error rate of models of the true rate with increasing noise, scored
      against the true labels and against the recorded labels; a perfect model is "wrong" on 2.6% of recorded labels.
    alt: Left, two overlapping histograms, blue piled near zero and orange near one, overlapping between 0.15 and 0.5; right, a line starting at 2.6% above the diagonal and joining it by about 15%.
