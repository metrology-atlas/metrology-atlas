  - id: bg-examples
    file: examples/bg-examples.png
    theme: example traces
    source: vitaldb-bench examples/blood_gas_gradients.py
    records: [136, 16]
    caption: >-
      End-tidal CO₂ (top) and SpO₂ (bottom) around a blood draw in [[case:136]] and [[case:16]]: the arterial-line
      access (orange), the lab stamp (dashed) and the lab value at the draw (red). Titles give the gradient's median
      and 95% interval.
    alt: Four time-series panels. In the left column end-tidal CO₂ drops sharply just before the lab stamp; in the right column SpO₂ sits at 100 at the draw.
  - id: bg-cohort
    file: examples/bg-cohort.png
    theme: agreement and residuals
    source: vitaldb-bench examples/blood_gas_gradients.py
    caption: >-
      4,281 blood gases. Left: PaCO₂ − EtCO₂ with the monitor read at the estimated draw and at the lab stamp.
      Middle: per-gas 95% interval width from rounding only, with the draw time added, and with the nearest single
      reading. Right: SaO₂ − SpO₂ per gas, ranked, with SpO₂ = 100 censored (red).
    alt: A pair of overlapping histograms centred near 7 mmHg; histograms of interval widths peaking near 1.5 and 2.3 mmHg; a ranked plot of oximetry gradients in steps of one percentage point.
  - id: bg-scatter
    file: examples/bg-scatter.png
    theme: agreement and residuals
    source: vitaldb-bench examples/blood_gas_gradients.py
    caption: >-
      One point per blood gas, the monitor read at the estimated draw. Every value is a whole number, so each point
      is drawn at a random place within its rounding interval (a value of 100 within 99.5–100). Left: PaCO₂ against
      EtCO₂, both axes from zero, with the line of equality and the line 7 mmHg above it. Right: SaO₂ against SpO₂,
      axes from 80%; red points have SpO₂ = 100.
    alt: Left, a cloud of points between 25 and 55 mmHg lying just above the line of equality. Right, most points in a vertical red column at SpO2 100 with SaO2 from 95 to 100, and a sparser blue cloud below.
  - id: bg-changes
    file: examples/bg-changes.png
    theme: agreement and residuals
    source: vitaldb-bench examples/blood_gas_gradients.py
    caption: >-
      Change in PaCO₂ against change in EtCO₂ between consecutive blood gases of the same patient (2,911 pairs), with
      the monitor read at the estimated draw (left) and at the lab stamp (right). Each value is a whole number, so
      points are drawn at a random place within their rounding interval; the dashed line is equal change.
    alt: Two scatter plots of changes; the left cloud lies tightly along the line of equal change, the right one is rounder and more spread.
  - id: bg-lagscan
    file: examples/bg-lagscan.png
    theme: delay and window fits
    source: vitaldb-bench examples/blood_gas_gradients.py
    caption: >-
      Agreement between PaCO₂ and EtCO₂ with the monitor read at each minute from 10 minutes before the start of the
      matched arterial-line access to 15 minutes after it: within patients (change against change, blue, with 95%
      interval) and pooled over all gases (grey). Both peak at the estimated draw (0); the lab stamp falls at a
      median 7.2 minutes.
    alt: Two curves rising to a peak at zero minutes and falling on both sides; the within-patient curve peaks at 0.73.
  - id: bg-lagscan-spo2
    file: examples/bg-lagscan-spo2.png
    theme: delay and window fits
    source: vitaldb-bench examples/blood_gas_gradients.py
    caption: >-
      Within-patient rank correlation of changes in SaO₂ and SpO₂ with the oximeter read at each minute from 10
      minutes before the start of the access to 15 minutes after: gases with SaO₂ ≤ 98% (blue, 95% interval) and all
      gases (grey). Gases are chosen by the lab value, not the monitor, so no moment is favoured. Both peak at the
      estimated draw.
    alt: Two curves peaking at zero minutes; the blue one reaches about 0.69 and falls to about 0.3 by the lab stamp at 7.2 minutes.
references: [eytan2019revisiting]
