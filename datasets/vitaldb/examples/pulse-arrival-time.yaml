    file: examples/pat-case-5975.png
    theme: example traces
    source: vitaldb-bench examples/pulse_arrival_time.py
    records: [5975]
    caption: >-
      Pulse arrival time in [[case:5975]], 30 s maximum-likelihood estimates over an hour, on one axis from zero:
      ECG to finger as stored (grey), after step 1 removes the sawtooth (blue), after step 2 removes the global
      385 ms device delay (orange), and ECG to the arterial line, which needs no correction (green). Dotted lines mark frame slips.
    alt: Four lines on one axis; grey with a sawtooth and blue without it near 690 ms, orange near 290 ms and green near 175 ms, the last three with the same slow shape.
  - id: pat-cohort
    file: examples/pat-cohort.png
    theme: delay and window fits
    source: vitaldb-bench examples/pulse_arrival_time.py
    caption: >-
      113 cases with ECG and PLETH. Left: PAT in 30 s windows around each case's median, as stored and after step 1.
      Middle: each case's median PAT as stored and after step 2 subtracts the global 385 ms; the spread is kept. Right: finger minus arterial PAT in the
      cases with an arterial line and a confidently corrected tooth, as stored and after step 1.
    alt: Three histograms; the left one barely narrows after step 1, the middle one shows the same spread of case medians around 700 ms as stored and around 330 ms after step 2, the right one narrows clearly after step 1.
  - id: pat-distribution
    file: examples/pat-distribution.png
    theme: distributions of measured parameters
    source: vitaldb-bench examples/pulse_arrival_time.py
    caption: >-
      PAT in 30 s windows over 113 cases: ECG to finger as stored (grey) and after steps 1 and 2 (orange), and ECG to
      the radial arterial line in the 60 cases with one (green). The shaded band is the 200–285 ms (R to finger foot)
      reported for awake adults in shared-clock studies, shifted by the 59 ms foot-to-upstroke time to match this
      example's fiducial; it is provisional and still to be verified. Negative corrected values (2.3% of
      windows) are left out.
    alt: Three histograms on one axis; grey centred near 717 ms, orange near 331 ms and green near 219 ms, with a shaded band from 259 to 344 ms.
  - id: pat-scatter
    file: examples/pat-scatter.png
    theme: agreement and residuals
    source: vitaldb-bench examples/pulse_arrival_time.py
    caption: >-
      ECG-to-finger PAT against ECG-to-radial-artery PAT in the same 30 s windows (7,052 windows, 60 cases), as stored
      (grey) and after steps 1 and 2 (orange); both axes start at zero, and the dashed line is equal PAT. Negative
      corrected values are left out.
    alt: A scatter with a grey cloud near 700 ms on the vertical axis and an orange cloud near 270 ms, just above the dashed equality line, both spread between 170 and 300 ms on the horizontal axis.
