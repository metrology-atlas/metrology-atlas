id: pulse-arrival-time
name: Pulse arrival time in two correction steps
summary: >-
  As stored, the ECG-to-finger PAT in VitalDB is about 0.72 s, far beyond any physiological value, because a device
  delay of about 0.39 s and a frame-slip sawtooth sit inside it. Removing the sawtooth narrows finger minus arterial
  PAT from 13.6 to 11.1 ms in the median case, and removing one global delay brings PAT to about 0.33 s to the
  upstroke, keeping the differences between patients.
side: time
status: draft
question: |
  How long does the pulse take to travel from the heart to the finger, and how does that change through an
  operation?
why: |
  Pulse arrival time (PAT) is a difference of two event times taken from two signals, so any delay or drift between
  them goes straight into it. ECG and arterial pressure are sampled together by the SNUADC, so its clock cannot move
  one against the other ([[observation:snuadc-one-clock]]). Both are the monitor's analogue outputs, so a difference
  in the monitor's own processing delays would still pass into an arterial-line PAT; it has not been measured, but
  the arterial line's physiological R-to-upstroke delay bounds it to small ([[study:ppg-art-reference]]). The PLETH
  differs in two ways:

  - **a sawtooth**: its delay behind the ECG creeps at 18–52 ppm and jumps back by one 33.3 ms frame at each slip,
    every 11–31 minutes ([[observation:ppg-sawtooth]], [[study:ppg-sawtooth]]);
  - **an offset**: the monitor delivers the PLETH about 0.4 s late ([[observation:ppg-hardware-delay]],
    [[study:ppg-offset-reference]]).

  Both look like physiology in a raw PAT series: the sawtooth as slow drifts and sudden jumps of tens of
  milliseconds, the offset as a PAT almost three times too long, which also differs between recording setups.
variables: [snuadc-ecg-ii, snuadc-pleth, snuadc-art]
studies: [ppg-sawtooth, ppg-sawtooth-correction, ppg-sawtooth-pauses, ppg-art-reference, ppg-offset-reference, ppg-frame-clock]
observations: [ppg-sawtooth, ppg-hardware-delay, snuadc-one-clock, pleth-30hz-frames, fiducial-quantisation, ppg-sawtooth-pauses]
data: |
  60 minutes per case, starting 10 minutes into the overlap of ECG lead II and PLETH, and kept inside the stretch the
  whole-release slip fit covers, where the correction is known ([[study:ppg-sawtooth-correction]]). The cohort is a random 120
  of the recordings with both signals (97% of recordings have them: 817 of 846 sampled), plus [[case:5975]] for
  the figure; 66 of the 121 also have a pulsatile arterial line, which serves as the reference.
steps: |
  1. **Fiducials.** R peaks in ECG lead II; the steepest upstroke after each R peak in the PLETH, and in the
     arterial pressure where there is a line.
  2. **Step 1, remove the sawtooth** ([[observation:ppg-sawtooth]]), with the atlas's rebuilt correction
     ([[study:ppg-sawtooth-correction]]): the recording's slips come from the whole-release slip fit, and
     `physiosync.fit_ecg_ppg_delay(method="rebuilt")` turns them into the PLETH's delay, a creep that closes one 30 Hz
     frame over each tooth and resets at each slip. Each tooth gets a tier: A, B and C are corrected; unresolved teeth
     (U) and isolated slips without a sawtooth (I) are left as they are. Three recordings without a whole-release fit
     fall back to the detect fit. Subtracting only the sawtooth leaves the PAT at its stored level.
  3. **Step 2, remove one global device delay** ([[observation:ppg-hardware-delay]]): 385 ms for every recording.
     The stored ECG-to-PLETH delay has one peak over the whole release, with no clusters by recording setup and no
     shift along the case order ([[study:pat-offset-census]]). The adopted mean finger PAT, 0.27 s
     ([[study:ppg-offset-reference]]), is measured to the foot of the pulse, so the delay is too: 655 ms (the stored
     delay to the foot) minus 270 ms. This example times the steepest upstroke, 59 ms after the foot, so its corrected
     PAT reads about 270 + 59 = 330 ms. Because the same delay comes off every case, differences in PAT between
     patients are kept; only the absolute level rests on the adopted 0.27 s.
  4. **Smooth by maximum likelihood**, after [[reference:ruffolo2025high]]: per 30 s window, the latent PAT that
     maximises the likelihood of the window's beats under the recording's per-beat error model
     (`physiosync.pat_measurement_model`: the PLETH fiducial's frame rounding or jitter, and the ECG's one-sample
     rounding), evaluated by Monte Carlo, with a 2% floor for mis-detected beats. A median gives every beat the
     same weight whatever its error; the likelihood weighs them by the error model and ignores outliers.
results: |
  **One case.** In [[case:5975]] the stored PAT (grey) is about 0.68 s and jumps back by one frame three times in
  the hour (dotted). After step 1 (blue) the jumps and ramps are gone and the series has the same course as the
  arterial PAT (green): the spread of finger minus arterial PAT, minute by minute, falls from 10.7 to 2.7 ms.
  Step 2 (orange) moves the whole series down by the global 385 ms, without changing its shape; the corrected finger
  PAT (to the upstroke) then sits 116 ms above the arterial PAT in this case.

  [[figure:pat-case]]

  **The cohort (121 cases).**

  - *Global delay (step 2).* The stored PAT's case median is 0.65–0.75 s; step 2 subtracts 385 ms from every case,
    so the corrected case medians keep their spread (median 329 ms to the upstroke, interquartile range 313–345 ms). Eight cases
    have a stored median of 0.44–0.54 s: their pulses were paired with the wrong beat (fast heart rates or doubled
    R peaks, with a 0.7 s delay longer than one RR interval; see [[study:pat-offset-census]]). They are left out of
    the cohort figures, leaving 113.
  - *Sawtooth (step 1).* A median of 2 slips an hour. At least one tooth was corrected (tier A, B or C) in 59 of the
    113 cases; of the other 54, 33 have isolated slips without a sawtooth (tier I, not corrected), 18 no slip and 3
    only unresolved teeth. In the 60 cases with an arterial line, the spread of finger minus arterial PAT fell from a
    median of 13.6 to 11.1 ms per case; it narrowed by more than 2 ms in 25 cases and widened by as much in 3. Pooled
    over the windows of the 36 with a tooth in tier A or B, it fell from 14.9 to 8.3 ms. The within-case spread of
    PAT itself changes less (17.2 to 14.5 ms in the median case), because real changes in PAT, tens of milliseconds
    as blood pressure changes, are larger than the sawtooth.
  - *Against the earlier correction.* Run on the same windows, the detect fit corrects a tooth in 45 cases and
    leaves a median spread against the arterial line of 13.1 ms (rebuilt: 11.1); the rebuilt correction is tighter
    by more than 2 ms in 18 of the 60 cases and looser in 7, and makes 3 worse than stored against detect's 1.

  [[figure:pat-cohort]]

  **Before and after, as PAT values.** As stored, ECG-to-finger PAT is 717 ms in the median window (633–769 ms,
  5th to 95th percentile), far beyond any physiological value: almost every window lies outside the 200–285 ms
  reported for awake adults, even allowing for the 59 ms from foot to upstroke. After both steps the median is 331
  ms to the upstroke (249–383 ms), above the arterial-line PAT (219 ms), as a finger, further from the heart than
  the radial artery, should be. Where the orange peak sits overall rests on the adopted 0.27 s; its spread is
  measured, because one delay comes off every case. 2.3% of corrected windows come out negative, where beats were
  mis-paired; they are left out of the figure. The adult range is provisional and still has to be
  verified (see the open questions).

  [[figure:pat-distribution]]

  **Against the arterial line, window by window.** In the 60 cases with an arterial line, finger PAT as stored sits
  496 ms above the arterial-line PAT in the median window; after both steps it sits 111 ms above it (upstroke to
  upstroke; about 90 ms foot to foot in the census), the order expected for a finger further from the heart than the
  radial artery. Both clouds slope with the arterial PAT:
  across cases, the corrected finger PAT follows the arterial PAT with a slope of 0.73 (correlation 0.60), exactly as
  the stored one does, because a single global delay keeps the differences between patients. (An earlier version
  of step 2 removed each case's own offset, which flattened the corrected cloud and threw those differences away.)

  [[figure:pat-scatter]]
levels:
  error: systematic
  population: >-
    A device delay of about 0.39 s sits in every stored PAT: a cohort mean is wrong by that much until it is removed.
  individual: >-
    The PLETH sawtooth adds slips of 33 ms within each patient; removing it lowers the spread against the arterial line from 13.6 to 11.1 ms in the median case.
takeaways: |
  - Never read the absolute ECG-to-PLETH PAT in VitalDB as physiology: it carries a device delay of about 0.39 s.
    The delay is the same across recording setups and the case order, so one global value removes it and keeps
    differences between patients; the absolute level still rests on an adopted mean finger PAT.
  - Pair each pulse with its own beat: the stored delay (about 0.7 s) is longer than one RR interval at fast heart
    rates, and a nearest-upstroke search then pairs one beat out.
  - Within a case, remove the sawtooth (step 1) before reading changes over minutes; otherwise slips appear as
    sudden PAT changes of 33 ms.
  - Check each tooth's tier: only A, B and C teeth are corrected; in U and I teeth only the offset is removed, and
    the sawtooth is still there.
  - Where an arterial line exists, ECG to arterial line is a PAT without either problem.
limitations: |
  - The beat detector is deliberately simple: 9% of 30 s windows lie more than 40 ms from their case's median,
    mostly from mis-detected beats.
  - 60 minutes of 121 cases; a full run belongs in the runbook.
open_questions:
  - title: "Isolated slips are left uncorrected"
    kind: next step
    summary: >-
      With the rebuilt correction, 33 of the 113 cases have slips but no sawtooth (tier I): a step without its creep
      is not corrected, because correcting the step alone turns a sawtooth into a ramp
      ([[study:ppg-sawtooth-correction]]). Their delay drifts slowly and is reported, not removed. In the 60 cases
      with an arterial line the correction widens the spread against the line in 3. (The earlier detect fit left 75
      of 121 cases without a confident tooth; that question is closed.)
  - title: "Where the sawtooth stops"
    kind: phenomenon
    summary: >-
      Most stretches of two teeth without a slip are one slip missed, not a pause
      ([[study:ppg-sawtooth-pauses]]). The rebuilt correction predicts the slip the grid expects there and corrects it
      where the evidence is strong. Where it is not, the tooth is left unresolved (tier U) and only the offset is
      removed, so up to one frame of uncertainty remains in those teeth.
  - title: "ECG and arterial-line outputs may differ in delay inside the monitor"
    kind: assumption
    summary: >-
      The SNUADC records the monitor's analogue outputs, not the patient, so sharing a converter aligns their sampling
      but not the monitor's processing before it. A difference in filtering or buffering between the ECG and
      invasive-pressure outputs would go straight into the arterial-line PAT (219 ms) and into the arterial check on
      the sawtooth. The converter's own channel skew is below a millisecond (it reads its channels in turn). Settled by
      the monitor's documentation of its analogue-output delays, a simulator feeding one event to both, or, from the
      data, the phase of the monitor's 240 Hz output-update line where it shows in both the ECG and the arterial
      pressure (raised by the R-peak timing session).
  - title: "Pairing by the modal delay in the example itself"
    kind: next step
    summary: >-
      Eight of 121 cases were paired one beat out (fast heart rates or doubled R peaks) and are left out of the cohort
      figures. The census pairs pulses by each segment's modal delay instead ([[study:pat-offset-census]]); using that pairing here would bring them back. The example [[example:pat-vs-bp]] already pairs this way, and
      shows how much naive pairing changes PAT's correlation with blood pressure.
  - title: "The adopted 0.27 s"
    kind: assumption
    summary: >-
      The global delay is the release's median stored delay to the pulse foot (655 ms) minus 0.27 s, a mean R-to-foot
      finger PAT for anaesthetised adults from studies that sampled ECG and PPG on one clock
      ([[study:ppg-offset-reference]]). Differences between patients and changes within a case are measured; the
      absolute level of every case moves with the adopted value. It implies a finger-minus-radial difference of about
      90 ms foot to foot, which a literature value could check. An upper bound comes from the data: PLETH's foot lags
      the arterial foot by the device delay plus the finger-minus-radial transit, which is positive, so the device
      delay cannot exceed that lag. In the census's 2,900 cases with an arterial line, the lag's case median is 475 ms
      and 98.5% of cases lie above 385 ms; most of the 43 below have a late, unsteady arterial foot (a damped line or
      a missed foot), and the cleanest sit within a few milliseconds of 385 ms ([[study:pat-offset-census]]; check
      suggested by the R-peak timing session).
  - title: "What plausible PAT range should be shown for anaesthetised adults?"
    kind: assumption
    summary: >-
      The figure shades 200–285 ms to the foot (shifted by 59 ms to the upstroke), the range of means in shared-clock
      studies of awake adults
      ([[study:ppg-offset-reference]]). That is a range of study averages, not of individual windows, and anaesthesia lengthens PAT by about 40 ms. A verified range for
      adults under anaesthesia, ideally of individual values, is still needed; [[reference:ruffolo2025high]] gives
      one for critically ill children.
  - title: "The maximum-likelihood smoother follows Ruffolo et al. in approach, not in detail"
    kind: next step
    summary: >-
      The window length (30 s), the outlier floor (2%) and the error model's terms are this example's choices; the
      estimator has not been checked against the original implementation, or against injected PAT changes of
      known size.
  - title: "Pulse arrival time as a derived variable"
    kind: next step
    summary: >-
      Pulse arrival time would be computed from two inputs on the SNUADC clock: R peaks in the ECG and pulse
      feet in the plethysmogram, so the stamp-model error cancels and the oximeter's delay and sawtooth remain.
      It waits for an R-peak variable ([[study:pat-offset-census]]).
code:
  - vitaldb-bench/examples/pulse_arrival_time.py
  - vitaldb-bench/examples/pat_example_stats.py
  - vitaldb-bench/scripts/run_pat_example.sh
  - physiosync/physiosync/ecg_ppg.py
  - physiosync/physiosync/slips.py
  - physiosync/physiosync/measurement.py
reproduce: |
  ```
  python examples/pulse_arrival_time.py --root <VitalDB release> --cases 5975 --figure 5975 --out out/pat
  python examples/pulse_arrival_time.py --root <VitalDB release> --cases <case ids> --out out/pat
  python examples/pulse_arrival_time.py --out out/pat --cohort-figure
  python examples/pat_example_stats.py out/pat --case <figure case> --json out/pat/page_stats.json
  ```
  The slips are read from the whole-release slip fit (`$PAT_FIT`); `PAT_METHOD=detect` runs the detect fit on the
  same windows for comparison (`scripts/run_pat_example.sh` runs both). With [[software:physiosync]] and vitaldb-reader installed (see [[software:vitaldb-bench]]).
references: [ruffolo2025high]
figures:
