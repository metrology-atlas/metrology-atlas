id: snuadc
name: SNUADC
summary: The analogue-to-digital converter board that samples the monitor's analogue outputs at 500 Hz.
type: acquisition
clocks: [snuadc-sample]
description: |
  SNUADC records the monitor's analogue waveform outputs (ECG leads, arterial pressure, plethysmogram, CVP) and
  sends them to Vital Recorder in 0.2 s records of 100 samples. Its records are stamped by the recorder, which
  models the board's timing (see [[clock:snuadc-sample]]). Its analogue path is flat to about 100 kHz, with no
  anti-aliasing filter, so any filtering seen in its tracks is the monitor's ([[study:snuadc-firmware]]).
references: [lee2022vitaldb]
docs:
- title: 'VitalRecorder supported devices: VitalDB devices (SNUADC)'
  url: 'https://vitaldb.net/docs/?documentId=VitalRecorder%2FSupported_Devices.md'
- title: 'VitalRecorder configuration guide: ADC device settings'
  url: 'https://vitaldb.net/docs/?documentId=VitalRecorder%2FConfiguration_Guide.md'
