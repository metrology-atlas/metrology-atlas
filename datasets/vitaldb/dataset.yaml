id: vitaldb
name: VitalDB metrology atlas
summary: >-
  Every recorded value in the VitalDB open dataset (6,388 surgical cases, PhysioNet release 1.0.0) as a
  probability distribution over when it happened and what it was, with the studies that measured each part.
description: |
  A record in VitalDB is a pair: a recorded time and a recorded value. In the language of metrology, each record is
  an indication of two **measurands**: when the thing it describes happened, and what its value was. Neither is
  recorded exactly. The time comes from one of a dozen clocks that drift and are corrected in jumps, and often
  describes a window that ended earlier; the value was rounded, sometimes heaped by hand, and measured by an
  instrument with its own error.

  For every variable, this atlas states the measurand, the **measurement model** that links it to the recorded
  pair, and what is known about the measurand given a record, as a joint probability distribution over its true
  time and true value (the multivariate case of the GUM, Supplement 2). Every part of the model carries its
  evidence: the study it came from and how it was evaluated (measured from the data, or estimated and assumed).
  With the distributions known, uncertainty can be propagated through any calculation on the data (the GUM,
  Supplement 1). [Aim and terms](terms.md) states this aim in full and maps the atlas onto the international
  vocabulary.

  It is a metrology of recorded data: the measurements were made long ago, so each part of the model is
  reconstructed from the records themselves.

  **All clock rates are relative.** Each is measured against another clock that also drifts, and the page says
  which. Every clock is linked, directly or through others, to the recorder PC ([[clock:recorder-pc]]); its link to
  UTC cannot be observed in the release and
  is assumed, so no time here is metrologically traceable to UTC: the chain is broken at its first link.
overview: |
  VitalDB records each operating room with one PC running Vital Recorder. Every device sends its data to that PC,
  which stamps each record. The waveforms that matter most for timing come through SNUADC, a 500 Hz converter that
  samples the patient monitor's analogue outputs (ECG, arterial pressure, plethysmogram, CVP); the BIS monitor,
  the Primus anaesthesia machine and a handful of haemodynamic monitors send their own waveforms and numbers, each
  on its own clock. The patient monitor's numbers (heart rate, pressures, SpO2) arrive as single values that
  describe a window of signal which ended seconds before their stamp.

  So a time in VitalDB can be off in two ways: the clock that made it drifts and is corrected in jumps, and the value
  it is attached to describes an earlier interval. The chart below places every kind of time stamp on both axes.
reference_clock: snuadc-sample
reference: |
  The working reference is **SNUADC stamp-model time**: the SNUADC sample clock, placed on the recorder PC's
  timeline by the stamp model (drift and corrections fitted, the signal lost at each correction added back). Every
  delay in the planner is measured against it. Its own error against the PC is a few milliseconds where the
  SNUADC's corrections are seen; in recordings that make no SNUADC correction it rests on the port's typical rate
  and can drift by about ±0.1 s per hour ([[observation:snuadc-long-uncorrected]]). The PC's error against UTC is
  assumed.
figures:
  - id: system-overview
    file: timing-graph.svg
    interactive: true
    caption: |
      The timing graph: every clock in the atlas, placed one row below the clock it is measured against, with each
      link's drift and correction interval. Generated from the atlas's clock, link and parameter pages on every
      build, so it shows what the atlas currently holds; every box and label links to its page. All device rates
      are relative to the recorder PC, whose own link to UTC is assumed.
    alt: >-
      A tree with UTC at the top, the recorder PC clock below it, a row of device clocks (Primus, CardioQ, SNUADC,
      BIS, hospital records) below that, and the clocks measured against the SNUADC (pulse oximeter frames, monitor
      output, pacemaker, Solar8000) at the bottom; each line labelled with a drift and a correction interval.
  - id: synchronisation-demo
    file: sync-demo-1216.png
    theme: example traces
    source: vitaldb-bench tools/sync_demo.py
    records: [1216]
    caption: >-
      One recording ([[case:1216]], 8.7 hours), before synchronisation (left) and after (right), on the same scales.
      Top: each clock's time minus the synchronised time. The SNUADC's stamps drift and are pulled back by half a
      second about every two hours; the BIS's stamps sit about 0.8 s off and are pushed forward every 8,192 s; the
      Primus drifts about 4 s over the recording and steps at its airway-pressure pauses (dotted lines). After
      synchronisation the typical error left is about 3 ms (SNUADC), 42 ms (BIS) and 55 ms (Primus, whole-release
      medians; bands). Middle: the same electrocautery and muscle bursts seen in the ECG and the EEG, as recorded
      and on the synchronised times, a check independent of the correction. Bottom: the airway-to-central-venous
      pressure lag of the breath cycle, as recorded and, after, as the error left when each 10-minute window is
      predicted from all the others.
    alt: >-
      Six panels over 9 hours. Left column: sawtooth lines for SNUADC and BIS and a rising line for the Primus
      spanning about 3.5 seconds; burst lags ramping between minus 0.6 and minus 1.2 seconds; breath lags rising
      from minus 2 to plus 2 seconds. Right column: the same quantities flat near zero.
  - id: synchronisation-census
    file: sync-error-census.png
    theme: population results
    source: vitaldb-bench tools/sync_error_census.py
    caption: >-
      Timing error per window across the whole release, as recorded (grey) and after synchronisation (blue), on a
      log scale; dashed lines mark the medians. Each link is checked by a signal both clocks record, which never
      enters the correction it tests. BIS against SNUADC, by electrocautery and muscle bursts in the ECG and the EEG:
      median 794 ms to 42 ms (2,737 recordings, 10-minute windows). Primus against SNUADC, by the breath cycle in
      airway pressure and CVP: 378 ms to 55 ms (1,067 recordings; each window predicted from all the others, a line
      per stretch between AWP pauses).
      Primus against the PC, by PC-stamped PIP values: 450 ms to 238 ms (172 recordings, 30-minute blocks). The
      "before" for both Primus links has each recording's own offset removed, so it understates the raw error.
    alt: >-
      Three histograms on a log time axis. In each the grey "as recorded" distribution sits to the right, at
      hundreds of milliseconds to seconds, and the blue "synchronised" distribution sits to the left, at tens of
      milliseconds for BIS and the Primus against SNUADC, and a few hundred milliseconds for the Primus against
      the PC.
utc_step:
  node: Recorder PC clock
  clock: recorder-pc
  kind: sync
  effect: >-
    Windows time synchronisation to the hospital's time server every 8–24 h (assumed), drifting a few ppm in
    between. Not observable in the release: dates are shifted to 2100. No step of 0.5 s or more was found.
  bias_s: [0.003, 0.9]
  status: assumed
  link: recorder-pc-vs-utc
  parameter: pc-utc-offset
domains:
  - id: reference
    name: SNUADC stamp-model time (the working reference)
    clock: snuadc-sample
    drift_ppm: 0
    drift_u_ppm: 31
    drift_status: measured
    note: >-
      Signals synchronised to the reference share it, so drift cancels between them. Against the recorder PC it does
      not drift where the SNUADC stamps carry corrections; in recordings without them (57%) the stamp model uses the
      port's assumed rate and drifts by 31 ppm (zero-centred robust SD of the BIS-checked drift; 76 ms per hour
      median), given as the spread; it is that of recordings without corrections ([[study:hum-snuadc-rate]]).
  - id: reference-hum
    name: SNUADC stamp-model time with the hum rate
    clock: snuadc-sample
    drift_ppm: 0
    drift_u_ppm: 13
    drift_status: measured
    note: >-
      As the reference, with the SNUADC rate from the mains hum where the stamps carry no correction: 13 ppm against
      the recorder PC (31 ms per hour median), in the 1,248 recordings without corrections that have hum
      ([[study:hum-snuadc-rate]]).
  - id: recorder-pc
    name: Recorder PC stamps (values stamped on arrival)
    clock: recorder-pc
    drift_ppm: 0
    drift_status: measured
    note: >-
      Numerics stamped by the recorder PC when they arrive (the Solar8000 and Primus numerics), so no device clock
      enters their stamps ([[study:numeric-clock-check]]). Against the working reference they drift only as the
      reference does without stamp corrections.
  - id: snuadc-raw
    name: SNUADC raw record stamps
    clock: snuadc-sample
    note: A sawtooth of drift and half-second corrections, not a steady drift.
  - id: bis
    name: BIS clock
    clock: bis-clock
    drift_ppm: 25
    drift_status: measured
    note: Against the recorder PC; corrected on a fixed 8,192 s timer.
  - id: primus
    name: Primus clock
    clock: primus-clock
    drift_ppm: 104
    drift_status: measured
    note: Against the recorder PC, by breath matching through the SNUADC stamp model (p10–p90 +28 to +184 ppm); steps of up to about ±0.5 s at the AWP pauses.
  - id: solar8000
    name: Solar8000 numerics
    clock: solar8000-clock
  - id: cardioq
    name: CardioQ clock
    clock: cardioq-clock
  - id: ev1000
    name: EV1000
  - id: vigileo
    name: Vigileo
  - id: vigilance
    name: Vigilance
  - id: invos-fms
    name: Invos and FMS
  - id: pumps
    name: Infusion pumps
  - id: records
    name: Clinical and lab records
    clock: hospital-records
