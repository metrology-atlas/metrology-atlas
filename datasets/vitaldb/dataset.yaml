records:
  name: case
  label: case {id}
  max: 6388
  policy: |
    VitalDB is an open dataset (CC BY 4.0), and its case ids are public. The atlas names a case only where a study
    discusses a specific example: an edge case, a recording that shows a mechanism clearly, or a comparison between
    two cases. Population and group results, and figures that show a general principle, carry no case ids. Every
    named case is listed here with the pages that discuss it, so each example can be opened and checked.
forbidden_patterns:
  - pattern: '(?i)\bcase\s*(?:id\s*)?#?\s*\d{1,4}\b'
    why: name a case only deliberately, as [[case:1234]], so it is listed on the cases page
  - pattern: '\bvitaldb-\d{4}\b'
    why: name a case only deliberately, as [[case:1234]]
  - pattern: '\b\d{4}\.vital\b'
    why: name a case only deliberately, as [[case:1234]]
notice: |
  **Open for review (v0.2.0).** This version accompanies version 2 of the preprint
  ([arXiv:2610.29001](https://arxiv.org/abs/2610.29001)), which reframes the atlas in the terms of the VIM and the GUM,
  and is released for review by the community and the dataset's custodians ahead of a peer-reviewed journal version.
  Version 0.1.0 is archived, and its superseded numbers stay on the pages that replaced them.
  Comments are welcome as [issues or discussions](https://github.com/metrology-atlas/metrology-atlas) on GitHub.

  Studies are still being added and revised, some numbers rest on small runs, and
  many questions are open. Every page says how its numbers are known. If you find something wrong, or can settle an
  open question, please [contribute](contributing.md): corrections, better models and new studies are all welcome.

  The studies, code and pages were developed with substantial assistance from an AI assistant (Claude, by
  Anthropic), under the author's direction and review. Mistakes may remain; [how this atlas was
  made](how-it-was-made.md) says more.
anchor_default:
  basis: convention
  note: >-
    Assumed to round to the nearest step, the usual rule for analyser results and charted numbers. Not tested; the
    largest possible effect is half a step, small for most of these against the measurement's own error.
examples_intro: |
  Each worked example takes an analysis people commonly run on VitalDB and does it twice: once on the stored
  numbers, and once with the atlas's corrections, timing on the time side, the rounding models on the value side.
  Each page states the question, why the atlas changes the answer, the steps, and the code to rerun it, so the same
  corrections can be carried into your own work. The time-side examples show what misaligned clocks do to derived
  signals; the value-side examples show results as distributions instead of single numbers.
