id: utc
name: UTC
summary: Coordinated Universal Time, the reference every chain of clocks in the atlas starts from.
type: reference
nominal: Civil time
description: |
  No clock in the release is tied to UTC directly. Vital Recorder takes the VitalDB server's time at each start and
  then runs on the PC's hardware timer ([[link:recorder-pc-vs-utc]]), but the release shifts every date to the year
  2100, so the offset of any VitalDB time from UTC is unobserved.
