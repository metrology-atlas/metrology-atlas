id: recorder-pc
name: Recorder PC clock
summary: The Windows clock of the PC running Vital Recorder. It stamps every record, and every other clock is linked
  to it, directly or through others.
type: software
nominal: Windows time, synced by KRISS UTCk
description: 'Vital Recorder stamps each record on arrival with this clock, and every device link is measured against
  it. Its own link to UTC cannot be observed in the release, because dates are shifted to the year 2100. The dataset''s
  creator reports that the PCs were synchronised to UTC(KRIS) with KRISS''s UTCk program ([[link:recorder-pc-vs-utc]]);
  how often, and with what offsets, is not known.


  It does not step visibly: across all 6,388 files no simultaneous jump of every device of 0.5 s or more was found,

  and it never steps backwards.


  Every device drift in the atlas is measured against this clock, so its own drift and corrections are inside

  every one of them. Within a recording the BIS and SNUADC drifts vary from interval to interval, but in opposite

  directions (r = −0.54), which a PC excursion would not produce ([[study:device-correction-schedules]]).


  The recording itself pauses for about 18 s on a 5-hour timer that does not start with the recording

  ([[observation:recording-pauses]]); whether that timer belongs to the PC or to Vital Recorder is not known.

  '
references: [lee2022vitaldb, rfc5905]
utc_plan: 'The only link the release cannot show. What is known: the PCs were synchronised to UTC(KRIS) with KRISS''s
  UTCk (the dataset''s creator), and no step of 0.5 s or more appears in any file. To go further: UTCk''s interval and
  any surviving synchronisation logs (asked), a finer search for the small simultaneous steps each synchronisation
  would leave, or recordings with a known external time (a dated event, a GPS-stamped device).'
