id: recorder-pc
name: Recorder PC clock
summary: Vital Recorder's clock on the recording PC. It stamps every record, and every other clock is linked to it,
  directly or through others.
type: software
nominal: VitalDB server time read at each start, then the PC's Windows multimedia timer (1 ms)
description: 'Vital Recorder stamps each record with this clock, and every device link is measured against it. It
  is not the Windows clock: at start-up the recorder reads the time once from the VitalDB server and stores its
  difference from the PC clock, and after that its time advances only by the PC''s hardware timer, the Windows
  multimedia timer (1 ms resolution). It restarts itself once it has run for more than 5 hours, and with every PC
  restart, and reads the server time again at each start (H.-C. Lee, 9 November 2026; [[link:recorder-pc-vs-utc]]).
  The hand synchronisation of the Windows clock to UTC(KRIS) with KRISS''s UTCk mattered only when the server request
  failed. Its own link to UTC cannot be observed in the release, because dates are shifted to the year 2100.


  It does not step visibly: across all 6,388 files no simultaneous jump of every device of 0.5 s or more was found,

  and it never steps backwards.


  Every device drift in the atlas is measured against this clock, so its own drift and corrections are inside

  every one of them. Within a recording the BIS and SNUADC drifts vary from interval to interval, but in opposite

  directions (r = −0.54), which a PC excursion would not produce ([[study:device-correction-schedules]]).


  The recording itself pauses for about 18 s on a 5-hour timer that does not start with the recording

  ([[observation:recording-pauses]]). Vital Recorder''s automatic restart after 5 hours of running would fit; whether
  it also happens during a recording has been asked of its developer.

  Its rate is the hardware timer''s: [[value:pc-grid-rate]] against the mains grid ([[link:recorder-pc-vs-grid]]).

  '
references: [lee2022vitaldb, rfc5905, lee2026correspondence-nov, lee2026correspondence-9nov]
utc_plan: 'The only link the release cannot show. What is known: the recorder takes the VitalDB server''s time at
  each start and then runs on the PC''s hardware timer, whose rate against the grid is measured; no step of 0.5 s or
  more appears within any file. Not known: the server''s own offset from UTC and the delay of the start-up request.
  To go further: recordings with a known external time (a dated event, a GPS-stamped device).'
