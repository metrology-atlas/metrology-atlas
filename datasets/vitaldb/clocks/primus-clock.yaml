id: primus-clock
name: Primus clock
summary: The Primus anaesthesia machine's own clock.
type: oscillator
nominal: 62.5 Hz waveform clock
description: The Primus anaesthesia machine's own clock. Its stamps are re-anchored at recording gaps and by small
  corrections about every two hours. Measured by breath matching, it drifts a median +104 ppm against the recorder
  PC, which its small corrections do not keep up with.
tags:
- stub
utc_plan: 'Measured to the PC by breath matching through the SNUADC stamp model: +104 ppm within the stretches between
  AWP pauses (p10–p90 +28 to +184, 178 recordings), with steps of up to about ±0.5 s at the pauses that do not reset the
  drift. The small correction steps imply only 1–11 ppm and are not the clock rate. Open: what sets the steps at the
  pauses; the airway-to-CVP physiological delay inside the measured lag.'
