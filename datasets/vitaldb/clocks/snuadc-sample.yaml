id: snuadc-sample
name: SNUADC sample clock
summary: The sample clock of the SNUADC acquisition board, which digitises ECG, arterial pressure, plethysmogram
  and CVP at 500 Hz. The working reference for every waveform alignment.
type: oscillator
nominal: 500 Hz ADC sample clock
modes:
- id: step
  name: Step mode
  description: A converter that runs fast against the recorder. The stamps drift until the count is half a second
    ahead; the recorder then discards the block just read and re-anchors. See [[link:snuadc-step-vs-pc]].
- id: frequent
  name: Frequent-correction mode
  description: A converter that runs slow against the recorder. At each read the recorder fills the shortfall with
    blank samples, so the stamps follow the PC with small forward steps of whole samples (a median +3.3 ppm slow;
    [[study:vital-recorder-stamping-rules]]). Not a setting of the recorder, but the same rule as step mode, applied to
    a slower converter.
description: 'Vital Recorder counts its samples from an anchor taken at arrival and compares the count with its own
  clock at every read; the stamps therefore follow the latest arrivals, and this working reference is probably late
  on true time by close to the largest transfer delay from the board to the recorder (H.-C. Lee, 9 November 2026).


  All SNUADC channels share this clock: they start together and carry the same record timing. The public
  firmware

  of the board (an ATmega32U4 with a 16 MHz crystal) schedules each sample 2 ms after the last, or at once if it

  is late, so a stall of more than 2 ms re-anchors the sample grid and the stalled time is never sampled. Whether

  that firmware is the version deployed for VitalDB is not known.

  '
utc_plan: 'Measured to the recorder PC in both modes (stamp sawtooth, confirmed by the paced ECG and the PC-stamped
  heart rate); from there the route rests on the assumed PC–UTC link. The reset-order fix and the stamp-arithmetic
  census are done (17 October). The long recordings with no correction are explained (a fast converter that never gains half a
  second within a stretch), and their borrowed rates are capped by that half second (model5). To strengthen: a rate
  of their own for each, and the transfer delay that sets how late the reference sits.'
