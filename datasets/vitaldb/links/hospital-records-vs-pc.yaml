id: hospital-records-vs-pc
name: Hospital records clock against the recorder PC
summary: >-
  The offset between the anaesthesia record and lab systems and the recorder PC cannot be measured in the release: it
  is confounded with documentation lag. Entries rarely precede the device events they document.
clock: hospital-records
against: recorder-pc
correction:
  rule: >-
    Not observable. The recorder takes the VitalDB server's time at each start ([[link:recorder-pc-vs-utc]]); the
    EMR server was probably on the hospital's default network time ([[reference:lee2026correspondence-nov]]), so the
    two can differ by whatever separates those sources, and by the recorder's drift since its last start. Times in the record were entered by hand, usually
    at 5-minute resolution ([[parameter:emr-rounding]]).
status: assumed
