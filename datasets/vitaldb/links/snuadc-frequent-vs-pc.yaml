id: snuadc-frequent-vs-pc
name: SNUADC (frequent-correction mode) against the recorder PC
summary: >-
  In frequent-correction mode the SNUADC stamps follow the PC, with small forward steps; the −0.95 ppm they show
  against the sample count is stamp arithmetic.
clock: snuadc-sample
against: recorder-pc
modes: [frequent]
rate: snuadc-stamp-arithmetic
correction:
  rule: >-
    Small forward steps of +5 to +15 ms, about one an hour; never the 0.48 s pull-back of step mode. The SNUADC
    runs slow (a median +3.3 ppm); at each read the recorder fills the shortfall with blank samples, which show
    as whole-sample gaps in the stamps ([[study:vital-recorder-stamping-rules]]).
  size: snuadc-frequent-steps
status: measured
