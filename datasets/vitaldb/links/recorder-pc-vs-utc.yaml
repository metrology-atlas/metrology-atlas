id: recorder-pc-vs-utc
name: Recorder PC against UTC
summary: >-
  The recorder PCs were synchronised to UTC(KRIS), Korea's national time scale, with UTCk, the time program of the Korea
  Research Institute of Standards and Science (KRISS), as the dataset's creator reports ([[reference:lee2026correspondence]]).
  The offset itself is not observed in the release, and no step of 0.5 s or more appears anywhere in it. The PC's rate
  is measured against the mains grid instead ([[link:recorder-pc-vs-grid]]).
clock: recorder-pc
against: utc
correction:
  rule: |
    UTCk sets the PC clock from KRISS's NTP server, ntp.kriss.re.kr, which KRISS keeps on UTC(KRIS)
    ([[reference:kriss-utck]]). KRISS warns of errors from a few milliseconds to a few hundred milliseconds, depending on the
    network. How often UTCk synchronised during the collection is not known (asked). Whatever correction it made is
    smaller than 0.5 s: no simultaneous jump of every device of that size was found in any file
    ([[parameter:pc-step-bound]]).
  period: pc-sync-period
status: estimated
