id: recorder-pc-vs-utc
name: Recorder PC against UTC
summary: >-
  Vital Recorder does not stamp with the Windows clock. At start-up it reads the time once from the VitalDB server
  and stores its difference from the PC clock; after that its time advances only by the PC's hardware timer (the
  Windows multimedia timer, 1 ms resolution) [[reference:lee2026correspondence-9nov]]. Its offset from UTC is therefore the server's own offset and the
  delay of that one request, plus the timer's drift since the start: [[value:pc-grid-rate]] against the grid
  ([[link:recorder-pc-vs-grid]]), so [[value:pc-utc-offset]] after 5 hours. The offset itself is not observed in
  the release, whose dates are shifted.
clock: recorder-pc
against: utc
correction:
  rule: |
    The server time is read again at every start of Vital Recorder: it restarts itself once it has run for more than
    5 hours and is waiting for the next patient (an option on by default), and whenever the PC restarts, for example after Windows updates
    ([[parameter:pc-sync-period]]; [[reference:lee2026correspondence-9nov]]). A run therefore lasts at least 5 hours
    unless the PC restarts, and can last longer through a long case. Within a run nothing steps the recorder's time: no simultaneous jump of
    every device of 0.5 s or more was found in any file ([[parameter:pc-step-bound]]). The PC's Windows clock, which
    was synchronised by hand to UTC(KRIS), Korea's national time scale, with KRISS's UTCk program
    ([[reference:lee2026correspondence]], [[reference:lee2026correspondence-nov]], [[reference:kriss-utck]]), mattered
    only when the server request failed at start-up. How often that happened is not known.
  period: pc-sync-period
status: documented
