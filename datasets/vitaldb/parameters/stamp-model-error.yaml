date: 2026-11-09
notes: >-
  The whole release (2,716 recordings with at least 5 good burst windows), stamp model with setup-rate fallbacks
  (burst validation model4, 9 November 2026: a track without a whole tooth takes its recording station's rate before
  its port's, and a BIS without one no longer keeps a line fit). With model3 (19 October; port rates, BIS line fits):
  42 ms median, p90 150 ms, 62 ms robust SD, 17 and 30 ms with the recording's own bursts, 2,710 recordings. The pilot
  gave 33 ms median, p90 116 ms (16 and 67 ms with the case's own bursts) in 143 cases; the whole release includes
  recordings with no correction, with mode changes and with many gaps, which the pilot's cases mostly lacked.
