id: stamp-model-error
name: EEG–ECG timing error after the stamp model
quantity: EEG–ECG timing error per 10-minute window with the stamp model and the SNUADC mode's constant.
value: 0.040
spread: {n: 2717}
unit: s
display: "median absolute error 40 ms, p90 138 ms; standard uncertainty 59 ms (robust SD, an upper bound); with the recording's own bursts 15 ms median, 25 ms SD"
status: measured
study: snuadc-stamp-sawtooth
about: [bis-vs-snuadc, bis-eeg]
headline: true
date: 2026-11-09
notes: >-
  The whole release (2,717 recordings with at least 5 good burst windows), stamp model with setup-rate fallbacks
  and the no-correction rate bound (burst validation model5, 9 November 2026: a track without a whole tooth takes its
  recording station's rate before its port's, a BIS without one no longer keeps a line fit, and a SNUADC track with
  no correction at all has its borrowed rate capped at 0.5 s over its longest stretch between gaps, the limit set by
  Vital Recorder's re-anchoring rule, [[reference:lee2026correspondence-9nov]]). With model4 (no cap): 40 ms median,
  p90 145 ms, 59 ms robust SD, 15 and 27 ms with the recording's own bursts, 2,716 recordings. With model3 (19 October; port rates, BIS line fits):
  42 ms median, p90 150 ms, 62 ms robust SD, 17 and 30 ms with the recording's own bursts, 2,710 recordings. The pilot
  gave 33 ms median, p90 116 ms (16 and 67 ms with the case's own bursts) in 143 cases; the whole release includes
  recordings with no correction, with mode changes and with many gaps, which the pilot's cases mostly lacked.
