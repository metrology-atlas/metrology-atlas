id: pc-grid-rate
name: Recorder PC rate against the mains grid
quantity: How fast the recorder PC runs against the grid (f_PC − f_grid), per recording, through the SNUADC hum.
unit: ppm
display: "about −14 ppm (median; the PC runs slow), recordings whose SNUADC rate comes from whole teeth; setups −25 to −3 ppm"
status: measured
study: mains-grid-pc-rate
about: [recorder-pc-vs-grid]
date: 2026-11-09
notes: >-
  −14.0 ppm (IQR −29.5 to −3.4) in 318 recordings whose SNUADC rate comes from whole teeth
  ([[parameter:pc-grid-rate-multi]]). Selected by rate, so not a population value. Recordings with one correction have
  no measured rate ([[parameter:pc-grid-rate-single]], withdrawn).
  Against UTC only if the grid keeps its nominal frequency on average (assumed).
