id: snuadc-uncorrected-drift
name: Drift of the working reference without stamp corrections
quantity: >-
  Error of the SNUADC rate the stamp model uses in recordings without stamp corrections (model5: the setup's or port's
  rate, capped so the count gains under 0.5 s per stretch), against the BIS-checked drift (zero-centred robust SD over
  recordings).
value: 9.5
unit: ppm
spread: {n: 223}
display: "9.5 ppm on the stamp model's rate (23 ms/h median); 12 ppm with the hum rate (29 ms/h)"
status: measured
study: hum-snuadc-rate
about: [snuadc-sample]
date: 2026-11-11
headline: true
notes: >-
  223 recordings without SNUADC corrections whose BIS rate comes from its own corrections; 57% of recordings have no
  SNUADC correction, 1,248 of them hum. vitaldb-bench tools/hum_snuadc_rate.py on the burst validation of model5 (work/hum_snuadc/m5/hum_summary.json, recorded run, 11 Nov 2026). With model3 (the port's rate, uncapped; 29 Oct, work/hum_snuadc/
  release) it was 31.3 ppm (76 ms/h): model5's cap removed most of it.
sources:
- output: W:hum_snuadc/m5/hum_summary.json
  key: test.assumed_rate.zero_robust_sd_ppm
- output: W:hum_snuadc/m5/hum_summary.json
  key: test.assumed_rate.n
  field: n
