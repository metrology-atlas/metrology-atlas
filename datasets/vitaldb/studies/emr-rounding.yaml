id: emr-rounding
name: Anaesthesia record times are rounded up
summary: >-
  Anaesthesia start and end entered on a 5-minute mark sit 90–290 s later, against device markers, than entries typed
  to the minute. Rounding up to the next 5 minutes fits every one of 11 markers better than rounding to the nearest
  or down.
date: 2026-10-12
status: current
methods: [clinical-time]
techniques: [null-controls]
clocks: [hospital-records, recorder-pc]
devices: [clinical-records, orchestra, bis, primus, vital-recorder]
variables: [emr-events, pump-rates, bis-index, primus-numerics]
data: All 6,388 cases.
background: |
  The clinical table's anaesthesia and operation times come from the electronic anaesthesia record. Some are typed
  to the minute, many fall on 5-minute marks. If 5-minute entries are rounded, the rounding direction decides where
  the true event lies.
method: |
  Device markers on the recorder clock (propofol and remifentanil infusion start and stop, BIS below 60 or above 80,
  ventilation and ETCO2 start and stop, recording end) were compared with the EMR time: D = marker − EMR time. Cases
  were split by the recovered case clock into 5-minute entries (on an absolute 5-minute mark) and minute entries. The
  minute group's D is the documentation lag; convolving it with each rounding kernel (nearest, floor, ceiling)
  predicts the 5-minute group, scored by kernel-density log-likelihood.
results: |
  - **Every marker agrees in sign:** the 5-minute group's median shifts by −89 to −293 s against the minute group,
    and all 11 confidence intervals exclude 0. Rounding up predicts −150 s, nearest 0 and floor +150.
  - **Ceiling wins for all 11 markers,** with small margins at anaesthesia start (induction markers spread widely)
    and large ones at anaesthesia end.
  - **Shifts beyond −150 s** (median about −200 s) suggest 5-minute entries are also written a little later,
    perhaps retrospectively.
  - **ETCO2 stop against anaesthesia end, as an example:** the 5-minute entries (6,010) sit left of the minute entries
    (306), close to what rounding up predicts and far from rounding to the nearest or down, and further left still.

  [[figure:emr-rounding]]
discussion: |
  Read a 5-minute EMR time t as the interval (t − 300 s, t]: the event is estimated at t − 150 s (SD 87 s), and the
  entry is known no earlier than t plus the documentation lag. Minute entries keep ±60 s. The clinical_time labels in
  the [[code:timenet/packages/timenet-connectors/src/timenet_connectors/datasets/vitaldb/vitaldb/connector.py|TimeNet import]] carry these intervals. The extra ~50 s cannot be separated from rounding with these data.
limitations: The two groups may come from different staff or workflows. Rounding is measured for anaesthesia start and end, and assumed for operation start and end.
open_questions:
  - title: "About 50 s more than rounding"
    kind: phenomenon
    summary: >-
      The anaesthesia record times sit later than rounding alone explains. Documentation lag and an offset between
      the EMR clock and the recorder cannot be separated with these data.
  - title: "Rounded up or to the nearest: two studies disagree"
    kind: conflict
    summary: >-
      For anaesthesia start, the device markers here favour rounding up, but only by a small margin, while the
      value model, which compares the charted time with the recording start, prefers the nearest mark by 47 BIC
      points ([[study:value-model-anestart]]). For anaesthesia end the two agree (rounded up). Operation start and
      end were not measured here; their value models give the nearest mark and rounding down
      ([[study:value-model-opend]], [[study:timestamp-derived-intervals]]), while the EMR timing entry
      ([[variable:emr-events]]) treats every 5-minute entry as rounded up. Not reconciled.
code:
  - vitaldb-bench/tools/emr_markers.py
references: [rietveld2002rounding]

figures:
  - id: emr-rounding
    file: emr-rounding.png
    theme: heaping
    source: vitaldb-bench tools/emr_markers.py
    caption: >-
      Left: ETCO2 stop minus the EMR anaesthesia end, for times typed to the minute (grey) and on a 5-minute mark
      (blue), with the 5-minute group predicted from the minute group under each rounding rule. Right: for all 11
      device markers, the shift of the 5-minute group's median against the minute group's, with its bootstrap 95%
      interval; rounding up predicts −150 s, to the nearest 0 and down +150 s.
    alt: Left, histograms with the blue 5-minute distribution shifted left of the grey minute distribution and closest to the red rounded-up prediction. Right, eleven intervals all left of zero, most around minus 200 s.
