id: spo2-latency
name: SpO2 and pulse rate latency from step events
summary: >-
  SpO2 cannot be recomputed from one plethysmogram, so its timing comes from events that change the PLETH abruptly.
  SpO2 lags the recorded PLETH by about 4 s and then smooths over roughly 10–20 s.
date: 2026-10-12
status: current
methods: [delays-and-windows]
techniques: [null-controls]
devices: [solar8000]
variables: [solar8000-spo2, solar8000-pleth-hr, snuadc-pleth]
data: >-
  231 cases (the pilot, 14 October). Times are relative to the recorded PLETH, itself about 0.4 s behind the
  finger. The same tool was later run on the whole release (6,152 cases; [[study:numerics-derivation-release]]):
  the probe-off blank comes 0.82 s after pulse loss there (IQR −0.04 to 1.99 s) against 0.6 s here
  (`overnight/spo2/summary.json`). The onset latency ([[parameter:spo2-onset]]) is from the pilot.
results: |
  | Event | Events | Result |
  |---|---|---|
  | Probe off (flat PLETH) | 139 | SpO2 blanks 0.6 s after pulse loss (IQR −0.4 to 1.9); first value 5.5 s after return |
  | Low perfusion | 189 | SpO2 freezes more often than it blanks: it holds its last value in 51–56% of 5–20 s episodes and blanks in 13–18% (whole release: 49–53% and 17–20%) |
  | Electrocautery | 3,132 | No effect: 2% reach the PLETH; SpO2 moves in 7% vs 5% at random |
  | PLETH-only artefacts (motion) | 296 | SpO2 moves ≥ 2% after 34%; dip starts +4 s, deepest +8 s, recovers by ~25 s |
  | NIBP cuff inflation | 991 | Not usable: only 4 occluded the oximeter arm |

  PLETH_HR blanks and resumes at the same moments as SpO2: one module.
discussion: |
  These events time the oximeter's processing, not a true desaturation. The SpO2 window (10–20 s) is an estimate,
  not a measurement.
limitations: |
  The NIBP row is not in the pilot's saved summary.
code:
  - vitaldb-bench/tools/spo2_event_pilot.py
figures:
  - id: spo2-event-pilot
    file: spo2-event-pilot.png
    theme: delay and window fits
    source: vitaldb-bench tools/spo2_event_plot.py
    caption: SpO2 is blanked or frozen when the pulse is lost and returns about 5.5 s after the pulse comes back; PLETH artefacts move SpO2 and PLETH_HR within seconds.
    alt: Grouped bars of blanked or frozen fractions, box plots of timings, and two event-averaged response curves.
