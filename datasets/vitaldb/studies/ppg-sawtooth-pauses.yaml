      Two delay traces with dashed lines at slips and a grey shaded stretch in each; the top zoom shows a scatter of
      beats stepping up about 30 ms with a burst of outliers before it; the bottom zoom shows the delay falling along a
      dashed line and then rising back over two minutes.
