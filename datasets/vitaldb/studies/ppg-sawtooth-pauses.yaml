id: ppg-sawtooth-pauses
name: Where the PPG sawtooth stops
summary: >-
  In some stretches no slip comes although several were due. The PPG delay there is flat, not hidden: the monitor
  keeps framing, and only the content's drift against the frames has stopped.
date: 2026-10-11
status: current
methods: [signal-borne-clocks]
techniques: [phase-step-detection, null-controls]
clocks: [oximeter-frame-clock]
devices: [solar8000, snuadc]
variables: [snuadc-pleth, snuadc-art]
data: 98 stretches (67 hours) where slips were due but none was seen; 32 whole recordings (47 hours) without a slip.
method: |
  In each stretch the case's own sawtooth (one frame, at the recording's rate, best of 50 phases) was fitted against
  a mirrored sawtooth as the control. Slip prediction looked one tooth beyond the first and last accepted slips and
  accepted a slip there only if a step showed.
results: |
  - **The delay is flat:** median slope −0.15 times the sawtooth rate; only 13 stretches creep without slipping.
  - **The frame clock keeps running** through them: found in 82 of 98 stretches, at the rate of the corrected part of
    the same case to within 1 ppm.
  - **Whole recordings without slips are robust,** but at least one shows a slow drift of about 7 ppm and a 20 ms
    step instead: possibly a much slower sawtooth.
  - **Slip prediction** moved tiers A + B from 26% to 29% of time, with unchanged error.
discussion: |
  Stretches that pass the test are labelled N (offset only, no sawtooth). Recordings whose own tooth rate differs
  from their setup's by more than 20% use their own rate, and none of their teeth is labelled N.
limitations: What replaces the sawtooth at the start and end of some recordings is not simply flat (fast ABP→PPG ramps of several ms per minute). Open.
open_questions:
  - title: "What replaces the sawtooth"
    kind: phenomenon
    summary: >-
      At the start and end of some recordings the PPG lag is not flat but ramps by several ms per minute against
      arterial pressure. Its cause is not known.
figures:
  - id: sawtooth-pauses
    file: sawtooth-pauses.png
    theme: example traces
    source: ad hoc (no script in vitaldb-bench yet; to be regenerated by one)
    caption: Three anonymous recordings where the PPG sawtooth pauses, against the sawtooth expected had it continued.
    alt: Three stacked traces of arterial-pressure-to-PPG lag with shaded pause spans and dashed expected sawtooth lines.
