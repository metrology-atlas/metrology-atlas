    records: [2140, 1363]
    caption: >-
      (a) A two-tooth stretch without a detected slip in [[case:2140]] (grey), its slips on one grid: at the slip the
      grid predicts (dotted) there is a one-frame step 1.5 s away, preceded by a burst of disturbed beats that kept
      the detector from accepting it (zoom). (b) The longest stretch between two slips whose slope is near zero, in
      [[case:1363]]: the delay creeps as the sawtooth would (dashed, zoom) for 8 minutes and then rises back slowly.
