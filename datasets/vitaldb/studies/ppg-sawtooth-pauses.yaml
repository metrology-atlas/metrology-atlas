id: ppg-sawtooth-pauses
name: Where the PPG sawtooth stops
summary: >-
  Third of the sawtooth series ([[study:ppg-sawtooth-slips]], [[study:ppg-sawtooth-period]]), rebuilt on 2 November.
  With the new slip detector and the slip grid, stretches of 1.5 teeth or more without a slip are fewer than first
  reported: 68 stretches, 26.5 hours, in 43 of 273 recordings. Most of those inside a recording are two teeth long
  with the slips on either side on one grid, and where the grid predicts the missing slip, two times in three a
  step of most of a frame is there, missed because a ramp or a disturbance coincided with it. Some stretches look
  flat; the frame clock keeps its rate and phase through them; and the 27 recordings without any slip show no
  hidden sawtooth, though half drift slowly. In development.
date: 2026-11-02
status: draft
methods: [signal-borne-clocks]
techniques: [phase-step-detection, null-controls]
clocks: [oximeter-frame-clock]
devices: [solar8000, snuadc]
variables: [snuadc-pleth, snuadc-art]
data: |
  The benchmark of [[study:ppg-sawtooth-slips]]: the longest continuous stretch of ECG lead II and PLETH (20–90 min)
  in 273 of the 300 random cases of `$W/pat/cases_pat300.json` (373 hours), with the slips found there.
background: |
  The first version of this study (11 October) reported 98 stretches (67 hours) where slips were due but none came,
  and 32 whole recordings (47 hours) without a slip; there the delay was flat (median slope −0.15 of the sawtooth's
  rate), the frame clock ran on (82 of 98 stretches, within 1 ppm), and predicting slips one tooth beyond the first
  and last raised tiers A and B from 26% to 29% of the time. Its script and outputs were not kept, so it could not
  be reproduced, and the current fit ([[software:physiosync]]) relies on it: stretches that pass its pause test are
  labelled N (offset only). This version rebuilds it with public code and asks one more question that the slip grid
  makes possible: when slips resume, do they continue the old grid (the sawtooth went on unseen) or start a new
  phase?
method: |
  Commands (vitaldb-bench tools/sawtooth_char.py; tool SHA-256 46110308f725… (bench8 was made with an earlier state of it whose slips stage is the same)): the slips run of
  [[study:ppg-sawtooth-slips]] into `$W/sawtooth_char/bench8` (`slips --inj-seeds 6`, 4 parts, then `agg`), then
  `mech --scan $W/sawtooth_char/scan --slips $W/sawtooth_char/bench8/slips.jsonl --recordings
  $W/sawtooth_char/bench8/recordings.csv --root $R --out $W/sawtooth_char/mech3/mech_partK.jsonl --part K --of 3`,
  concatenated, and `mech-agg --mech $W/sawtooth_char/mech3/mech.jsonl --recordings
  $W/sawtooth_char/bench8/recordings.csv --clocks $W/clock_network/r4/clocks.csv --out $W/sawtooth_char/mech3`
  (mech_summary.json: `pauses` and `whole_without_slips`).

  - **Stretches without a slip:** in each recording with an upward sawtooth (3 or more slips), every stretch of
    1.5 teeth or more between two slips (middle), before the first or after the last (start, end).
  - **Flat or creeping:** the slope of the ECG→PPG delay (beat median of foot, upstroke and peak; 30 s left out at
    each end) as a share of the sawtooth's creep: 1 creeping as usual, 0 flat.
  - **A sawtooth unseen?** physiosync's sawtooth_evidence at the recording's rate (the share of variance a one-frame
    sawtooth explains, best of 50 phases) against the same with the sawtooth mirrored, which no slip produces.
  - **The frame clock** in the stretch (raw PLETH maxima): its rate against the whole recording's, and whether the
    recording's own frame comb (rate and phase) still holds there.
  - **Does the phase carry on?** For a middle stretch, whether the slips on either side lie on one run of the slip
    grid ([[study:ppg-sawtooth-period]]), or the phase has moved (the shift, in teeth); and how far the delay falls
    from just after the first slip to just before the second, in frames, against ordinary teeth.
  - **The missing slip.** Inside each middle stretch, the slips the grid predicts (evenly spaced between the two
    slips): the best one-frame step within 10 s, its free size, its persistence and the tests it fails. The control
    is the same search half way through ordinary teeth, where no slip should be.
  - **Recordings without any one-frame step:** the slope over the whole stretch, the sawtooth evidence at the setup's
    rate, and the frame clock.
results: |
  - **Fewer stretches:** 68 of 1.5 teeth or more without a slip, 26.5 hours in 43 recordings (49 middle, 6 at the
    start, 13 at the end).
  - **Most middle stretches look like one missed slip.** They are two teeth long (median 2.0, interquartile range
    2.0–2.07); in 29 of 49 the slips on either side lie on one grid, so the phase carried straight through; and the
    delay falls by a median 1.00 frame across them, as over an ordinary tooth (0.90). The detector finds about 88%
    of injected slips, which leaves enough missed slips to account for these.
  - **The missing slips are mostly there.** At the 33 places the grid predicts a slip inside such stretches, the
    best step has a median size of 0.73 frame and persists at 0.67 frame, a median 1.5 s from the prediction; 19 lie
    between 0.4 and 1.4 frames and 5 are larger, against 36 of 442 controls half way through ordinary teeth (8%,
    median size 0.13, persistence −0.09). Only 3 pass the detector's tests for a slip the grid supports: the rest
    fail on the step's size or persistence (22, often a disturbance within the window), a coinciding ramp (17), or
    both.
    About a third show no step at all. Where the phase has moved (33 places in stretches with a new phase), the
    evenly spaced positions look like the controls (median 0.19 frame).
  - **Some look flat.** In 33 of the 68 stretches the delay's slope is under 0.3 of the creep (14 of them middle
    stretches on one grid, 7 with a new phase after); 13 creep at more than 0.7. A slope near zero is not proof of a
    flat delay: in the longest flat-looking stretch between two slips ([[case:1363]]) the delay creeps as usual for
    8 minutes and then rises back by about a frame over 1–2 minutes instead of in one step, so 33 is an upper bound. A sawtooth explains more than half
    the variance in 21 (median evidence 0.26, mirrored control −0.09).
  - **The frame clock runs through them.** Found in 48 of 67 stretches; the recording's own frame comb holds there
    as well as over the whole recording (resultant median 0.44 against 0.42), so the frames keep their rate and phase.
  - **New phases after a stretch** (20 middle stretches) are not locked to quarter teeth (8 within ±0.03 against 4.8
    by chance, p = 0.08), unlike the phase jumps between slips ([[study:ppg-sawtooth-period]]).
  - **Whole recordings without any one-frame step:** 27 (33.8 hours). None shows a sawtooth (evidence median −0.20,
    mirrored control −0.15; none above 0.5), and the frame clock is found in 25; but 13 drift by more than 5 ppm
    (slope median −0.1, 5th–95th percentile −13 to +9 ppm).

  [[figure:pauses]]
discussion: |
  The first version's flat pauses were partly missed slips: a better detector and the grid explain most stretches
  inside a recording as one slip not seen, and the predicted slip is mostly found where the grid says, missed
  because something else happened at the same time. Of the stretches that look flat, some are not: the delay can
  return by a frame slowly instead of in one step. Where the delay is flat, only the content's drift against the
  frames stops; the frames themselves run on unchanged. For correction, a stretch of exactly two
  teeth on one grid should be corrected as two teeth with a slip between them, not labelled N; and a recording
  without slips is not necessarily free of drift.
limitations: |
  Development version (thresholds set on these recordings). The test of whether a middle stretch is a missed slip
  rests on the grid and the fall of the delay, not on finding the slip; stretches at the ends cannot be tested that
  way. The first version's slip-prediction result (tiers A and B, 26% to 29%) concerns the current fit and is not
  repeated here.
open_questions:
  - title: "Slips that come slowly"
    kind: phenomenon
    summary: >-
      In some stretches the delay returns by about a frame over a minute or two instead of in one step. Whether
      that is a slip spread out by the monitor, or physiology that happens to cancel the creep, is not known; a fit
      of creep plus a ramp of one frame, with the ramp's length free, across all stretches would show how common it is.
  - title: "A third of the predicted slips show no step"
    kind: phenomenon
    summary: >-
      Where the grid carries on across a two-tooth stretch but no step is found at the predicted slip, the phase
      moved on without a visible slip. Whether the step is hidden by physiology there or absent is open.
  - title: "What stops the content's drift"
    kind: phenomenon
    summary: >-
      In the flat stretches the frames run on and the content stops drifting against them. Some recordings without
      slips drift slowly instead, by 5 ppm or more. What sets either is not known.
