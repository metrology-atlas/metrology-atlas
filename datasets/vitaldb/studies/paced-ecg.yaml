id: paced-ecg
name: Paced ECG as an independent clock
summary: >-
  Fixed-rate pacing gives a clock the recording chain cannot touch. Timing paced beats on three timelines shows that
  each SNUADC step-mode correction loses about [[value:snuadc-reset-loss|.0]] of signal, and that nothing else breaks the sample stream.
date: 2026-10-17
status: current
methods: [signal-borne-clocks]
techniques: [template-beat-timing, phase-step-detection]
clocks: [pacemaker, snuadc-sample, recorder-pc]
devices: [pacemaker, snuadc, vital-recorder]
variables: [snuadc-ecg-ii]
data: |
  All 6,388 cases were screened for runs of beats at one constant interval. Seven pass, paced at about 1,204, 1,000
  and 860 ms (50, 60 and 70 bpm); only one of them ([[case:4631]]) lists a pacemaker in the pre-operative ECG field. About 40 more
  cases have long regular runs at 370–920 ms, but their interval wanders by about 1 ms between stretches: regular
  sinus rhythm, not pacing.
background: |
  Every clock in the recording chain is either corrected by the recorder or measured against a clock that is. A
  pacemaker at a fixed rate is different: beat *n* falls at *t₀ + n·P* on its own crystal, whatever the recorder
  does. Any break in a timeline shows as a phase step in the pacing train on that timeline.
method: |
  Each beat was timed by template matching (fit residual about 1 ms) and placed on three timelines: the sample
  count, the record stamps, and the stamp-model line. Between stretches paced at the same interval *P*, a phase step
  on a timeline marks a break in that timeline. Steps of 6 ms or more were examined one by one, and an intervening
  poorly matched beat (an intrinsic or fusion beat, which resets a demand pacemaker) was taken as an explanation.
results: |
  - **The pacing intervals agree between stretches** to 0.05–0.1 ms on the sample count.
  - **Each step-mode correction loses about [[value:snuadc-reset-loss|.0]] of signal.** At the three corrections inside paced rhythm (two
    cases, both leads where available), the pacing train steps on the sample count by −17.3 to −20.3 ms (two corrections, [[case:830]] on
    both leads). The record stamps step by −480.6 to −481.0 ms, and the train on stamp time by −498.0 to −502.2 ms
    ([[case:830]]'s two readings are stored wrapped by one pacing period, +500.4 and +499.8 ms). So the true correction
    is about [[value:snuadc-step-correction-size]], close to a 0.5 s threshold, and the stamps show only 0.48 s of it because about 9–10 samples are
    never taken: the recorder discards the block it has just read, normally about 10 samples [[reference:lee2026correspondence-9nov]]. Every record still holds 100 samples, so nothing in the file shows the loss.
  - **Recording gaps of 16–18 s shift the stamps by 124–136 ms** against the pacing train (two gaps in two cases, one
    seen on both leads).
  - **No other breaks.** Apart from corrections and gaps, no phase step of 6 ms or more went without an intervening
    beat or a poorly matched beat. No hidden concatenation was found in the paced stretches.
discussion: |
  The −0.48 s correction quoted for step mode is the visible part of a [[value:snuadc-step-correction-size]] resynchronisation. Without the loss,
  every sample after a correction sits about [[value:snuadc-reset-loss|.0]] early, adding up over a case's one to three corrections. The
  ECG–EEG burst lag confirms the sign without pacing: it steps by +13.0 ± 1.7 ms at each correction (93 cases),
  a little under the direct measurement.

  The stamp model now adds the loss back at each correction, which removes the burst-lag step (−3.3 ± 1.8 ms after
  the fix) but barely moves the overall error, because the loss is small beside the window-to-window spread of the
  burst lag. The slight overshoot hints that the average loss is nearer 15 ms.
limitations: |
  Three paced corrections in two cases. The gap shift is measured modulo one pacing period. The location of the
  lost time was not resolved here; [[study:reset-cluster-order]] later placed it inside the last old-grid record.
  The burst-lag steps in the discussion (+13.0 and −3.3 ms over 93 cases) are not in a saved aggregate; `results/clock/corr_burst.jsonl` holds the per-case rows.
open_questions:
  - title: "How much signal does each correction lose?"
    kind: next step
    summary: >-
      Three routes disagree: the paced corrections give 17.3–20.3 ms (mean [[value:snuadc-reset-loss|.0]], three
      measurements of two corrections), the ECG–EEG burst lag steps by 13.0 ± 1.7 ms at each correction, and the stamp
      model refitted with the paced value overshoots by 3.3 ± 1.8 ms, which points to about 15 ms. The stamp model and
      the vitaldb-bench tools keep 17.7 ms, the first reading, so that every timeline built on the sample count agrees
      with the model. The difference is about 0.15 ppm of rate at one correction every 2 hours, below the noise of
      every rate it feeds, and a few milliseconds of offset on the sample count over a long recording. More paced
      recordings with corrections, or the burst lag measured per correction, would settle it.
  - title: "Long regular runs that may be paced"
    kind: phenomenon
    summary: >-
      About 40 cases have long regular runs (370–920 ms) whose interval wanders by about 1 ms between stretches.
      Whether they are paced is not settled.
code:
  - vitaldb-bench/tools/paced_screen.py
  - vitaldb-bench/tools/paced_breaks.py
