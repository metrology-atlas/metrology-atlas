id: mains-grid-pc-rate
name: Mains hum as an outside clock, and the recording PCs against the grid
summary: >-
  The SNUADC waveforms carry the mains hum at 120 and 360 Hz in 39% of recordings. The grid is regulated to its
  nominal frequency, so the hum is a clock outside the recording, and through it the recorder PC's rate against the
  grid can be measured where the SNUADC's own rate is: the PCs run slow, about 14 ppm. Rates from recordings with only
  one SNUADC correction, which had suggested setups differing by tens of ppm, are not rates (9 November).
date: 2026-11-09
status: current
methods: [signal-borne-clocks]
techniques: [null-controls]
clocks: [recorder-pc, snuadc-sample, utc]
devices: [snuadc, vital-recorder]
variables: [snuadc-ecg-ii, snuadc-art]
data: |
  Pilot: 30 recordings with measured SNUADC and BIS rates. Whole release: all 6,388 recordings, on the longest
  contiguous run of records of each track, up to its first 60 min (27–28 Oct 2026). SNUADC ECG II, ECG V5, ART and
  CVP; BIS EEG1 and EEG2; in the pilot also PLETH and the Primus AWP and CO2.
background: |
  Korea's grid runs at 60 Hz. A grid frequency deviation is common to every device in a theatre, and each device sees
  the hum on its own sample count, offset by its own clock rate. The rates the atlas measures are all relative: one
  device against the recorder PC. A clock regulated from outside the recording breaks that circle.
method: |
  - **Lines.** At each harmonic h × 60 Hz (h = 1–8), at its aliased position for the track's rate (at 500 Hz: 120,
    180, 240, 140 [360], 200 [300], 80 [420] and 20 [480] Hz), the line strength is the peak of a 0.01 Hz Welch
    spectrum over the median of ±1 Hz.
  - **Frequency** of each strong line (SNR > 20; > 50 for results) by complex demodulation: the phase slope over 1 s
    blocks, as ppm of the harmonic, on the device's own sample count. A line at the true grid frequency appears at
    −(device fast) ppm, so line = f_grid − f_SNUADC.
  - **The PC against the grid.** With r = f_PC − f_SNUADC, the SNUADC rate from its stamp corrections
    (physiosync.stamp_clock; negative = SNUADC fast), g = r − line = f_PC − f_grid: positive means the PC runs fast.
    Only rates from at least one **whole tooth** (two corrections in one stretch) are used. With one correction,
    stamp_clock fits a line through a staircase of one step instead, and that slope depends on where the step falls,
    not on the rate: on synthetic recordings with a known rate it is off by −49 to +23 ppm (10th–90th percentile),
    against 0.0 ppm from whole teeth (vitaldb-bench examples/sim_stamp_clock_onecorr.py).
  - **Controls.** Two SNUADC channels' hum phases against each other; minute-by-minute line frequency in two channels.
results: |
  - **Hum present** in [[value:snuadc-hum-share|number]] of 6,348 recordings with SNUADC, mainly at 120 Hz and 360 Hz (seen at 140 Hz). The 60 Hz
    fundamental is weak and inconsistent. 240 Hz mixes mains with the monitor's own output line, so its estimates
    scatter ([[clock:monitor-output-clock]]).
  - **Not mains:** the PLETH lines at 60, 120 and 180 Hz belong to its 30 Hz frame family; the Primus pressure lines
    are mechanical, and 62.5 Hz sampling cannot carry the hum.
  - **Controls:** two SNUADC channels' hum phases cancel to 0.0 ppm (0.2 rad residual over 60–118 min, 10 s blocks);
    their minute-by-minute frequencies have rank correlation +0.63. The grid varies by 11–20 ppm (SD) from minute to
    minute.
  - **The PC against the grid** (1,206 recordings with hum and at least one correction; 9 November, `mains_hum.py agg
    --min-teeth 1 --setup-min-n 10`):

    | SNUADC rate | n | g, median | IQR |
    |---|---|---|---|
    | From whole teeth | 318 | [[value:pc-grid-rate-multi]] | −29.5 to −3.4 |
    | No whole tooth (a line fit, not a rate) | 888 | +1.1 ppm | −17.7 to +15.8 |

    By setup, whole teeth only (≥ 10 recordings, 7 setups): medians −25 to −3 ppm ([[parameter:pc-grid-rate-setups]]), none with 30. By
    SNUADC port: COM4 −12.6 ppm (195), COM18 −15.7 (38), COM9 −10.3 (30).
  - **Superseded (28–30 October):** the same split by number of corrections, +1.6 ppm with one (846) and −13.8 ppm
    with two or more (360), setup medians −47 to +18 ppm (9 setups) and ports from −43 to +13.5 ppm. Those spreads
    came mostly from the recordings without a whole tooth ([[parameter:pc-grid-rate-single]], withdrawn).
discussion: |
  The first check of any clock in the release against an outside, regulated reference. Where the SNUADC's rate is
  measured, the recording PCs run slow against the grid by about 14 ppm, and the setups' medians fall within about
  20 ppm of one another. The earlier finding that setups differ by tens of ppm, from −47 to +18 ppm, came from the
  recordings with a single correction, whose "rates" were line fits through one step (9 November, confirmed on synthetic
  recordings).

  **Which recordings carry corrections is selected by their rate.** A recording only gets stamp corrections once its
  stamps have run 480 ms ahead, and a whole tooth needs a second one in the same stretch, which depends on r = line +
  g, so g is selected along with it: −14 ppm describes the recordings fast enough to collect two corrections, not
  every PC. [[study:hum-snuadc-rate]] calibrates g on recordings like those it is applied to.

  This replaces the assumed PC drift ([[parameter:pc-utc-drift]], 0.1–10 ppm): the measured rates are larger. It
  gives a rate, not an offset: the PC's absolute time (its NTP steps) is not seen this way
  ([[study:ntp-from-mains]] tried and failed).
limitations: |
  The grid's own frequency wanders by 11–20 ppm from minute to minute and its hourly mean by a few ppm; each
  recording's value carries that. The grid is assumed to keep its nominal frequency on average; the release's
  shifted dates make it impossible to look the grid up. Only recordings with hum and a measured rate.
open_questions:
  - title: "Do setups differ?"
    kind: next step
    summary: >-
      With rates from whole teeth only, seven setups have 10 or more recordings, with medians from −25 to −3 ppm.
      Whether that spread is real (PC hardware, time-synchronisation configuration, the theatre) or sampling noise
      needs more recordings per setup, for example rates from the hum against another device with a measured rate.
      Whether a PC's rate changes over the years of the release is not known.
  - title: "The 240 Hz line"
    kind: next step
    summary: >-
      Separating the monitor's own 240 Hz output line from the 4th mains harmonic in the same window (two close lines).
code:
  - vitaldb-bench/tools/mains_hum.py
  - vitaldb-bench/tools/mains_phase.py
  - vitaldb-bench/tools/mains_hum_plot.py
  - vitaldb-bench/examples/sim_stamp_clock_onecorr.py
figures:
  - id: pc-rate-vs-grid
    file: pc-rate-vs-grid.png
    theme: distributions of measured parameters
    source: vitaldb-bench tools/mains_hum_plot.py
    caption: >-
      The recorder PC's clock rate against the mains grid, through the SNUADC hum. (a) Where the SNUADC's rate comes
      from whole teeth (blue, a median of −14 ppm), and where it does not (grey): there the "rate" is a line fitted
      through one step, so its spread is the fit's, not the PCs'. (b) Median and interquartile range by recording setup,
      whole teeth only, setups with 10 or more such recordings: −25 to −3 ppm.
    alt: Two overlaid histograms, a narrower blue one centred near −14 ppm and a wider grey one near zero, and a
      dot-and-range plot for seven setups, all below zero.
typed_ok:
  - {parameter: pc-grid-rate-multi, text: "-14", why: "the median rounded to whole ppm in prose and the figure caption; the results table links the value"}
  - {parameter: pc-grid-rate-single, text: "1.6", why: "the withdrawn value, quoted as the superseded result"}
