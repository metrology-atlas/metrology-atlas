figures:
  - id: pc-rate-vs-grid
    file: pc-rate-vs-grid.png
    theme: distributions of measured parameters
    source: vitaldb-bench tools/mains_hum_plot.py
    caption: >-
      The recorder PC's clock rate against the mains grid, through the SNUADC hum. (a) By where the SNUADC's rate
      comes from: the recording's own whole teeth (blue, a median of −14 ppm), its setup's rate, borrowed (orange,
      −12 ppm), or neither (grey): there the "rate" is a line fitted through one step, not a rate, and it is not used.
      (b) Median and interquartile range by recording setup, own and borrowed rates together, setups with 30 or more
      recordings: −57 to +7 ppm.
    alt: Three overlaid histograms, blue and orange centred near −13 ppm and grey near zero, and a dot-and-range plot
      for eight setups, six between −16 and −5 ppm, one near −57 and one near +7.
