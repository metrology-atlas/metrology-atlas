    file: raw-pat-by-setup.png
    theme: distributions of measured parameters
    source: ad hoc (no script in vitaldb-bench yet; to be regenerated by one)
    caption: Raw pulse arrival time per recording is similar across monitor ports and correction modes; the steepest upstroke follows the foot by about 60 ms.
    alt: Box-and-strip plot per setup and a histogram of upstroke minus foot.
  - id: pat-distribution
