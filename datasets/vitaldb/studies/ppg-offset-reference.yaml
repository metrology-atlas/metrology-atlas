id: ppg-offset-reference
name: The PPG hardware delay and the adopted pulse arrival time
summary: >-
  VitalDB's raw ECG→PPG pulse arrival time is about 0.4 s longer than physiology. Splitting it into a hardware delay
  (one value for the release; [[study:pat-offset-census]]) and a physiological part needs an adopted value from studies that sampled ECG and PPG on one
  clock: about [[value:adopted-pat]] for anaesthetised adults.
date: 2026-10-12
status: current
methods: [delays-and-windows, source-review]
clocks: [oximeter-frame-clock]
devices: [solar8000, snuadc]
variables: [snuadc-pleth, snuadc-ecg-ii]
data: >-
  232,931 beats in 293 of 300 random cases (raw PAT; 7 cases lack ECG lead II or PLETH); published shared-clock
  studies of awake adults.
background: |
  The median R-to-PPG-foot time in VitalDB is 0.64 s, against roughly 0.2–0.3 s in adults measured with shared-clock
  hardware; an earlier VitalDB study found 645 ± 26 ms. The excess is the monitor's buffering and filtering, and it
  cannot be separated from physiology inside VitalDB.
method: |
  Literature graded by how ECG and PPG were clocked: A (one acquisition unit), B (research equipment, shared clock
  likely), C (clinical monitor, excluded). Adults with an R-peak ECG fiducial and finger PPG foot.

  Raw PAT in VitalDB: [[code:vitaldb-bench/tools/pat.py]] on 300 random cases (`$W/pat/cases_pat300.json`, seed 7),
  up to ten 60 s windows each, seeded by case id; R peaks in ECG lead II and the foot, steepest upstroke and peak of
  the band-passed PLETH, plus a pairing-free check. [[code:vitaldb-bench/tools/pat_summary.py]] sums the per-case
  histograms and draws the distribution figure:
  `python tools/pat.py --root $R --cases $W/pat/cases_pat300.json --out $W/pat_summary/pat.jsonl --time-budget 3600`,
  then `python tools/pat_summary.py --scan $W/pat_summary/pat.jsonl --out $W/pat_summary`. Per-setup delays:
  [[code:vitaldb-bench/tools/setup_offsets.py]] on the per-recording raw levels of a first benchmark pass.
results: |
  - **Tier A studies put R-to-finger-foot PAT at about 200–285 ms** in awake adults; none gives a verifiable
    shared-clock value under anaesthesia.
  - **Anaesthesia lengthens PAT by about 40 ms** in monitor-based work (240 ms before induction, 279–284 ms after).
  - **For VitalDB** (adults under general anaesthesia, mean age about 58): about [[value:adopted-pat]], plausible range 250–290 ms.
  - **Hardware delay** with that value: about 385 ms (384.6 ms over the 262 benchmark recordings whose raw level lies
    in 0.4–1.0 s; `setup_offsets.json`, to the PPG foot; its input records were not kept, and the same tool on the
    nearest records gives 382.9 ms over 263, `$W/results/pat/setup_offsets_v2.json`). Per-setup values of
    368–399 ms were reported here first; the full census ([[study:pat-offset-census]], 5,536 recordings) found no
    difference between setups beyond ±15 ms and the same value, 385 ms (655 ms to the foot minus [[value:adopted-pat]]), so one
    global delay is used. The adopted value and the delay must use the same fiducial: [[value:adopted-pat]] is to the foot.
discussion: |
  The adopted value must use the same PPG point the software detects. The global delay is taken at the foot, where
  the [[value:adopted-pat]] applies; a PAT timed to the steepest upstroke comes about 60 ms later, and that difference stays in the
  corrected value ([[example:pulse-arrival-time]]). Since the census, one delay serves every recording, so a
  change to the adopted value moves every recording's level by the same amount.
limitations: The hardware delay is not observable in VitalDB; it rests on the adopted physiological value.
open_questions:
  - title: "Reproduction check (2 November 2026)"
    kind: next step
    summary: >-
      The raw PAT numbers reproduce exactly: rerunning tools/pat.py on the same 300 cases gives 293 cases and
      232,931 beats, the same histograms bin for bin, per-beat foot median 0.635 s, per-case foot median 0.640 s and
      upstroke minus foot 59 ms (`$W/pat_summary/pat_summary.json`, against the 10 October
      `results/pat/pat300_summary.json`, whose per-case medians were stored rounded). The distribution figure is
      now drawn by tools/pat_summary.py. The per-setup delays (368–399 ms, 19 setups; 384.6 ms over 262 recordings)
      are in the saved `results/pat/setup_offsets.json` from tools/setup_offsets.py, but the first benchmark pass
      that wrote its per-recording inputs has no saved script, and is superseded by [[study:pat-offset-census]].
      The raw-pat-by-setup figure (first drawn ad hoc on 266 benchmark recordings) is redrawn on the whole release
      from that census by tools/raw_pat_by_setup.py: `python tools/raw_pat_by_setup.py --cases
      $W/pat_census/aggf/cases.csv --modes $W/results/sync_full/snuadc_mode_label.json --out $W/raw_pat_by_setup`.
code:
  - vitaldb-bench/tools/pat.py
  - vitaldb-bench/tools/pat_summary.py
  - vitaldb-bench/tools/setup_offsets.py
  - vitaldb-bench/tools/pat_offset_census.py
  - vitaldb-bench/tools/raw_pat_by_setup.py
references: [allen2000variability, allen2002age, block2020conventional, jose2025exploring, kortekaas2018small, lee2019analysis, liao2023filtering, martin2016weighing, mohammadpoor2024use, obata2017noninvasive, vanvelzen2017increasing, youn2014changes, ruffolo2025high]
figures:
  - id: raw-pat-by-setup
    file: raw-pat-by-setup.png
    theme: distributions of measured parameters
    source: vitaldb-bench tools/raw_pat_by_setup.py
    caption: Raw pulse arrival time per recording (R peak to PPG foot, stored delays, no correction) is similar across monitor ports and correction modes over the whole release (5,533 recordings; median 655 ms, IQR 640–670; the 30 setups with 20 or more recordings have medians from 648 to 665 ms). The steepest upstroke follows the foot by 59 ms (median; p10–p90 55–65 ms).
    alt: Box-and-strip plot of per-recording foot delay for 30 setups and a pooled group, beside a histogram of upstroke minus foot.
  - id: pat-distribution
    file: pat-distribution.png
    theme: distributions of measured parameters
    source: vitaldb-bench tools/pat_summary.py
    caption: 'Measured R-peak to PPG time centres on about 0.64 s, far above the typical 0.2–0.35 s finger pulse arrival time: a hardware delay in the PLETH output.'
    alt: 'Three histograms: per beat, per-case medians, and a pairing-free check, each with the typical range shaded.'
