id: value-model-opend
background: |
  - Op end is a charted event time with a 1-minute chronon.
  - About one in twelve op ends appears to have been set from the recording itself rather than from the record (see the imputed-times study).
data: |
  - 5,850 op ends, after excluding the 537 imputed from the recording (598–604 s before it ends; status `imputed`).
  - 92 op ends do not share the sub-minute offset of the other charted times in their case and are flagged `clock_offset_mismatch`.
  - 52 op ends come after anaesthesia end and 108 equal it (anaesthesia ends with placeholder dates left out; 53
    with them; `screens.py timestamp-imputed-and-conformance`). Leaving out the imputed op ends (7 and 1 of them), the
    library flags 45 (`order_violation`) and 107 (`same_time`).
method: |
  - The true op end is modelled relative to the recording end with a log-spline offset (K = 12, chosen by BIC).
  - Nearest, floor and ceiling anchors were compared, along with 10- and 30-minute modes.
  - Posteriors were compared across K, because the latent is narrow relative to the grid.

  Commands (vitaldb-resolution, with $R the VitalDB folder): its parameters are those fitted on 13 October by a
  fitter not kept in the repository; v2 re-evaluated only the fit statistics. `python tools/fit_timestamps.py
  $R/clinical_data.csv opend` refits it with the library likelihood for comparison (add `--write` to replace the
  model). `VITALDB_DATA=$R python -m pytest tests/test_fit_consistency.py -k opend` checks that the stored fit
  statistics equal the library's own evaluation
  ([[code:vitaldb-resolution/vitaldb_resolution/fitcheck.py|fitcheck]]).
results: |
  [[figure:observed-vs-model]]

  - The anchor is floor (nearest is 173 BIC points worse, ceiling 312): op ends are written as the 5-minute mark at or before the true end.
  - This is the opposite of anaesthesia end, which is written up to the next mark.
  - The true op end is on average about 2.5 min after the charted one, so charted op durations run about 2.5 min short.
  - The package reproduces the stored log-likelihood within 0.14.
discussion: |
  - Related times are rounded in opposite directions, so the anchor is fitted per variable and never assumed shared.
  - The imputed op ends mark the patient's disconnection from the monitors, not the end of the operation:
    recordings end 10 minutes after the SpO2 and the ECG heart rate stop ([[reference:lee2026correspondence-nov]]).
    Excluding them is right.
  - Intervals inherit both biases: charted emergence (op end to anaesthesia end) is inflated by about 6 min (median 6.0 min, [[study:value-model-aneend]]).
limitations: |
  - The latent has two narrow peaks (13 and 17 min before the recording ends). With most values on a 5-minute grid, fine structure in a narrow latent is hard to separate from rounding, so these peaks should not be read as real.
open_questions:
  - title: "Where the imputed op ends are"
    kind: next step
    summary: >-
      Mapped on 18 October: thoracic surgery and cases under sedation or spinal anaesthesia have far more
      imputed op ends than the rest ([[observation:imputed-op-ends]]). The model already excludes them; analyses
      that use op end should check whether their subgroup is one of these.
code:
  - vitaldb-resolution/tools/fit_timestamps.py
  - vitaldb-resolution/tests/test_fit_consistency.py
  - vitaldb-resolution/vitaldb_resolution/engine.py
