id: heaping-screen-all-variables
name: Heaping screen of all variables
summary: |
  Every hand-entered clinical value and every lab analyte was screened for mixed resolution and heaping, to decide which need a rounding model and which need only a registry entry.
date: 2026-10-13
status: current
methods:
- value-resolution
background: |
  - Every clinical-table field labelled "EMR" was entered by people. Only the vital-sign tracks were recorded automatically.
  - Variables were ordered by how likely they are to be hand-entered and heaped.
data: |
  - `clinical_data.csv` (6,388 cases) and `lab_data.csv` (34 analytes, 928,448 results), plus the pre-operative copies (`preop_*`).
method: |
  - Clinical values: share of values on each anchor family against the flat expectation, plus an MWI-style index with a binomial threshold.
  - Lab analytes: finest resolution (the finest number of decimal places held by at least 1% of values) and the coarser share. Because results are stored without trailing zeros, about 10% of values should look one step coarser at a single resolution.
  - Whole-number analytes: preference at multiples of 10 and 5, per analyser, with expected counts from a local quadratic fit to the neighbouring values (skipping other multiples of 5). Ratio = observed ÷ expected; z is the Poisson z-score.
  - Command (vitaldb-resolution): `python tools/screens.py heaping-screen-all-variables --root $R --out $W/screens`, which writes `$W/screens/heaping-screen-all-variables.json` with the numbers below. The screen flags two
    whole-number analytes: SaO2 at odd multiples of 5 (ratio 2.03, z 15.5) and sodium at multiples of 10 (1.07,
    z 5.5); PT % and fibrinogen are covered in [[study:lab-computed-value-grids]]. These two are checked by
    `python tools/screens.py lab-heaping-sao2-sodium --root $R --out $W/screens`: the counts near the mode; the same
    ratio on the other four residues (values shifted by 1–4, a placebo showing what the fit alone gives); the ratio
    with the quadratic fitted to log counts, which follows a steep exponential flank; and splits by analyser and by
    clock time (08:00–18:00 against the rest). The earlier claim that a simulated smooth peaked distribution gives
    deviations of the same size had no kept simulation and is replaced by the placebo residues.
results: |
  - Heaped clinical values: urine output (91% end in 0), blood loss (85% multiples of 50), crystalloid (98% multiples of 50), colloid, height (21% whole centimetres, 10% expected) and weight.
  - Age is not heaped: 19.1% end in 0 or 5 (20% expected), and last digits are flat.
  - Red-cell and plasma units, ICU days and length of stay show no heaping.
  - Lab analytes with decimals sit near the 10% coarser share. Exceptions: haematocrit (32.4%, two analysers), total bilirubin (6.5%), lactate (12.5%) and bicarbonate (7.9%).
  - No whole-number analyte shows a clear preference for multiples of 5 or 10 once the shape of the distribution is
    allowed for; SaO2 and sodium, flagged by the quadratic fit, are checked separately.
  - **SaO2 is not heaped at 95.** Its counts rise steeply towards the 100% ceiling (93: 189, 94: 279, 95: 393,
    96: 638, 97: 868), and a quadratic over that flank overshoots: on the other residues the same fit gives ratios
    from 0.43 to 1.58. Fitted to log counts the ratio is 1.03 (z 0.7), with 393 results at 95 against 381 expected.
    All SaO2 results come from the theatre blood-gas analyser.
  - **Sodium shows at most a small excess at 140,** at the mode: 5,408 results against 5,198 expected (+4%) with the
    log fit, a ratio of 1.04 (z 3.2) that lies within the 0.98–1.07 the fit gives on the other residues. The excess
    is in the central laboratory (1.05; 40,787 results), not the blood-gas analyser (0.96; 14,594), and in daytime
    results (1.07 from 08:00 to 18:00, 1.00 otherwise). Rounding to 140 by hand is possible but not shown.
  - Total bilirubin's low range (0.2–1.0 mg/dL, 23,802 results) shows no heaping: from 0.6 mg/dL up each count is
    within 5% of the mean of its neighbours, and below that the counts follow the rise of the distribution (0.3 and
    0.4 sit 8% and 16% above their neighbours' mean, 0.2 below it), not a preference for any value. Its lower coarser share comes from the shape of the
    distribution.
  - Lactate is measured on the blood-gas analysers only (14,512 of 14,516 results share a timestamp with a pH),
    so there is no second instrument to compare, and era cannot be tested. No value below 15 is heaped. Its excess
    is a reporting limit: 317 results (28 cases) are exactly 15.0 mmol/L, against at most 16 for any other value
    near the top ([[observation:lab-reporting-limits]]).
  - Two more analytes have reporting limits: aPTT at 400.0 s (226 results, 87 cases) and ESR at 2 mm/h (89
    results, 72 cases).
  - Since vitaldb-resolution v0.6.0 (18 October; model version 2): lactate at 15.0 and aPTT at 400.0 (and pre-
    operative aPTT) are `top_coded`, ESR at 2 `bottom_coded`, and `p` is described as probably phosphorus
    (unconfirmed).
discussion: |
  - Apart from computed values, every lab analyte is single resolution per source and needs a registry entry, not a rounding model.
  - Pre-operative copies behave like the lab data: platelets, glucose, AST, ALT and BUN show no heaping; pre-op PT % and sodium show the same artefacts. Pre-op PaO2 is the exception.
limitations: |
  - ESR, ammonia and creatinine clearance have too few results to judge (537–1,415).
open_questions:
  - title: "Analyte p as phosphorus"
    kind: hypothesis
    summary: >-
      The analyte coded `p` (16,440 results) is missing from `lab_parameters.csv`. Its median of 3.2 (IQR 2.7–3.8,
      p5–p95 1.9–5.0) fits phosphorus in mg/dL, the only common analyte with that range, but only the VitalDB team
      can confirm it.
tags:
- from the resolution work
code:
  - vitaldb-resolution/tools/screens.py
