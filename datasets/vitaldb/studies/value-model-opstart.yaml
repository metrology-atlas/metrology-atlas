id: value-model-opstart
background: |
  - Op start is a charted event time with a 1-minute chronon.
  - Op start, op end and anaesthesia end share a 5-minute grid. Op start falls on a 5-minute clock mark in 92% of cases.
data: |
  - 6,387 op starts.
  - One op start does not share the sub-minute offset of the other charted times in its case and is flagged `clock_offset_mismatch`.
method: |
  - The same approach as the anaesthesia times: the true op start is placed a log-spline offset after the recording start (K = 10).
  - First cases get a clock-time prior, as for anaesthesia start.
  - Nearest, floor and ceiling anchors were compared. 30- and 60-minute modes and effects of time of day and emergency status were tested.
results: |
  [[figure:observed-vs-model]]

  - There is no 30- or 60-minute rounding, and no effect of time of day or emergency status.
  - The anchor is nearest (floor is 14 BIC points worse, ceiling 101).
  - First-case incisions cluster at 08:20–08:50; the clock-time prior is 1,120 BIC points better.
  - Unlike anaesthesia start, there is no scheduled or nominal op start time.
  - Op start is well centred: a rounded value is uncertain by ±2.5 min.
  - Since vitaldb-resolution v0.6.0 (18 October; model version 2): the log-likelihood gap is explained. The old
    fitter worked out the time-of-day prior on its own 0.1-minute grid; refitted with the library's likelihood the
    model gains 33.2 in log-likelihood and the posteriors move by less than 0.03 minutes.
discussion: |
  - Through the package, the log-likelihood differs from the stored one by −10.6. The difference is not yet explained. The working explanation is that the fitter integrates the first-case clock prior on its own 0.1-min grid, about 0.007 per first-case record.
limitations: |
  - The package and stored log-likelihoods differ by 10.6 points, and the cause is not confirmed.
