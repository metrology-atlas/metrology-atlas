  caption: 'Blood-gas analyser minus central laboratory against the mean of the two, for sodium, potassium, glucose and
    haematocrit, pairing each blood gas with the central panel stamped within 15 minutes after it. Orange: mean difference
    and 95% limits of agreement (the limits are widened by a few pairs that are clearly different draws).'
