id: primus-awp-anchoring
name: How the Primus AWP is stamped, and which breath the lag locks onto
summary: >-
  The Primus airway-pressure stamps are an anchor plus a sample count; the anchor holds across the regular pauses
  and is reset, with an error of up to about ±2 s, at irregular gaps. Separately, about a quarter to a third of the
  stretches in the release-wide breath matching are measured a whole breath off, which inflated the apparent
  per-recording offset.
date: 2026-11-01
status: draft
methods: [stamp-reading, shared-events]
techniques: [windowed-cross-correlation, null-controls]
clocks: [primus-clock, snuadc-sample]
devices: [primus, snuadc]
variables: [primus-awp, primus-co2]
data: |
  The record times of Primus/AWP and Primus/CO2 in all 6,388 recordings (6,360 with AWP), and every Primus track's
  first record. The per-window AWP-to-reference lags of [[study:ventilator-breath-matching]]'s release-wide run
  (tools/primus_sync_accuracy.py, 19 October; CVP arm in 1,069 recordings, ART arm alone in 948), and the
  ventilator's set and measured breath rates (Primus/SET_RR_IPPV, Primus/RR_CO2) in the 2,022 recordings with a lag.
background: |
  Breath matching gave the Primus a per-recording offset against the SNUADC with a wide spread (a median of about
  1.8 s, 5th–95th percentile −0.7 to +5.8 s) that no recording property explained. Two things could produce it: how
  the recorder stamps the Primus waveform, or the lag measurement itself. Ventilation is regular, so the lag between
  a breath in the airway pressure and its effect on CVP or ART is only defined to within a breath unless something
  else picks the breath; the release-wide run finds each window's lag within half a breath of a coarse envelope
  estimate and starts each window from the previous one, without the breath-identity check of the pilot.
method: |
  - **Record times.** For AWP and CO2: the share of consecutive records exactly one record (30 samples, 0.48 s) apart,
    and each gap (stamp step over 5 s) in record lengths.
  - **Stretches.** Per recording (CVP arm, else ART), a line of lag against time in each stretch between AWP pauses:
    its offset at the stretch start, slope and residual; the step at each pause.
  - **Breath periods.** Each stretch's breath period T from the set rate (else the measured rate); offsets and steps
    in breath periods; offsets stratified by set rate (strata by rate, not by offset / T, which would bias the
    comparison; a regression within bands of offset / T was tried and dropped for that reason).
  - **Two references.** In recordings with both arms, ART minus CVP per stretch, in breath periods.
  - **Gap kind.** Each pause step matched to its AWP gap: a whole number of records (the 0.48 s grid carries on) or
    not (a new anchor).
  - **Breath identity from the signals (test on two recordings).** tools/primus_breath_id.py repeats the
    release-wide lag and keeps, per window, the shape correlation's peaks over −3 to +8 s, and per 30-minute block
    the pilot's breath-size check ([[study:ventilator-breath-matching]], breath i against breath i + k). Run on
    one recording in the main mode and one placed a breath above it, before any release-wide run
    (work/primus_breath_id/test/).
  - **Breath identity from pauses in ventilation (test on four recordings).** tools/primus_vent_events.py finds
    runs of no breaths while the AWP stream continues (and the start and end of ventilation), and times the stop
    and restart in both signals: the envelopes of the airway pressure and of the reference's breathing band
    (0.1–0.7 Hz, the reference low-passed over 2 s) are cross-correlated within ±150 s of each edge over lags −3 to
    +12 s. An edge resolves the breath when its peak correlation is at least 0.5 and 0.15 above the correlation one
    breath either side. Its lag is compared with the matched lag of the nearest window in the same stretch (within
    10 minutes): k = (matched − event) / T (work/primus_vent_events/test/).
results: |
  - **The AWP stamps are an anchor plus a sample count.** In 6,312 of 6,360 recordings every record is exactly
    0.48 s after the one before; none is stamped on arrival. AWP and CO2 are anchored separately: their gaps coincide
    in only 778 recordings.
  - **The anchor holds across the regular pauses and resets at irregular gaps.** Of 13,988 AWP gaps, 74% are a
    whole number of records. Pause steps at those (2,785, gaps of about 20–23 s): median +0.01 s (IQR −0.13 to
    +0.15). At gaps that are not (724, gaps of 5–38 s): median −0.33 s (IQR −1.33 to +0.78), 86% over 0.25 s.
  - **About a quarter to a third of stretches are measured a whole breath off.** Stratified by set rate, offsets
    have a main mode at 0.5–1.0 s at every rate and a second mode one breath period above it (18/min: 3.5–4.5 s;
    16/min: 4.0–5.0; 14/min: 4.5–5.5; 12/min: 5.0–6.5; 10/min: weak, 6.0–7.5), with a small third. In 1,127
    stretches of 459 recordings with both references, ART minus CVP is within a quarter breath in 63% (median
    +0.26 s) and about one whole breath in 34%, its side modes moving with the set rate; within a stretch the two
    agree to 0.09 s (SD). Pause steps are rarely whole breaths (under 2% of either gap kind).
  - **Matching breaths cannot tell which breath is right (null result, two recordings).** The shape correlation is
    nearly equal one breath apart (0.971 against 0.970), and the breath-size check is weak (correlations 0.02–0.40),
    changes between blocks (k = 0, 1, 0) and disagrees between the two references (CVP mostly k = 0, ART k = 2).
    In the recording placed a breath above the main mode, CVP (5.2–5.8 s) and ART (5.7–6.2 s) agree at about
    5.5 s, so not every offset a breath above the main mode is a slip: some may be real.
  - **A clear pause in ventilation does fix the breath (test, four recordings).** 20 of 160 event edges resolved,
    in all four recordings. In three recordings the CVP events give 0.7–1.0 s (and 2.4 s later in one), r 0.7–0.9,
    matching the matched lag (k about 0); in one, the ART events give 1.5 s against a matched 5.3 s, a breath off.
    In the recording with both references at about 5.5 s, the strongest events come in a regular series and do not
    resolve the breath; the one that does gives 0.8–0.9 s against a matched 5.7 s, so there both references were
    a breath off, probably because both start from the same coarse estimate. Many events are uninformative
    (correlation under 0.5, or the peak at the edge of the range).
  - **Release-wide, pauses in ventilation say most +1-breath offsets are slips (2 November, preliminary).** 26,022
    events in 3,470 recordings; 5,166 edges in 943 recordings resolve the breath (work/primus_vent_events/
    summary.json). With CVP (2,318 resolved edges) the event lag is a median 1.7 s (p10–p90 0.6–3.9 s) and, in
    breath periods, falls away steadily from 0–0.5 breaths with no second mode one breath up, where the matched
    offsets have one. Where a matched window is within 10 minutes, the matched lag agrees with the event (k within
    a quarter of 0) for about 70% of CVP edges and is about one breath late for about 20%. The ART events sit later
    than the matched ART lag by a third to half a breath, so the arterial breathing modulation answers a pause
    later than its breath-by-breath shape does: ART pauses are not used as a reference.
  - **The pause method has no bias against CVP (bias check, 2 November).** Where a CVP event and the matching agree
    on the breath (1,350 edges, k within a quarter of 0), event minus matched lag is a median 0.000 s (IQR −0.11 to
    +0.14 s; p10–p90 −0.24 to +0.33 s), the same at stops and restarts, at weaker and stronger correlations, and
    with the matched window within 2 minutes. Its spread, about 0.2 s, is far inside half a breath, so a resolved
    CVP pause fixes the breath. For ART the same comparison gives +0.16 s (IQR −0.03 to +0.35 s, 587 edges).
    The selection (k within a quarter breath) limits the differences to about ±1 s, so this tests bias, not the
    tails.
  - **A rule for every stretch, checked by leaving stretches out (2 November).** tools/primus_breath_rule.py
    (work/primus_breath_rule/) gives each stretch a whole number of breaths k to take off its matched lag:
    (1) from its own resolved CVP pauses; (2) carried from a neighbour across a gap that keeps the 0.48 s grid,
    so that the corrected offset is continuous; (3) otherwise the k that puts its corrected start nearest the main
    mode, 1.28 s (the median over stretches fixed by their own CVP pauses); (4) recordings with ART only, the same
    with ART pauses corrected by their +0.16 s. Of 3,121 CVP stretches, 498 are set by their own pauses, 393 by
    carrying and 2,230 by the main mode (ART-only: 185, 141 and 2,079 of 2,405). Leaving out each of the 498
    stretches with its own pauses: trusting the matching (k = 0) is right for 72%; carrying, where it reaches
    (116), is right for 81%; the main mode (382) for 86%. The rule changes k in 28% of CVP stretches and 44% of
    ART-only ones. The corrected start offsets of the stretches fixed by their own pauses are a median 1.28 s,
    IQR 0.67–2.08 s, 5th–95th percentile 0.06–4.54 s: wide, so the main mode cannot be right for all, and about
    one stretch in seven that relies on it is still a breath off.
  - **The Primus numbers with each stretch on its right breath (2 November).** tools/primus_numbers.py (which
    reproduces the earlier numbers exactly with no breath correction): the AWP bias against the breath on CVP is a
    median [[value:primus-awp-bias]] per recording (5th–95th percentile −3.552 to −0.443 s, was −1.787 s, −5.782 to
    +0.693 s), and its spread between recordings [[value:primus-awp-between-rsd]] (was 1.325 s). Within a stretch on
    its right breath the matching is as before (robust SD 79 ms). After the rule, [[value:primus-breath-error-share]]
    of windows sit in a stretch still a whole breath off; as a mixture its standard deviation is
    [[value:primus-breath-error-sd]], and the 95% interval of the matching error with it −4.41 to +4.40 s. The
    timing forms of primus-awp and primus-co2 carry these, the breath error as its own component.
discussion: |
  The wide per-recording offset is mostly the measurement's: a stretch that starts on the wrong breath stays on it,
  and its windows agree with each other, so leave-one-out within a stretch cannot see it. The breath-matching
  uncertainty quoted for the Primus (about 55 ms) therefore holds only for stretches on the right breath, and the
  spread behind the shift known in advance is inflated by the slipped ones. What is left of the offset is the
  anchor: set when the AWP stream starts or restarts after an irregular gap, kept across the regular pauses. Its
  true size and spread can only be stated once each stretch's breath is fixed.
limitations: |
  Draft. The breath periods come from the ventilator's settings, sampled every fourth record. The two-reference test
  needs both arms and covers 459 recordings. Physiology between the airway pressure and CVP or ART is not separated
  from the stamp offset here.
open_questions:
  - title: "Which breath is right"
    kind: next step
    summary: >-
      Fix the breath of each stretch. Matching breaths cannot do it: on test recordings the shape correlation is
      nearly equal one breath apart, and the breath-size check (tools/vent_sync_pilot.py breath_match) is weak and
      inconsistent. Some offsets one breath above the main mode may also be real (both references agree in at
      least one recording), so a rule such as "nearest the main mode" is not safe. Next: lags from events that are
      not periodic: tools/primus_vent_events.py, run release-wide; no bias against CVP; a rule
      (tools/primus_breath_rule.py) right for about 86% of stretches without their own pauses. Next: decide how the
      remaining breath errors enter the Primus forms (a probability of a one-breath error per stretch, by the step
      that set it), and redo the Primus numbers.
  - title: "What sets the anchor"
    kind: next step
    summary: >-
      Compare each new AWP anchor, and the recording's first, with the Primus numerics stamped on arrival around it
      (every ~7 s), to see whether the anchor error is the arrival latency of the first block.
code:
  - vitaldb-bench/tools/primus_awp_anchor.py
  - vitaldb-bench/tools/primus_sync_accuracy.py
  - vitaldb-bench/tools/primus_breath_id.py
  - vitaldb-bench/tools/primus_vent_events.py
  - vitaldb-bench/tools/primus_breath_rule.py
  - vitaldb-bench/examples/ppv_by_breath.py
typed_ok:
  - {parameter: primus-awp-between-rsd, text: "0.7", why: "the breathing band's edge (0.7 Hz) and lags and correlations of 0.7 in the four-recording test, not the spread between recordings"}
  - {parameter: primus-breath-error-sd, text: "1.5", why: "an ART event lag in the four-recording test, not the breath-error SD"}
