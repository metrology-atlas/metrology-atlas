id: ppg-sawtooth-period
name: The PPG sawtooth's period, its phase jumps, and the reversed sawtooth
summary: >-
  Second of the sawtooth series ([[study:ppg-sawtooth-slips]] finds the slips). Within a recording the slips fall on
  a grid of one tooth length, piecewise: the grid holds for long runs and then jumps. Without a break in the
  signal, the jumps move the phase by a whole number of quarter teeth (23 of 31, against 7 by chance), which
  suggests the slips are made in units of a quarter frame, 1/120 s; the quarter-frame step itself has not been
  seen. Within a run the grid is not exact: slips scatter by about 2 s around it, mostly anchored to it. One
  setup runs the sawtooth backwards. Cuff inflations do not explain the jumps. Benchmark of 273 recordings; in
  development.
date: 2026-11-02
status: draft
methods: [signal-borne-clocks]
techniques: [phase-step-detection, null-controls]
clocks: [oximeter-frame-clock, snuadc-sample]
devices: [solar8000, snuadc]
variables: [snuadc-pleth, snuadc-ecg-ii, snuadc-art]
data: |
  The slips found in [[study:ppg-sawtooth-slips]]'s benchmark (273 recordings, 373 hours; upward and downward
  one-frame steps), the recording setup (PC key) of each from [[study:setup-identification]], the SNUADC correction
  mode from the correction census (step mode where its rate is below −20 ppm), and the frame clock rate.
background: |
  The current fit ([[study:ppg-sawtooth]]) gives every tooth its own length. If the sawtooth comes from two clocks
  running at a slightly different rate (the PPG content against the 30 Hz output frames), the slips should fall
  on a grid of one tooth length, and slip times could be pinned far more closely by fitting the grid than by
  placing each slip alone. How the grid behaves, where it breaks and what the breaks look like also says how the
  monitor makes the slips.
method: |
  Same tool and run as [[study:ppg-sawtooth-slips]] (vitaldb-bench tools/sawtooth_char.py, SHA-256 46110308f725… (bench8 was made with an earlier state of it whose slips stage is the same);
  `slips` then `agg` into `$W/sawtooth_char/bench8`: summary.json and recordings.csv), then the mechanism tests on
  that run: `mech --scan $W/sawtooth_char/scan --slips $W/sawtooth_char/bench8/slips.jsonl --recordings
  $W/sawtooth_char/bench8/recordings.csv --root $R --out $W/sawtooth_char/mech3/mech_partK.jsonl --part K --of 3`
  (K = 0, 1, 2), concatenated, and `mech-agg --mech $W/sawtooth_char/mech3/mech.jsonl --recordings
  $W/sawtooth_char/bench8/recordings.csv --clocks $W/clock_network/r4/clocks.csv --out $W/sawtooth_char/mech3`
  (mech_summary.json, clocks_by_recording.csv).

  - **Tooth length.** The length that best explains the gaps between consecutive slips (each gap a whole number of
    teeth within 3%; a fraction of the true tooth, which fits every gap too, is penalised for the slips it implies
    but nobody found).
  - **Runs and phase jumps.** Slips form runs on one grid (each within 3% of a tooth of a whole number of teeth from
    the run's last slip; a slip may rejoin an earlier run, so one spurious slip does not break a grid). One tooth
    length for all runs, each with its own phase. A change from one multi-slip run to another is a phase jump; its
    shift is the fractional number of teeth between them. A slip in a run of its own is off grid.
  - **Interruptions.** For each jump, the longest gap between matched beats between the two runs; more than 10 s
    counts as an interruption of the signal.
  - **Quantisation of the shifts.** The number of shifts within ±0.03 of a whole number of quarter teeth, against
    the 24% expected if shifts were uniform (binomial test), and likewise for odd eighths.
  - **Direction and setup.** A recording's sawtooth runs up (or down) when it has at least 3 one-frame steps that
    way and twice as many as the other way; its signed rate is ±frame ÷ tooth. Summarised by setup and mode.
  - **Sub-frame steps.** Sharp, persistent steps of 0.12–0.88 frame, 60 s clear of any one-frame step; with a clean
    arterial line, in the PPG chain (ART→PPG steps the same, ECG→ART does not) or before it. Whether their sizes
    lock to quarter frames, and whether a step of the jump's shift lies between the two runs of each phase jump.
  - **Cuff inflations.** Each event within 45 s before to 5 s after a new NIBP reading (where the Solar8000
    systolic or diastolic value changes; the tracks repeat the last reading every 2 s), against the share of the
    recording's time that is; and the phase jumps with a reading between their runs, against the reading rate.
  - **Within a run** (4 or more slips): whether one constant tooth passes through every 95% bracket, the
    least-squares scatter of the slips about the best grid against the brackets' own spread, and the correlation of
    consecutive tooth-length deviations: about −0.5 if the slips sit on a fixed grid and are placed with
    independent errors, about 0 if each tooth varies on its own (the phase then wanders).
  - **Clocks.** For setups seen in both SNUADC correction modes: the frame clock against the SNUADC, the sawtooth
    rate, and the SNUADC against the PC (clock network, run r4) in each mode; and the spread across setups of the
    frame clock, the sawtooth rate and their sum and difference.
results: |
  - **On injected ground truth** the tooth length is recovered to a median of 0.05 s on teeth of 10–37 minutes
    (held-out fiducial-shift sawtooths; 95th percentile 1.4 s; the feasible range holds the truth in 21 of 28).
  - **Grids are piecewise.** 125 of 898 upward slips (14%) are off grid. 41 phase jumps in 28 recordings, 10 of
    them across an interruption of the signal.
  - **Phase jumps come in quarter teeth.** Of the 31 jumps without an interruption, 23 shift the phase by a whole
    number of quarter teeth (0.25, 0.5 or 0.75, within ±0.03), against 7.4 expected (p = 5 × 10⁻⁹); none lies on an
    odd eighth (7.4 expected). Across the 10 interruptions the shifts are not locked (4, against 2.4). A shift of a
    quarter tooth is a step of a quarter frame in the delay: 8.3 ms, or 1/120 s.
  - **Jumps follow disturbances.** In the recordings looked at ([[case:4572]], [[case:3117]]), the grid holds through
    long stretches and moves after a large excursion of the delay.
  - **The quarter-frame step is not seen on its own.** 665 sharp sub-frame steps fall off smoothly in size from the
    smallest; among the 68 the arterial line places in the PPG chain, 20 lie on a quarter frame against 16.1 by
    chance (p = 0.17). 13 of the 41 jumps have a sub-frame step between their runs, 7 of the jump's size. Either the
    step is hidden in the excursion, or the phase moves without a step in the delay.
  - **Cuff inflations do not explain them.** 12 of 38 jumps' largest steps lie in a cuff inflation against 8.9
    expected, and 27 jumps have a reading between their runs against 28.0 expected; sub-frame steps (142 against
    132) and slips (195 against 177) are hardly more frequent there (238 recordings with NIBP).
  - **Within a run the grid is not exact.** In 66 runs of 4 or more slips (374 slips), no constant tooth passes
    through every 95% bracket. The slips scatter about the best grid by a median of 2.0 s (interquartile range
    1.2–3.9 s), ten times the brackets' own spread (0.20 s). Consecutive tooth-length deviations correlate at
    −0.35 (95% interval −0.51 to −0.13; 207 pairs): mostly a fixed grid with jitter, with some wander.
  - **One setup runs backwards.** 9 recordings have a downward sawtooth (145 upward, 119 too few slips to say). Five
    of the eight with a measurable rate are on one setup (PC key COM12 · COM4 · COM5 · COM7), in both SNUADC modes,
    at −43.6 to −45.4 ppm except one at −86; the setup has 7 recordings in the benchmark and none with an upward sawtooth.
    The clearest are [[case:2537]], [[case:4488]] and [[case:6049]] (teeth of 735–740 s), with the frame clock at
    +60 ppm against the SNUADC; upward setups at +45 ppm have frame clocks near +72 ppm. The current fit labels every
    one N or U. One more at −45 ppm is on another setup ([[case:6142]]).
  - **Rate and setup.** The reversed setup has the same rate in both SNUADC modes (−45.2 ppm), as do 4 of 12 other
    setups seen in both (within 1 ppm); others differ by up to 26 ppm, so a PC key does not always mean one
    oximeter (one port hosts two PPG sources; [[study:ppg-sawtooth]]). No combination of frame clock and sawtooth
    rate is common to all setups (standard deviation 24–40 ppm across 32).

  [[figure:quarter-jump]]

  [[figure:reversed]]
discussion: |
  A grid that holds for an hour and moves only in quarter frames fits a slip mechanism that counts in 1/120 s
  units, four to a frame; the PLETH's spectral lines at 30, 60, 90 and 120 Hz ([[study:ppg-frame-clock]]) point the
  same way. After a break in the signal the phase starts afresh. Within a run, the 2 s scatter is real (ten times
  the placement error) but small: for correction it means each slip should be placed where it is seen, with the grid
  used to find it, not to place it. The negative correlation of consecutive teeth says the slips are pulled back
  toward the grid, as a threshold on an accumulated phase would do; the shortfall from −0.5 allows a slow wander of
  the rate on top. A reversed sawtooth on one setup in both SNUADC modes is a property of that setup's oximeter
  chain, not of the recorder: there the PPG content runs faster than the frames. For correction, a phase jump of a
  quarter tooth gives the current fit a tooth of odd length, and so a wrong rate and an error of up to 8 ms over
  that tooth; and the reversed sawtooth is not corrected at all.
limitations: |
  Development version, thresholds set while looking at these recordings. The numbers are
  few (41 jumps, 9 reversed recordings); the full release will test both. The quarter-frame step at a jump has not been isolated in the delay.
open_questions:
  - title: "Where is the quarter-frame step?"
    kind: phenomenon
    summary: >-
      The phase moves by quarter teeth, but a quarter-frame step in the delay is not seen apart from the
      excursions it follows. Whether the phase can move without a step, or the step is always masked, is open.
  - title: "Jitter or wander within a run?"
    kind: next step
    summary: >-
      Separate the slips' 2 s scatter into jitter about a fixed grid and a slowly changing rate (fits of a
      quadratic grid per run, and the scatter against run length) on the full release.
  - title: "Why one setup runs backwards"
    kind: phenomenon
    summary: >-
      Setup COM12 · COM4 · COM5 · COM7 loses a frame every 12 minutes in every recording with a sawtooth. The full
      release will show whether every recording of that setup does, and whether its rate stays at −45 ppm.
  - title: "Scale up"
    kind: next step
    summary: >-
      Run on every recording with ECG lead II and PLETH (WSL, 8 parts) once the detector's recall is settled.
figures:
