id: ppg-sawtooth-period
name: The PPG sawtooth's period, its phase jumps, and the reversed sawtooth
summary: >-
  Second of the sawtooth series ([[study:ppg-sawtooth-slips]] finds the slips). Within a recording the slips fall on
  a grid of one tooth length, piecewise: the grid holds for long runs and then jumps. On all 5,714 recordings the
  jumps move the phase by a whole number of quarter teeth far more often than by chance (375 of 548 without a break
  in the signal, against 132; 79 of 146 across one, against 35), and sharp steps of a fraction of a frame in the
  PPG chain lock to quarter frames too: the slips appear to be made in units of a quarter frame, 1/120 s. Within a
  run the grid is not exact: slips scatter by about 2 s around it, mostly anchored to it. Two setups run the
  sawtooth backwards. Cuff inflations do not explain the jumps. In development.
date: 2026-11-03
status: draft
methods: [signal-borne-clocks]
techniques: [phase-step-detection, null-controls]
clocks: [oximeter-frame-clock, snuadc-sample]
devices: [solar8000, snuadc]
variables: [snuadc-pleth, snuadc-ecg-ii, snuadc-art]
data: |
  The slips found in [[study:ppg-sawtooth-slips]] (upward and downward one-frame steps): on the full release, 5,714
  recordings and 7,789 hours; on the benchmark on which the methods were built, 273 recordings and 373 hours. The
  recording setup (PC key) of each from [[study:setup-identification]], the SNUADC correction mode from the
  correction census (step mode where its rate is below −20 ppm), the frame clock rate, and the Solar8000 NIBP
  readings.
background: |
  The current fit ([[study:ppg-sawtooth]]) gives every tooth its own length. If the sawtooth comes from two clocks
  running at a slightly different rate (the PPG content against the 30 Hz output frames), the slips should fall
  on a grid of one tooth length, and slip times could be pinned far more closely by fitting the grid than by
  placing each slip alone. How the grid behaves, where it breaks and what the breaks look like also says how the
  monitor makes the slips.
method: |
  Same tool and runs as [[study:ppg-sawtooth-slips]] (vitaldb-bench tools/sawtooth_char.py; `slips` then `agg` into
  `$W/sawtooth_char/full`, summary.json and recordings.csv), then the mechanism tests on that run (WSL, 8 parts,
  K = 0–7): `mech --scan $W/sawtooth_char/scan_full --slips $W/sawtooth_char/full/slips.jsonl --recordings
  $W/sawtooth_char/full/recordings.csv --root $R --out $W/sawtooth_char/full_mech/mech_partK.jsonl --part K --of 8`
  and `mech-agg --mech $W/sawtooth_char/full_mech/mech_part*.jsonl --recordings $W/sawtooth_char/full/recordings.csv
  --clocks $W/clock_network/r4/clocks.csv --out $W/sawtooth_char/full_mech/agg` (mech_summary.json,
  clocks_by_recording.csv; tool SHA-256 8f5734d273f5…, which reads the parts and keeps one copy of a recording run
  twice). The benchmark's run is `$W/sawtooth_char/bench8` and `$W/sawtooth_char/mech3` (3 parts).

  - **Tooth length.** The length that best explains the gaps between consecutive slips (each gap a whole number of
    teeth within 3%; a fraction of the true tooth, which fits every gap too, is penalised for the slips it implies
    but nobody found).
  - **Runs and phase jumps.** Slips form runs on one grid (each within 3% of a tooth of a whole number of teeth from
    the run's last slip; a slip may rejoin an earlier run, so one spurious slip does not break a grid). One tooth
    length for all runs, each with its own phase. A change from one multi-slip run to another is a phase jump; its
    shift is the fractional number of teeth between them. A slip in a run of its own is off grid.
  - **Interruptions.** For each jump, the longest gap between matched beats between the two runs; more than 10 s
    counts as an interruption of the signal.
  - **Quantisation of the shifts.** The number of shifts within ±0.03 of a whole number of quarter teeth, against
    the 24% expected if shifts were uniform (binomial test), and likewise for odd eighths.
  - **Direction and setup.** A recording's sawtooth runs up (or down) when it has at least 3 one-frame steps that
    way and twice as many as the other way; its signed rate is ±frame ÷ tooth. Summarised by setup and mode.
  - **Sub-frame steps.** Sharp, persistent steps of 0.12–0.88 frame, 60 s clear of any one-frame step; with a clean
    arterial line, in the PPG chain (ART→PPG steps the same, ECG→ART does not) or before it. Whether their sizes
    lock to quarter frames, and whether a step of the jump's shift lies between the two runs of each phase jump.
  - **Cuff inflations.** Each event within 45 s before to 5 s after a new NIBP reading (where the Solar8000
    systolic or diastolic value changes; the tracks repeat the last reading every 2 s), against the share of the
    recording's time that is; and the phase jumps with a reading between their runs, against the reading rate.
  - **Within a run** (4 or more slips): whether one constant tooth passes through every 95% bracket, the
    least-squares scatter of the slips about the best grid against the brackets' own spread, and the correlation of
    consecutive tooth-length deviations: about −0.5 if the slips sit on a fixed grid and are placed with
    independent errors, about 0 if each tooth varies on its own (the phase then wanders).
  - **Clocks.** For setups seen in both SNUADC correction modes: the frame clock against the SNUADC, the sawtooth
    rate, and the SNUADC against the PC (clock network, run r4) in each mode; and the spread across setups of the
    frame clock, the sawtooth rate and their sum and difference.
results: |
  Full release first; the benchmark's figures in brackets.

  - **On injected ground truth** the tooth length is recovered to a median of 0.05 s (held-out fiducial-shift
    sawtooths; 95th percentile 0.69 s; the feasible range holds the truth in 343 of 464) [0.05 s; 1.4 s; 21 of 28].
  - **Grids are piecewise.** 2,427 of 17,373 upward slips (14%) are off grid [125 of 898]. 694 phase jumps in 477
    recordings, 146 of them across an interruption of the signal [41 in 28; 10].
  - **Phase jumps come in quarter teeth.** Of the 548 jumps without an interruption, 375 shift the phase by a whole
    number of quarter teeth (0.25, 0.5 or 0.75, within ±0.03), against 131.5 expected (p = 10⁻¹⁰⁶); 35 lie on an
    odd eighth against 131.5 [23 of 31 against 7.4; none on an odd eighth]. Across the 146 interruptions the shifts
    are locked as well, less tightly: 79 against 35.0 (p = 5 × 10⁻¹⁵). The benchmark, with 10 such jumps, could not
    show this (4 against 2.4). A shift of a quarter tooth is a step of a quarter frame in the delay: 8.3 ms, or
    1/120 s.
  - **Jumps follow disturbances.** In the recordings looked at ([[case:4572]], [[case:3117]]), the grid holds through
    long stretches and moves after a large excursion of the delay.
  - **Sub-frame steps lock to quarter frames.** 14,009 sharp sub-frame steps (1.8 an hour) fall off smoothly in size
    from the smallest; 3,957 lie on a quarter frame against 3,317.9 by chance (p = 8 × 10⁻³⁶), and among the 1,660
    the arterial line places in the PPG chain, 496 against 393.2 (p = 4 × 10⁻⁹) [68 in the PPG chain, 20 against
    16.1, p = 0.17]. Steps before the PPG chain barely do (269 of 1,027 against 243.2, p = 0.03). 248 of the 694 jumps
    have a sub-frame step between their runs, 95 of the jump's size [13 of 41; 7]. The quarter-frame step is seen in
    the delay, but at most jumps it is not seen on its own.
  - **Cuff inflations do not explain them.** 130 of 645 jumps' largest steps lie in a cuff inflation against 143.6
    expected, and 444 jumps have a reading between their runs against 494.8 expected [12 of 38 against 8.9; 27
    against 28.0]. Sub-frame steps (2,862 against 2,673.5) and slips (3,588 against 3,324.5) are 7–8% more frequent
    there (5,072 recordings with NIBP) [142 against 132; 195 against 177].
  - **Within a run the grid is not exact.** In 1,188 runs of 4 or more slips (6,822 slips), one constant tooth passes
    through every 95% bracket in 24 [none of 66]. The slips scatter about the best grid by a median of 1.9 s
    (interquartile range 1.1–3.3 s), ten times the brackets' own spread (0.20 s). Consecutive tooth-length deviations
    correlate at −0.24 (95% interval −0.30 to −0.19; 3,953 pairs) [−0.35; 207 pairs]: a fixed grid with jitter and
    a slow wander.
  - **Two setups run backwards.** 203 recordings have a downward sawtooth (2,701 upward, 2,810 too few slips to say)
    [9; 145; 119]. 133 are on setup COM12 · COM4 · COM5 · COM7, whose 168 recordings have no upward sawtooth (35 too
    few slips), and 40 on COM15 · COM13 · COM14 · COM22 (46 recordings), both at a median of −45.2 and −45.5 ppm; 19
    more are on COM3 · COM4 · COM5 · COM7, which also has 126 upward. The reversed setup's frame clock runs at
    +59 ppm against the SNUADC; upward setups at +45 ppm have frame clocks near +72 ppm. The clearest are
    [[case:2537]], [[case:4488]] and [[case:6049]] (teeth of 735–740 s). The current fit labels these N or U.
  - **Rate and setup.** The reversed setup has the same rate in both SNUADC modes (−45.1 and −45.4 ppm). Of 37 named
    setups seen in both modes, 26 have rates within 1 ppm of each other; the differences over 5 ppm are all on
    setups with three recordings or fewer in one mode, and the rest are 1.3–4.6 ppm. The 26 ppm difference the
    benchmark showed on COM4 · COM12 · COM11 · COM14 is 0.9 ppm on 323 recordings. One port still hosts two PPG sources ([[study:ppg-sawtooth]]). No combination of
    frame clock and sawtooth rate is common to all setups (standard deviation 24–39 ppm across 75).

  [[figure:quarter-jump]]

  [[figure:reversed]]
discussion: |
  A grid that holds for an hour and moves in quarter frames, and sub-frame steps in the PPG chain that lock to the
  same quarters, fit a slip mechanism that counts in 1/120 s units, four to a frame; the PLETH's spectral lines at 30,
  60, 90 and 120 Hz ([[study:ppg-frame-clock]]) point the same way. After a break in the signal the phase moves by
  quarters too, more loosely, so a break does not reset the mechanism to an arbitrary phase. Within a run, the 2 s
  scatter is real (ten times the placement error) but small: for correction it means each slip should be placed
  where it is seen, with the grid used to find it, not to place it. The negative correlation of consecutive teeth
  says the slips are pulled back toward the grid, as a threshold on an accumulated phase would do; the shortfall
  from −0.5 allows a slow wander of the rate on top. A reversed sawtooth on whole setups, in both SNUADC modes, is a
  property of those setups' oximeter chains, not of the recorder: there the PPG content runs faster than the frames.
  For correction, a phase jump of a quarter tooth gives the current fit a tooth of odd length, and so a wrong rate and
  an error of up to 8 ms over that tooth; and the reversed sawtooth is not corrected at all.
limitations: |
  Development version: methods and thresholds were set while looking at the 273 benchmark recordings, which are part
  of the full release. The quantisation tests count shifts within ±0.03 of a quarter; a jump's shift is measured
  from two grids each fitted to a few slips, so the lock is blurred, not sharpened, by placement error. The
  quarter-frame step at most jumps has not been isolated in the delay.
open_questions:
  - title: "Where is the quarter-frame step at a jump?"
    kind: phenomenon
    summary: >-
      Sub-frame steps in the PPG chain lock to quarter frames, but only 95 of 694 phase jumps have a step of the
      jump's size between their runs. Whether the phase can move without a step, or the step is masked by the
      excursion it follows, is open.
  - title: "Why two setups run backwards"
    kind: phenomenon
    summary: >-
      Setups COM12 · COM4 · COM5 · COM7 and COM15 · COM13 · COM14 · COM22 lose a frame about every 12 minutes in
      nearly every recording with a sawtooth, and one more setup has both directions. Which oximeter sits on those
      ports, and why its content runs faster than its frames, is not known.
  - title: "Why cuff inflations come with slightly more steps"
    kind: phenomenon
    summary: >-
      Slips and sub-frame steps are 7–8% more frequent within 45 s of a new NIBP reading. Whether the cuff disturbs
      the pulse enough to trigger the slip mechanism, or the detector sees more candidates in disturbed beats, is open.
figures:
  - id: quarter-jump
    file: ppg-sawtooth-quarter-jump.png
    theme: example traces
    source: vitaldb-bench tools/sawtooth_char.py
    records: [4572]
    caption: >-
      A phase jump in [[case:4572]]: slips every 6.27 minutes (dashed lines), then one three quarters of a tooth
      early near 47 minutes, after which the grid continues at the new phase. The plateaux near 7–11 and 78 minutes
      are arterial-line artefacts in the ART→PPG trace; the slips were found on ECG→PPG.
    alt: A sawtooth trace with regular upward steps and dashed lines, two rectangular artefact plateaux, and four zoom panels of single steps.
  - id: reversed
    file: ppg-reversed-sawtooth.png
    theme: example traces
    source: vitaldb-bench tools/sawtooth_char.py
    records: [2537]
    caption: >-
      A reversed PPG sawtooth in [[case:2537]]: ART→PPG delay creeps up and drops by one frame every 12 minutes
      (dashed lines: downward one-frame steps found), with one-minute zooms on each step. The jump at 68 minutes is
      an arterial-line artefact.
    alt: A delay trace rising slowly and dropping by about 30 ms seven times, with seven zoom panels each showing a sharp downward step.
