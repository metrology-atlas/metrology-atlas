id: pleth-hr-derivation
name: How the Solar8000 computes its pulse rate
summary: 'PLETH_HR recomputed from the plethysmogram''s pulses in 6,151 recordings: a mean of the last [[value:pleth-hr-window-pulses|number]] pulse intervals
  that leaves out intervals far from their median, rounded, ready [[value:pleth-hr-delay]] after the window ends (5th–95th percentile 2.6–4.8
  s) and stamped at the next 2 s poll. It wins in 99% of the recordings reproduced best. Its window is centred about 8.9 s before the stamp, further before the stamp (earlier)
  than the atlas''s earlier form for it assumed (7.8 s); the comparison with heart rate puts it at
  [[value:pleth-hr-window-centre]], an open question.'
date: 2026-11-07
status: current
methods:
- delays-and-windows
devices:
- solar8000
- snuadc
variables:
- solar8000-pleth-hr
- snuadc-pleth
data: 'Every recording with SNUADC/PLETH and Solar8000/PLETH_HR: 6,151 of 6,388 (237 have no plethysmogram with the pulse
  rate). Up to 3,000 PLETH_HR values per recording over its first 4 hours of plethysmogram.'
background: 'Two earlier results disagreed about PLETH_HR''s window: the numeric derivation pilot found a median of about
  12 beats ([[study:numeric-derivation-pilot]]), and the comparison with heart rate found a ridge at a constant ratio of
  pulse to heart rate, which a mean over a fixed number of pulses gives and a median does not ([[study:hr-vs-pulse-rate]]).
  That comparison also centred the window about [[value:pleth-hr-window-centre]] before the stamp, earlier than the atlas''s form for PLETH_HR (7.8 s). Recomputing
  PLETH_HR from the plethysmogram, record by record, settles what can be settled.'
method: '1. Pulses: SNUADC/PLETH on its own sample times, band-passed 0.5–10 Hz, one pulse per steepest upstroke (at least
  0.3 s apart), moved 0.385 s earlier by the plethysmogram''s hardware delay ([[parameter:pleth-chain-delay]]), so pulse
  times are the monitor''s own.

  2. Candidates at each PLETH_HR stamp, from the pulses up to a delay d before it (0–10 s in 0.25 s steps): 60 over the
  mean or the median of the last N intervals (N = 4–16); over their mean without the longest and the shortest, or over the
  mean of those within 25% of the window''s median (N = 6–14); over the mean interval in the last T seconds, or the pulse
  count in the last T seconds (T = 4–16 s); each truncated and rounded.

  3. Per recording, each candidate''s best delay and the share of PLETH_HR values it reproduces exactly; across recordings,
  the share pooled, and how often each wins.

  4. Phase (7 Nov 2026): for the adopted rule and its neighbours (8–12 intervals), the delay in the convention of the HR
  fits ([[study:hr-derivation]]). A value stamped at t was computed at t − d − φ, with φ uniform over the gap since the
  previous record ([[value:solar8000-poll-gap]]), so d is the shortest delay; the match at every delay on a 0.1 s grid is averaged over each
  record''s phase interval [d, d + gap), and the best d kept.'
results: '- **A mean of [[value:pleth-hr-window-pulses|number]] pulse intervals that leaves out outliers.** A mean of the last [[value:pleth-hr-window-pulses]], keeping only those
  within 25% of their median, reproduces 70.4% of values exactly, pooled; a plain mean of 10 reproduces 61.9%, a median
  of 10 62.4%, a mean without the longest and shortest 62.8%, and windows of a fixed time less. In the 2,473 recordings
  reproduced best (at least 80% exact by some candidate), the outlier-rejecting mean (at some N of 6–14) wins in 2,446 (99%), and the 10-interval rule over all recordings in 4,513 of 6,151
  ([[parameter:pleth-hr-window-pulses]]). Neighbouring windows (9, 11, 12 intervals) of the same rule come next, so the count is [[value:pleth-hr-window-pulses|number]].

  - **Why the first comparison was a tie.** A plain mean and a median each match the monitor wherever the window holds no
  outlying interval, and each fails differently where it does; the rule that leaves outliers out matches in both.

  - **Rounded, not truncated:** for the adopted rule, rounding reproduces more values than truncation in 99% of
    recordings (98.8%), where heart rate is truncated ([[observation:hr-truncated]]). This, the exact-match delay''s 5th–95th percentiles and robust SD, and the 6.0–11.0 s window come from the part files
    ([[code:vitaldb-bench/tools/adhoc/audit_low_checks.py]]); the summary holds only their p10–p90. The uniform-phase delay is in the summary''s phase block
    ($W/examples/pleth_hr_derivation_phase/agg/summary.json).

  - **Ready [[value:pleth-hr-delay]] after its window ends, then stamped at the next poll** (shortest delay, median over
  recordings; 5th–95th percentile 2.6–4.8 s; robust SD 0.59 s; [[parameter:pleth-hr-delay]]). Fitted as one delay with
  no wait for the poll, as first done, the delay is 4.5 s (3.25–5.75 s); the uniform-phase fit puts it 0.9 s lower
  (median per recording; 5th–95th percentile 0.45–1.35 s), and the wait adds 1.0 s on average
  ([[parameter:solar8000-poll-gap]]), so the stamp comes 4.7 s after the window ends. Its window,
  [[value:pleth-hr-window-pulses]] of the median 0.84 s, is centred 8.9 s before the stamp. The atlas''s earlier form for
  PLETH_HR (delay 2.79 s, window 8–12 s) put it at about 7.8 s; the form now uses this study''s numbers.'
discussion: Two independent routes, one through heart rate and one through the plethysmogram's own pulses, both
  say the window is a count of pulses, about [[value:pleth-hr-window-pulses|number]]. They placed it at the same moment,
  about 8.5–8.8 s before its stamp, until the wait for the poll was counted the same way in both; counted, this
  study puts the centre 8.9 s before the stamp and the comparison with heart rate about [[value:pleth-hr-window-centre]] (see the open question). The
  atlas's form for PLETH_HR described a shorter delay over a window of 8–12 s; it now uses this study's numbers ([[variable:solar8000-pleth-hr]]),
  and keeps the earlier ones in its evidence. The pulses are averaged by a mean that leaves out outlying intervals, so a
  single missed pulse, whose interval is about double, does not move the rate.
limitations: '- Pulses are found by our own detector, not the monitor''s; where the two disagree, no candidate can match,
  which caps the exact-match share (77% of values per recording, median; 70.4% pooled).

  - The delay is the delay of the best candidate; it moves by about half a second between a mean and a median of 12.

  - Only the first 4 hours of each recording are used.'
open_questions:
- title: The rejection rule's band, and the ridge below the diagonal
  kind: next step
  summary: The 25% band around the median was a first guess; narrower and wider bands, and rejection against the previous
    value rather than the window's median, would say what the monitor does. Such a rule ignores a single missed pulse, so
    the ridge at [[value:pr-hr-ridge-ratio]] times the heart rate in [[study:hr-vs-pulse-rate]] does not come from single missed pulses as first
    read; intervals lengthened by less than the band, as around ectopic beats, may make it.

- title: Where PLETH_HR's window sits, by the two routes
  kind: conflict
  summary: With the wait for the poll counted on both sides and the comparison's lag read at its steps' midpoints
    (8 Nov 2026), this study centres PLETH_HR's window 8.9 s before its stamp and the comparison with heart rate
    [[value:pleth-hr-window-centre]] ([[study:hr-vs-pulse-rate]]), 0.5 s apart, 0.2–0.3 s beyond the pulse-arrival time,
    more at fast heart rates. Most of the 1 s gap of 7 Nov was the comparison reading its lag at its steps' edges. Of
    what is left, the delay fits account for about 0.2 s ([[study:numeric-delay-check]]); a window of 11 or 12
    intervals, which fit almost as well as 10, would move this study's centre by about half an interval.
code:
- vitaldb-bench/tools/pleth_hr_derivation.py
- vitaldb-bench/examples/run_scan.sh
typed_ok:
  - {parameter: pleth-hr-window-pulses, text: "10", why: "band edge, delay range and candidate sizes; the window is linked where it is the result"}
  - {parameter: pr-hr-ridge-ratio, text: "0.9", why: "a delay difference in seconds"}
  - {parameter: pleth-hr-window-centre, text: "10", why: "the 0–10 s range of delays searched, not the window centre"}
