    file: drift-units.png
    theme: drift and resets
    source: ad hoc (no script in vitaldb-bench yet; to be regenerated by one)
    caption: Drift per case falls into discrete units about 1 ppm wide for SNUADC and BIS; paired drifts group by the ports the two devices used.
    alt: Two histograms with fitted Gaussian units, and a scatter coloured by port pair.
  - id: sync-snuadc-drift-zoom
    file: sync-snuadc-drift-zoom.png
    theme: drift and resets
    source: vitaldb-bench tools/sync_figures.py
    caption: 'SNUADC drift per case: step-mode recordings sit in clusters near −81, −68 and −60 ppm; small-correction-mode recordings between 0 and +20 ppm.'
    alt: Finely binned histogram of drift per case with the step-mode region shaded.
  - id: sync-drift-within-case
    file: sync-drift-within-case.png
    theme: drift and resets
    source: vitaldb-bench tools/sync_figures.py
    caption: 'Each correction’s drift agrees with its case’s drift within ±1 ppm about 70% of the time: drift is stable within a case.'
    alt: Two histograms of correction drift minus case drift, peaked at zero.
  - id: sync-drift-pairs
    file: sync-drift-pairs.png
    theme: drift and resets
    source: vitaldb-bench tools/sync_figures.py
    caption: SNUADC and BIS drift measured in the same case form clusters, with SNUADC step-mode and small-correction-mode cases well apart.
    alt: Scatter of BIS drift against SNUADC drift in ppm, coloured by SNUADC mode.
