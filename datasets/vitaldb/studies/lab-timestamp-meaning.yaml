    caption: In [[case:3255]] every lab draw time (blue) follows an arterial-line access (orange) by 3–5 minutes; the small panels show the high-pressure flush plateau before each recorded lab time.
    alt: A long timing trace with orange and blue vertical lines above six arterial pressure panels, each with a spike a few minutes before the lab time.
  - id: line-access-summary
