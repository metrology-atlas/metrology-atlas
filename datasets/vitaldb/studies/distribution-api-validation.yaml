id: distribution-api-validation
name: Package validation and Monte Carlo cache
summary: |
  The vitaldb_resolution package returns a status for every value in the dataset, reproduces each fitted likelihood, and can precompute every posterior for fast Monte Carlo draws.
date: 2026-10-13
status: current
methods:
- value-resolution
background: |
  - The API takes a VitalDB variable name and a recorded value and returns a distribution over true values. Single-resolution variables get one uniform component; heaped variables get a mixture over rounding modes.
data: |
  - 6,388 cases × 79 clinical variables (504,652 variable-case cells) and all 928,448 lab results.
method: |
  - Ran the full dataset through the package and compared each model's log-likelihood with the stored one: `python tools/validate.py clinical_data.csv lab_data.csv --full` in vitaldb-resolution, which writes `validation_report.json` (statuses, flags, densities, latent and uniform gaps, and the wall time of each pass).
  - Built quantile tables for posteriors from fitted models and compared knot counts, storage types and knot placement against the exact posteriors: `python tools/precision_study.py clinical_data.csv lab_data.csv OUT` (tail-mean end knots, the cache's rule) and the same with `--end-knots support --no-cache` (end knots at the support ends), which write `OUT/precision.json` and `OUT/precision_support.json`.
results: |
  - Clinical statuses: 217,132 ok, 61,106 zero or not recorded, 45,533 missing, 178,864 not applicable, 1,987 imputed, 20 invalid, 10 top-coded. Lab results: 927,816 ok, 543 top-coded (lactate 317, aPTT 226) and 89 bottom-coded (ESR), with 19 off-grid flags (validation_report.json, vitaldb-resolution 0.6.0).
  - The clinical pass takes 7 min and the lab pass 10 min on one core.
  - The cache holds the whole dataset in about 214 MB. One iteration draws every value in about 20 ms for the cases and about 75 ms including all lab results.
  - At any number of knots, int16 has the same worst-case error as float32 and float64. The default is 1,024 knots in int16, with worst mean error 4.7 × 10⁻⁴ SD.
  - Knot placement mattered more than either. End knots at the support ends inflated the SD by up to 80 % at 256 knots; interior knots with tail-mean-preserving end knots cut the worst SD error to 1.1 % and 0.42 %.
  - Since vitaldb-resolution v0.6.0 (18 October; model version 2): each result's density within a rounding
    interval comes from the fitted latent at call time (uniform only where no latent is fitted), and every result
    names its density, model id, version and fit hash. The latent and uniform means differ by a few per cent of
    the interval near the median and by 0.2–0.45 of its width at small values and at the edges. Models are
    versioned (v1 archived and still loadable, `models.lock` per release), every stored log-likelihood now matches
    the recomputed one, and the registry records each anchor's basis.
discussion: |
  - The default's worst mean error is about 20 times smaller than the Monte Carlo standard error after 10,000 iterations.
  - Building the package surfaced new rules: two out-of-range anaesthesia ends, 93 clock-offset mismatches, child native resolution, and a revised red-cell rule.
limitations: |
  - Where a posterior has a gap between two rounding windows, draws can land inside it. This is the large point-wise quantile error (0.8 SD at the 99th percentile at 1,024 knots); it barely moves the mean, SD or W1.
open_questions:
  - title: "Reproduction check (2 November 2026)"
    kind: next step
    summary: >-
      Rerunning the listed tools against the numbers above.
      Reproduced from the saved outputs: every clinical and lab status count, the 19 off-grid flags, the 93
      clock-offset mismatches (opend 92, opstart 1), the latent and uniform gaps and the log-likelihoods
      (`validation_report.json`, 0.6.0); the worst mean error at 1,024 int16 knots (4.69 × 10⁻⁴ SD), the worst SD
      errors 1.1 % (256) and 0.42 % (1,024), and int16 matching float32 and float64 (`tools/precision_results.json`).
      Not in any saved output: the 214 MB (the how-to's RAM figure; the saved run records 186.7 MB of arrays, not
      resident memory), the 20 and 75 ms draws (the saved run has 14.1 and 66.3 ms), the 0.8 SD 99th percentile
      (the saved run reports it per group, 1.43 for timestamps and 0.36 for value models, not pooled), the 80 %
      inflation with end knots at the support ends (no saved run of that placement), and the 7 and 10 min passes
      (printed, not saved). The saved precision run predates 0.6.0: collecting the posteriors now gives 66,203
      tables, not 66,180. Both tools now record these quantities, with the package version, commit and machine,
      and are being rerun on 0.6.0.
tags:
- from the resolution work
code:
  - vitaldb-resolution/tools/validate.py
  - vitaldb-resolution/tools/precision_study.py
