id: correction-periods
name: How often each device is corrected
summary: >-
  The devices re-synchronise in different ways: SNUADC when its drift reaches about half a second, BIS on a fixed
  8,192 s timer, and the Primus by small steps about every two hours that do not keep up with its drift (+104 ppm,
  measured later by breath matching).
date: 2026-10-17
status: current
methods: [stamp-reading]
techniques: [sawtooth-fit]
clocks: [snuadc-sample, bis-clock, primus-clock, recorder-pc]
devices: [snuadc, bis, primus]
variables: [snuadc-ecg-ii, bis-eeg, primus-awp]
data: |
  Record stamps of SNUADC ECG II, BIS EEG1 and Primus AWP in the 250 cases with clock fits.
method: |
  Corrections were taken from the stamp fits. Intervals count only consecutive corrections inside one stretch
  between gaps.
results: |
  - **SNUADC (step mode) corrects on a drift threshold.** Its interval follows its rate: about 0.5 s ÷ rate predicts
    a median of 2.08 h, and 2.06 h is observed (p10–p90 1.70–2.31 h, 182 intervals; the full release gives 2.08 h in 642 recordings, [[study:device-correction-schedules]]).
  - **BIS corrects on a fixed timer** of 8,192 s (2¹³ s) in 95% of 266 intervals. The step takes whatever drift has
    built up (+83 to +289 ms, median +155 ms); 0.155 s per 8,192 s implies 19 ppm, against 23 ppm from the tooth
    fits (25 ppm and a median step of +0.17 s in the full release).
  - **Primus AWP shows small corrections** of −64 to +80 ms (median +8 ms) about every 7,230 s (2.0 h; p90 twice
    that), besides gaps of +20 to +22 s (median 5.5 per case).
discussion: |
  The Primus corrections imply a drift of only about 1–11 ppm against the recorder. Breath matching later measured
  the drift itself at about +104 ppm ([[parameter:primus-drift-breath]], [[study:ventilator-breath-matching]]):
  these small corrections do not track the Primus drift, so their size is not its rate.
open_questions:
  - title: "What the Primus's small corrections correct"
    kind: phenomenon
    summary: >-
      The corrections imply 1–11 ppm, but breath matching measures the Primus drifting about +104 ppm against the
      recorder PC ([[parameter:primus-drift-breath]]), and the stamps also step at the AWP pauses by amounts unrelated
      to the drift built up. What the small steps correct, if not the drift, is open. (This replaces the earlier
      conflict between 1–11 ppm and the assumed 115 ppm, which breath matching settled.)
code:
  - vitaldb-bench/tools/clock_correction_periods.py
