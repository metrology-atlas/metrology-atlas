id: device-correction-schedules
name: When each device's clock is corrected, in every recording
summary: >-
  From the steps between records in all 6,388 recordings: the BIS is corrected every [[value:bis-period]] and the Primus every
  [[value:primus-period]], on their own timers (the first correction comes at any time after the device starts); the SNUADC is
  reset when its count gets half a second ahead of the PC, the recorder's rule
  ([[study:vital-recorder-stamping-rules]]). With the full rerun of the correction fit, it gives each device's drift
  against the recorder PC in 4,728 BIS and 2,728 SNUADC recordings, and shows that the Primus's 20–23 s AWP pauses
  belong to its correction cycle. Every rate here is relative to the recorder PC, whose own clock drifts and is
  corrected.
date: 2026-10-19
status: current
methods: [data-continuity, stamp-reading]
techniques: [remainder-test]
clocks: [bis-clock, snuadc-sample, primus-clock, recorder-pc]
devices: [bis, snuadc, primus]
variables: [bis-eeg, snuadc-ecg-ii, primus-awp, primus-co2]
code:
  - vitaldb-bench/tools/correction_schedules.py
  - vitaldb-bench/tools/step_classify.py
  - vitaldb-bench/tools/step_classify_agg.py
data: |
  The classified steps between records of [[study:step-classification]] (all 6,388 recordings) and the start of
  each track from the segment tables of [[study:continuity-gaps-segments]]; for comparison, the per-recording drift
  rates of [[study:clock-correction-scan]] (BIS 1,627, SNUADC 460 recordings).
background: |
  **Every rate here is relative.** Each record is stamped by the recorder PC, so a device's "drift" is its own
  clock against the PC's clock ([[clock:recorder-pc]]), not against true time. The PC clock itself drifts and is
  corrected by its time service ([[link:recorder-pc-vs-utc]]); a PC correction inside a measurement interval shifts
  that interval's apparent device drift, so part of the spread below may be the PC's, not the device's.

  Earlier studies measured the correction schedules on a few hundred benchmark recordings
  ([[study:correction-periods]], [[study:snuadc-stamp-sawtooth]]). The step tables already hold every correction
  in the release, so the schedules, and the drift they imply, can be read for every recording.
method: |
  - **Census:** [[code:vitaldb-bench/tools/clock_correction_periods.py]] rerun on all 6,388 recordings (19
    October, WSL): the stamp-clock fit of each SNUADC and BIS track, giving a drift for every recording with at
    least one correction.
  - **BIS:** a correction is a forward step of 10 ms to 1 s in the EEG track that no other device shares. The drift
    is the step divided by the time since the previous correction, for corrections [[value:bis-period|number]] ± 20 s apart.
  - **SNUADC:** a reset is a run of backward steps summing to −0.45 to −0.52 s ([[study:step-classification]]).
    The drift is its size divided by the time since the previous reset. For the first reset, size divided by the
    time since the SNUADC track started gives an approximate value. Six recordings with −0.5 s steps throughout
    are left out.
  - **Primus:** corrections are AWP steps of 10 to 200 ms in either direction; pauses are AWP forward steps of 19
    to 23.5 s that no other device shares.
results: |
  - **BIS: every [[value:bis-period]], on the BIS's own timer.** 95% of corrections after the first come [[value:bis-period|number]] ± 20 s after the
    previous one; the first comes at any time after the BIS starts (uniform over 0–[[value:bis-period]]), so the timer does not
    start with the recording. The median correction is [[value:bis-step]]. BIS drift against the recorder PC, in the 1,939
    recordings with two corrections or more: median 24.8 ppm (5th–95th percentile 7.3–51.1), in several clusters
    (about 18, 28, 44 and 50 ppm), which [[observation:device-drift-by-setup]] ties to setups. The census fit gives
    it in all 4,728 BIS recordings with a correction (median 21.1 ppm, 5th–95th 2.1–52.8) and agrees with the
    intervals where both exist (median difference 0.00 ppm; 33% differ by more than 1 ppm).
  - **SNUADC: reset on a drift threshold** (the recorder resets a converter whose count is more than 0.5 s ahead of
    the PC; [[study:vital-recorder-stamping-rules]]). 3,417 resets in 2,540 recordings, each a stamp step of [[value:snuadc-reset-stamp-step]] (SD 0.7 ms): 2,411 as five records
    out of order ([[observation:reset-records-out-of-order]]), 991 as one step. Between resets, a median 2.08 h
    (5th–95th percentile 1.65–3.57). Drift in the 642 recordings with two resets or more: median −62.9 ppm
    (5th–95th −80.3 to −36.9) against the recorder PC, again in clusters, and the same within 0.01 ppm from the
    census fit. The census gives it in all 2,728 SNUADC recordings with a correction (median −49.5 ppm, 5th–95th
    −79.1 to −8.1). The earlier per-recording
    drift ([[study:clock-correction-scan]]) differs from it by a median 0.949 ppm in the 418 recordings both give,
    within 0.1 ppm of that in 72%: the stamp arithmetic ([[observation:snuadc-stamp-arithmetic]]), which that fit
    included. In 20% the two differ by more than 1 ppm beyond it (5th percentile 15.8 ppm), for reasons not checked.
  - **The SNUADC count usually starts with the recording, but not reliably enough to time drift from it.** The
    first reset comes at 0.99 × (0.49 s ÷ drift) after the SNUADC starts in the median recording (interquartile
    range 0.87–1.01), with wide tails (5th–95th 0.56–1.75). Drift timed that way in the 1,898 single-reset
    recordings is about 10 ppm off the census fit (median difference −9.8 ppm, interquartile −20 to −5), so it is
    not used.
  - **Drift varies within a recording more than quantisation allows.** Between consecutive intervals of the same
    recording, BIS drift varies by a median 3.5 ppm (standard deviation; quarter of recordings above 8.6) and
    SNUADC by 1.2 ppm (above 12.7 in a quarter), against about 1.0 and 0.3 ppm from the stamp resolution. Some of
    this may be the recorder PC's own corrections.
  - **But the BIS and SNUADC swings move in opposite directions.** In the 133 recordings with at least two
    intervals of each device, each SNUADC interval's deviation from the recording's mean drift correlates with the
    time-matched BIS deviation at r = −0.54 (288 intervals; with BIS intervals shuffled within each recording,
    −0.01, 95% range −0.22 to 0.18). Both drifts are defined the same way (how much the PC's clock gains on the
    device's), so a PC clock that ran fast for a while would raise both: a positive correlation. The negative one
    points instead to something acting on the two oscillators in opposite directions (temperature acts on
    crystals of different cuts with opposite signs), or to a coupling in how they are measured that is not yet
    found. Within a recording the SNUADC drift swings more than the BIS drift (standard deviation 8.9 against
    2.6 ppm).
  - **Primus: every [[value:primus-period]], also on its own timer, and the AWP pauses belong to the cycle.** 8,077 corrections in
    4,529 recordings, 95% of them a whole number of 16 ms samples (one sample at 62.5 Hz) in either direction, often two
    at once (median −16 ms; p10–p90 −144 to +144 ms); [[value:primus-period]] apart, or twice that (the 95th percentile of the intervals). These steps are far too small
    for the Primus drift, which breath matching measures at +[[value:primus-drift-breath]] against the PC,
    so they do not give its rate. The 10,496 AWP pauses of 19–23.5 s in 5,502 recordings recur at the same interval, and where a correction lies within 60 s (60% of all pauses; 69% in the recordings with a Primus correction) it follows the pause by about 21.6 s.
    The CO2 track has no gap at the same moment in 90% of them, and the AWP data in the pause are lost, not
    re-stamped: after each pause AWP still lines up with CO2 at the lag it had before ([[observation:primus-awp-pauses]]).
  - These cycles end the long segments: the BIS segments that pile up at 7,500–8,500 s and the Primus AWP segments
    that never exceed about 7,980 s ([[study:continuity-gaps-segments]]) are cut by the corrections and pauses.

  [[figure:correction-schedules]]
discussion: |
  The schedules give drift where earlier studies needed a fit, for three to five times as many recordings, and they
  are consistent with those fits. The BIS and Primus timers run independently of the recording, so a recording
  shorter than one cycle carries no correction of that device; their drift there has to come from the setup
  ([[study:setup-identification]]). The SNUADC's threshold behaviour means its first reset also carries drift
  information, though less reliably than an interval.
limitations: |
  - Corrections inside a gap or shared with another device's step are not counted; a drift is measured only where
    two corrections bound an interval.
  - Backward steps were capped at 3,000 per track in the step scan; the few recordings with more lose some resets.
  - All rates are against the recorder PC; none is traceable to UTC ([[link:recorder-pc-vs-utc]] is assumed).
open_questions:
  - title: "Why does the SNUADC appear to speed up when the BIS slows down?"
    kind: hypothesis
    summary: >-
      Within a recording, the SNUADC and BIS drift deviations against the recorder PC are anticorrelated (r = −0.54,
      133 recordings; shuffled null −0.01), the opposite of what a shared PC excursion would give. Candidates: a
      common factor acting on the two oscillators with opposite signs (temperature, on crystals of different cuts),
      or a coupling in how the two drifts are measured. Test against each recording's time course (temperature
      itself is not recorded; operating-room events and recording length are proxies) and in the joint clock model.
  - title: "How much of the drift spread is the recorder PC's?"
    kind: next step
    summary: >-
      A joint model of the PC and every device clock (each drifting and corrected), fitted to all correction
      events at once, would separate the PC's corrections from the devices'; events seen by several devices at once
      (diathermy bursts, [[study:shared-bursts]]) would validate it.
figures:
  - id: correction-schedules
    file: correction-schedules.png
    theme: drift and resets
    source: vitaldb-bench tools/correction_schedules.py
    caption: >-
      Top: the time between corrections. BIS (left): every [[value:bis-period]]; the first after the BIS starts (orange) at any
      time. SNUADC (middle): the first reset against the time 0.49 s of drift takes at the drift measured from later
      resets; most lie near the diagonal. Primus (right): corrections and AWP pauses both every [[value:primus-period]]. Bottom:
      BIS drift per recording (1,939); SNUADC drift from reset intervals (642, blue) and from a single reset timed
      from the start (1,898, orange; about 10 ppm off the census fit, not used); and the time from each AWP pause to
      the nearest correction. All drifts are against the recorder PC.
    alt: Six panels; a sharp spike at [[value:bis-period]] for BIS, a scatter around a diagonal for SNUADC, spikes at [[value:primus-period]] for Primus; below, two multimodal drift histograms and a spike at [[value:primus-awp-pause]].
typed_ok:
  - {parameter: snuadc-reset-stamp-step, text: "−0.5", why: "the -0.5 s steps of six excluded recordings"}
