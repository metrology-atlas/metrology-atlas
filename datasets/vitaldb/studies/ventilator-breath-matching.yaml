figures:
  - id: sync-demo-breath
    file: sync-demo-1216.png
    theme: example traces
    source: vitaldb-bench tools/sync_demo.py
    records: [1216]
    caption: >-
      One recording ([[case:1216]], 8.7 hours), before synchronisation (left) and after (right), on the same scales.
      Top: each clock's time minus the synchronised time. The SNUADC's stamps drift and are pulled back by half a
      second about every two hours; the BIS's stamps sit about 0.8 s off and are pushed forward every 8,192 s; the
      Primus drifts about 4 s over the recording and steps at its airway-pressure pauses (dotted lines). After
      synchronisation the typical error left is about 3 ms (SNUADC), 40 ms (BIS) and 55 ms (Primus, whole-release
      medians; bands). Middle: the same electrocautery and muscle bursts seen in the ECG and the EEG, as recorded
      and on the synchronised times, a check independent of the correction. Bottom: the airway-to-central-venous
      pressure lag of the breath cycle, as recorded and, after, as the error left when each 10-minute window is
      predicted from all the others.
    alt: >-
      Six panels over 9 hours. Left column: sawtooth lines for SNUADC and BIS and a rising line for the Primus
      spanning about 3.5 seconds; burst lags ramping between minus 0.6 and minus 1.2 seconds; breath lags rising
      from minus 2 to plus 2 seconds. Right column: the same quantities flat near zero.
  - id: vent-breath-matching
    file: vent-breath-matching.png
    theme: example traces
    source: vitaldb-bench tools/vent_match_figure.py
    records: [4644, 4817, 3148, 750, 2443, 1403, 3706, 5780, 2838, 1936, 3146, 3549, 2172, 629]
    caption: Lag of the Primus ventilator against SNUADC, from CVP after breath matching, in 14 cases. The lag ramps by about 50–200 ppm and steps at Primus stamp jumps (red dashed lines). [[case:1936]] and [[case:3549]] show offset plateaus near 8 s; in [[case:3549]] and [[case:2172]] red crosses mark values before the fix. The later breath rule ([[study:primus-awp-anchoring]], work/primus_breath_rule/stretch_k.json) takes one to three breaths off every stretch of [[case:3549]], all set by the main mode rather than by their own pauses, so its plateau is most likely whole breaths; in [[case:1936]] it keeps the matched breath in five of six stretches, so that plateau is not explained.
    alt: Fourteen small scatter plots of lag in ms against hours, with filled and open dots and red dashed vertical lines.
