id: ventilator-breath-matching
name: The Primus ventilator against SNUADC, by breaths
summary: >-
  Each breath shows in the Primus airway pressure and, through the chest, in SNUADC's central venous pressure.
  Tracking that lag puts the Primus on the SNUADC timeline to about 55 ms over the whole release, with a line
  per stretch between its AWP pauses (49 ms in the pilot). At scale it measures the Primus drifting a median +[[value:primus-drift-breath]] against the recorder PC between its AWP
  pauses, with steps at the pauses that do not reset it.
date: 2026-10-12
status: current
methods: [shared-events]
techniques: [windowed-cross-correlation, null-controls]
clocks: [primus-clock, snuadc-sample]
devices: [primus, snuadc]
variables: [primus-awp, primus-co2, snuadc-art]
data: |
  - Pilot: 20 of the longest benchmark cases with CVP, airway pressure and ECG; a 0/60/115/170 ppm sweep on 150
    cases.
  - Whole release (19 October): every recording with Primus airway pressure and SNUADC CVP or arterial pressure
    (3,473 of 6,388 after skipping 2,897 without AWP or a reference and 18 with fewer than 200 mechanical breaths);
    1,067 recordings give CVP lags, 1,384 arterial ones.
background: |
  The Primus shares no artefact with SNUADC, but ventilation reaches the circulation: each breath moves central
  venous and arterial pressure. Ventilation is very regular, so a plain cross-correlation matches one breath away
  almost as well as at the right lag.
method: |
  SNUADC times were corrected with the stamp model. Breath-onset-triggered averages of airway pressure and CVP in
  10-minute windows gave the lag. Breath identity was then confirmed by breath matching: the size of each breath's
  CVP response against the peak airway pressure of breath i + k, which varies enough from breath to breath to pick
  the right k. Injected errors of one or two breaths tested it.

  Commands (vitaldb-bench; $R the release, $W the work folder). Release-wide lags and their held-out errors, in
  four parts p = 0–3 (cases equal to p modulo 4): `python tools/primus_sync_accuracy.py scan --root $R --cases
  $(seq -s, $((p ? p : 4)) 4 6388) --modes $W/results/sync_full/snuadc_mode_label.json --ports
  $W/results/sync_full/snuadc_mode.json --step-rates $W/port_rates/snuadc_step_rates_v3.json --out
  $W/primus_sync_accuracy_v3/part_$p.jsonl`, then `python tools/primus_sync_accuracy.py agg
  $W/primus_sync_accuracy_v3/part_*.jsonl --out $W/primus_sync_accuracy_v3/agg`. With each stretch on its right
  breath (the breath rule of [[study:primus-awp-anchoring]]): `python tools/primus_numbers.py --work $W --sync
  $W/primus_sync_accuracy_v3 --out $W/primus_numbers_v3`. Rerun 9 November with the stamp model's setup-rate
  fallbacks ([[study:snuadc-stamp-sawtooth]]); the 19 October run used port rates (old rates file and folders
  without _v3; it reproduces exactly). The headline numbers did not change: 79 ms robust SD, [[value:primus-breath-error-share]] of windows a
  whole breath off; the 95% interval and the raw lags moved by under 5 ms. One slope per recording with an
  offset at every pause: tools/primus_pause_aware.py. Drift and steps at the pauses: `python
  tools/primus_drift_probe.py CASES OUT.jsonl`. The breath-matching figure: `python tools/vent_sync_pilot.py --root
  $R --cases 4644,4817,3148,750,2443,1403,3706,5780,2838,1936,3146,3549,2172,629 --units
  $W/results/sync_full/units.csv --step-rates $W/results/pat/snuadc_step_rates.json --out
  $W/vent_breath_matching/vent14.jsonl` (about 1.5 minutes), then `python tools/vent_match_figure.py --scan
  $W/vent_breath_matching/vent14.jsonl --cases <the same> --out $W/vent_breath_matching` (redrawn 3 November;
  it matches the first, ad hoc drawing, with 653 of 1,212 windows confirmed by breath matching).
results: |
  - **The Primus clock drifts uncorrected between its stamp gaps:** the AWP→CVP lag ramps within each stretch at a
    median +92 ppm (IQR 34–153), and 72% of lag steps fall at Primus stamp jumps.
  - **Breath-triggered averages** give the lag to 59 ms median per window (p90 269 ms, including whole-breath
    mis-assignments after resets).
  - **Breath matching** confirms the breath identity in 53% of good windows and recovers injected ±1–2-breath errors
    91–96% of the time when confident. With confirmed identity the lag fits per-stretch lines to 49 ms (p90 165 ms).
  - **The drift is 31–200 ppm** (median +141) and not constant within a case. A sweep of assumed drifts is
    inconclusive: 170 ppm fits no better than 115.
  - **At scale (19 October).** The same lag, on the SNUADC stamp model, in 1,061 recordings with CVP
    ([[example:ppv-by-breath]]): the Primus AWP stamps sit a median 1.8 s before the breath seen in the SNUADC CVP (p10–p90 0.6 to 5.1 s; a
    bias of −1.8 s), and a line
    through each whole recording (1,060 with a slope) gives +87 ppm (p10–p90 −49 to +229). Fitted with one slope per recording and one offset per
    stretch between AWP pauses, in 178 recordings with pauses ([[code:vitaldb-bench/tools/primus_drift_probe.py]]): the drift
    within stretches is a median **+[[value:primus-drift-breath]]** (p10–p90 +28 to +184), and the per-stretch offsets halve the residual
    (195 to 99 ms). The steps at the 390 pauses (median −29 ms, p10–p90 −685 to +494 ms) are unrelated to the drift
    built up in the stretch before (correlation 0.0): the pauses move the stamps but do not reset the drift.
  - **Error over the whole release, held out (19 October, rerun 9 November;
    [[code:vitaldb-bench/tools/primus_sync_accuracy.py]]).** Each 10-minute window predicted from all the others
    (a slope and an offset in each stretch between AWP pauses; every CVP window, whatever breath its stretch sits
    on): a median absolute error of 55 ms (p90 187 ms, p95 284 ms) in 1,067 recordings with CVP, against 74 ms (p90 259 ms) with one slope per recording and a new offset at every AWP pause
    ([[code:vitaldb-bench/tools/primus_pause_aware.py]]). The arterial mean pressure as a second reference is
    noisier (83 ms; p90 347 ms, 1,385 recordings),
    sometimes a breath out; where both exist (462) their drifts differ by a median 48 ppm. An injected shift of
    0.25 s and drift of 100 ppm (196 recordings) come back as 0.252 s and 99.6 ppm (medians, one slope per
    recording).
  - **The same errors with each stretch on its right breath (2 November;
    [[code:vitaldb-bench/tools/primus_numbers.py]]).** A whole-breath shift of a stretch moves every window in it
    together, so the held-out errors above already describe a stretch on its right breath; this window set leaves
    out the windows within 5 minutes of a pause and those the breath rule does not cover (37,881 windows, 1,067
    recordings). The median absolute error is 53 ms (robust SD 79 ms; 95% −262 to +272 ms), the figure the Primus
    timing forms use. On top of it, [[value:primus-breath-error-share]] of windows sit in a stretch still a whole
    breath off after the rule ([[study:primus-awp-anchoring]]), which the forms carry as its own component. The 55
    and 53 ms are the same fit on two window sets, not two methods.
  - **Counts.** The 1,061 recordings of [[example:ppv-by-breath]] have CVP lags on the stamp model; 1,060 of them
    give a whole-recording slope. The release-wide run of tools/primus_sync_accuracy.py, with its own selection, has
    1,067 recordings with held-out CVP windows.

  [[figure:sync-demo-breath]]
discussion: |
  The SNUADC stamp model places the SNUADC on the recorder PC's timeline, so the lag's slope is the Primus drift
  against the PC: about +[[value:primus-drift-breath]], close to the 115 ppm assumed earlier from this pilot. The Primus's own small
  corrections ([[study:correction-periods]]) imply only 1–11 ppm, so they do not track the drift. The measured lag
  includes the physiological airway-to-CVP delay, which is constant within a recording and does not affect the
  slope.

  Other references from the arterial line do not settle which breath is right (6 November,
  [[code:vitaldb-bench/tools/primus_ptt_arm.py]], `primus_ptt_arm/agg/summary.json`). In each of the 42,189 CVP windows
  of 1,066 recordings, the beat-to-beat ECG-to-ART delay, the pulse pressure and the arterial mean were matched to the
  same breath average, free to pick a neighbouring breath. The ECG-to-ART delay passes the matching's own quality rule
  in 1.8% of windows (72 recordings) and then agrees with CVP within a quarter breath in 51% and is a whole breath off
  in 28%; the pulse pressure in 8.4% (64% and 23%); the arterial mean in 14.8% (60% and 27%). Where the arterial mean
  is a breath away from CVP (1,587 windows) the ECG-to-ART delay is usable in 18. The breathing modulation of the
  arterial signals is too weak or too alike from breath to breath to pick the breath, so pauses in ventilation
  remain the way to fix it ([[study:primus-awp-anchoring]]).
limitations: |
  A 20-case pilot. The offset includes the physiological airway-to-CVP delay.
  Of the pilot's figures only the drift (+92 ppm, IQR 34–153), the 72% of lag steps at stamp jumps and the lag spreads are in a saved output (`results/pat/vent_sync_pilot_summary.txt`). The injected-error recovery, the per-case fits and the drift sweep (31–200 ppm, median +141) were not saved, and the two drift medians, from different steps of the pilot, are not reconciled.
open_questions:
  - title: "Stretches measured a breath off in the release-wide run"
    kind: conflict
    summary: >-
      The release-wide run (tools/primus_sync_accuracy.py) finds each window's lag within half a breath of a coarse
      estimate, without this study's breath-identity check. About a quarter to a third of its stretches sit a whole
      breath off ([[study:primus-awp-anchoring]]), so its per-stretch accuracy holds only for stretches on the right
      breath, and the between-recording spread is inflated. The Primus timing forms now take each stretch's breath
      from [[study:primus-awp-anchoring]] (pauses in ventilation, else a rule), with the remaining breath error
      ([[value:primus-breath-error-share]] of the matched time) as its own component.
  - title: "What sets the steps at the AWP pauses"
    kind: phenomenon
    summary: >-
      Partly answered by [[study:primus-pause-steps]] (2,491 pauses): where CO2 carries on through the AWP pause
      the stamps barely step (median −1 ms, p10–p90 −164 to +187 ms); the large steps, up to seconds, come where
      CO2 stops too (26% of pauses). None undoes the drift built up. Open: what the stamps re-anchor to when both
      waveforms stop.
  - title: "Separating the airway-to-CVP delay"
    kind: next step
    summary: >-
      The physiological delay from airway pressure to CVP is inside the measured offset and has not been separated.
  - title: "Breath times as a derived variable"
    kind: next step
    summary: >-
      The breaths this study finds in the Primus airway pressure and CO2 are not a published label family, so
      they are not an atlas variable. Published with a version, they would be derived from [[variable:primus-
      awp]] and [[variable:primus-co2]], and features per breath would propagate from them.
