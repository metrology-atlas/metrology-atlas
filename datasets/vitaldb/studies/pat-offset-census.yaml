id: pat-offset-census
name: One device delay for the PLETH across the release
summary: >-
  The stored ECG-to-PLETH delay was measured in 5,536 recordings, to the foot and to the steepest upstroke of each
  pulse. It has one peak (655 ms to the foot, 715 ms to the upstroke, in the median recording), no clusters by
  recording setup or SNUADC port, and no shift along the case order: one global device delay, 385 ms with an adopted
  R-to-foot finger PAT of 270 ms, fits the whole release, as Ruffolo et al. found in their own data.
date: 2026-10-18
status: current
methods: [delays-and-windows, signal-borne-clocks]
techniques: [beat-matching]
clocks: [oximeter-frame-clock]
devices: [snuadc, solar8000]
variables: [snuadc-pleth, snuadc-ecg-ii, snuadc-art]
code:
  - vitaldb-bench/tools/pat_offset_census.py
data: |
  Every recording with ECG lead II and PLETH at 500 Hz (6,136 of 6,388); 5,536 passed the quality rule below, 2,900
  of them with an arterial line. Setups are the PC keys of [[study:setup-identification]].
background: |
  The PLETH reaches the recorder about 0.4 s late ([[observation:ppg-hardware-delay]]). The PAT example first removed
  each case's own offset, which also removed real differences in PAT between patients. Whether one delay fits every
  recording, or one per setup or per epoch, decides how the delay can be removed without that loss.
  [[reference:ruffolo2025high]] saw one global offset (two, over two epochs) in their own monitoring system.
method: |
  - Per recording, 8 segments of 2 minutes spread over the ECG–PLETH overlap from 10 minutes in. In each: R peaks,
    and per pulse in the PLETH (and in the arterial pressure where there is a line) the steepest upstroke and the
    foot (intersecting tangent: where the tangent at the steepest upstroke meets the level of the preceding minimum).
  - **Pairing by the modal delay.** The stored delay (about 0.7 s) is longer than one RR interval at fast heart
    rates, so a nearest-after search pairs pulses one beat out. All R-to-upstroke lags within 0.1–1.2 s are
    histogrammed per segment; a constant delay makes one sharp peak, while pairings one beat out move with the RR
    interval and smear. Each R peak then takes the upstroke nearest the mode.
  - A segment counts if at least half of all lags lie within 20 ms of the mode and the per-beat spread (IQR) is at
    most 30 ms; a recording needs 3 such segments. The per-case value is the median over its segments.
  - Finger minus arterial PAT, beat by beat, removes most of the patient's own PAT, so its spread between recordings
    shows the device delay's structure far more sharply than the finger PAT alone.
results: |
  - **One peak.** Stored ECG→PLETH delay to the steepest upstroke: 715 ms in the median recording (interquartile range 699–730 ms). Finger
    minus arterial PAT: 497 ms (484–510 ms; 5th–95th percentile 456–532 ms). Neither has a second cluster.
  - **The setup explains almost nothing:** 4% of the variance of finger minus arterial PAT between recordings (PC
    key, 57 keys) and 2% (SNUADC port). Every one of the 31 keys with at least 20 recordings has its median within
    about ±15 ms of the global value, and each key's own spread is wider than the gaps between keys. The earlier
    per-setup delays (368–399 ms, from 293 cases) were mostly sampling noise.
  - **No epochs along the case order.** In 16 bins of 400 cases the median moves by at most 4 ms.
  - **Stable within a recording:** from the first good segment to the last (2 hours apart in the median case) the
    stored delay changes by −4 ms (interquartile range −24 to +16).
  - **The stored delay keeps the patient's PAT:** per case, stored finger PAT correlates with arterial PAT (Spearman
    0.56). Removing one global delay keeps that; removing each case's own offset destroys it.
  - **Foot and upstroke.** To the foot, the stored delay is 655 ms (interquartile range 640–670 ms), with the same
    single peak and the same absence of setup clusters (setup explains 2% of its variance) and of a trend along the
    case order (bin medians within 4 ms). The PLETH's foot-to-upstroke time is 59 ms (56.7–62.0 ms) and barely varies.
    The arterial line: 178 ms to the foot, 216 ms to the upstroke. Finger minus arterial PAT is 475 ms foot to foot.
  - **The global delay:** the adopted 270 ms ([[study:ppg-offset-reference]]) is an R-to-finger-foot value, so the
    delay is taken at the foot: 655 − 270 = **385 ms**, which agrees with the earlier foot-based estimate over 293
    cases (385 ms). It implies a finger-minus-radial difference of about 90 ms foot to foot. (A first version used the
    upstroke, 715 − 270 = 445 ms, which mixed two fiducials.)

  [[figure:pat-offset-census]]
discussion: |
  One delay fits the release, so PAT can be compared between patients after subtracting it. Only the absolute level
  rests on an outside value, the adopted finger PAT. Case order is only a proxy for time (the release has no dates),
  so an epoch change like Ruffolo et al.'s would show here only if case numbers follow recording order.
limitations: |
  - 600 recordings failed the quality rule, mostly at fast heart rates or with noisy ECG; if their delay differs,
    the census would miss it.
  - The foot is found on the 0.5–10 Hz band-passed pulse, which rounds the corner where the pulse starts to rise;
    a foot on the raw signal might sit a few milliseconds earlier.
  - The sawtooth adds up to one frame (33 ms) to the stored delay; averaged over a recording it is about the same in
    every case and is part of the global value.
open_questions:
  - title: "Is 90 ms from radial artery to finger plausible?"
    kind: assumption
    summary: >-
      With the global 385 ms, finger PAT exceeds radial-artery PAT by about 90 ms foot to foot. Published values for
      the radial-to-fingertip pulse transit (and for the volume pulse lagging the pressure pulse) would check the
      adopted 270 ms independently; a larger or smaller gap there would move the global delay by the same amount.
  - title: "Epochs in time"
    kind: next step
    summary: >-
      Ruffolo et al. saw two offsets over two epochs. VitalDB has no recording dates; any other ordering of the cases
      in time (software versions in the file headers, say) would allow a sharper test than the case number.
  - title: "Recordings that failed the quality rule"
    kind: next step
    summary: >-
      Fast heart rates and noisy ECG make the modal delay ambiguous. A beat-to-beat pairing that uses the ECG's RR
      interval explicitly would bring most of the 600 back into the census.
  - title: "R-peak times as a derived variable"
    kind: next step
    summary: >-
      Every ECG-to-PPG measure here, and the PPG timing labels ([[variable:ppg-sawtooth-label]]), starts from R
      peaks found in [[variable:snuadc-ecg-ii]], but the atlas has no R-peak variable: their timing error in
      VitalDB has not been measured against a reference. The PPG labels assume the ECG fiducial rounds to one 2
      ms sample, interpolated. An R-peak variable with its own timing form, and a version, would let pulse
      arrival time and heart-rate features propagate from it (schema 0.4).
references: [ruffolo2025high]
figures:
  - id: pat-offset-census
    file: pat-offset-census.png
    theme: delay and window fits
    source: vitaldb-bench tools/pat_offset_census.py
    caption: >-
      Left: per-recording median of the stored ECG→PLETH delay to the steepest upstroke (grey, 5,536 recordings) and of finger minus arterial
      PAT (blue, 2,900 with an arterial line); one peak each. Middle: finger minus arterial PAT per PC key (median and
      interquartile range, 31 keys with at least 20 recordings) against the global 497 ms (±15 ms shaded). Right: bin
      medians along the case order (bins of 400 cases) minus the overall median.
    alt: Left, two single-peaked histograms near 497 and 715 ms. Middle, 31 short intervals all centred within 15 ms of a red line at 497 ms. Right, two flat lines within a few milliseconds of zero.
