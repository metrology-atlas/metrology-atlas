id: shared-bursts
name: Shared bursts between the ECG and the EEG
summary: >-
  Electrocautery and muscle bursts appear in both the SNUADC ECG and the BIS EEG. Cross-correlating their envelopes
  gives the offset between the two devices' stamps every 10 minutes: about [[value:eeg-ecg-offset|.1]], in a sawtooth that follows both
  clocks' corrections.
date: 2026-10-12
status: current
methods: [shared-events]
techniques: [windowed-cross-correlation, null-controls]
clocks: [snuadc-sample, bis-clock]
devices: [snuadc, bis]
variables: [snuadc-ecg-ii, bis-eeg]
data: |
  A first probe on 30 benchmark cases with BIS EEG, then all 191 benchmark cases with BIS.
background: |
  Two devices on separate clocks need an event both of them record. Broadband bursts (electrocautery, muscle
  activity) reach the ECG electrodes and the EEG electrodes at the same instant.
method: |
  The envelope is the log power of the ECG at 30–60 Hz and of the EEG at 30–55 Hz, median-filtered over 0.55 s to
  remove the QRS, with a 10 s running median subtracted. Each 10-minute window (stepped by 5 minutes) is
  cross-correlated over ±20 s, and counts as good when r ≥ 0.3 and the peak beats any lag more than 1 s away by at
  least 0.15. The EEG's two channels give two independent estimates per window; EEG1 against EEG2 is the control.
  Other candidate shared signals were tried: bursts within SNUADC, mains hum, and ventilation.

  Ramps and jumps on the whole release: `python tools/shared_bursts_slopes.py --bursts $W/burst_validation_stamps
  --units $W/results/sync_full/units.csv --root $R --out $W/shared_bursts_slopes` (the recorded-stamp burst lags of
  tools/sa_corrected.py; rerun until summary.json says complete). The benchmark's per-case files were not kept.

  Example figure: `python tools/burst_figures.py examples --stamps $W/burst_validation_stamps --drift
  $W/results/sync_full/full.drift.csv --out $W/burst_figures` (the same eight cases; histograms over the whole release).
results: |
  - **Coverage:** 167 of 191 cases have at least one good window, 145 at least 5; 3,663 good windows in all.
  - **Offset:** median −792 ms (5th–95th percentile −1,053 to −533 ms), EEG minus ECG stamp for the same burst.
  - **Precision:** EEG1 and EEG2 agree to 11 ms (median; p90 36 ms); the control sits at 0 ± 7 ms.
  - **A sawtooth, not a constant.** The offset ramps for 30–90 minutes and jumps back. The ramp slope matches the
    difference of the two devices' drifts from their stamps: over the whole release, 252 of the 335 recordings with
    drifts from the correction scan lie within 25 ppm (r = 0.83 among them; median difference +5 ppm). The benchmark
    gave 108 of 145 and r = 0.88.
  - **The direct rate over the release.** From the stamp-model burst check of the whole release (10-minute windows), the
    BIS runs [[value:bis-snuadc-rate]] against the SNUADC (median of 1,792 recordings; IQR −94.1 to −77.5 ppm),
    −87.9 ppm where both clocks have whole sawtooth teeth (339). The 191 cases above gave −72 ppm. Against the two
    devices' drifts from their correction steps the direct rate closes to −2.3 ppm (median; IQR −12.6 to +0.3; 358
    recordings). (Model5 burst check, v4 rates, 11 November, `$W/direct_rate_m5`; on model3, 19 October: −84.8 ppm
    in 1,805, closure −2.1.)
  - **The jumps are stamp steps:** over the whole release, 74% of 1,872 lag jumps (1,039 recordings) have a SNUADC
    or BIS record-stamp step in the same window, against 9% for the same interval 40 minutes later (benchmark: 79%
    of 216, against 12%).
  - **Other shared signals fail.** Bursts within SNUADC are rare and point to interference entering after the
    monitor's processing; mains hum was not seen in SNUADC at 60 Hz (its harmonics carry it in 39% of recordings, [[study:mains-grid-pc-rate]]); ventilation is too regular to give a unique lag.
discussion: |
  The first direct, artefact-based confirmation of the clock drifts, and the only measure of the absolute offset
  between SNUADC and BIS. Because the ramps and steps are visible in the stamps themselves, they can be corrected
  without any artefact ([[study:snuadc-stamp-sawtooth]]); the bursts then check the correction and give the
  constant left over.
  These numbers are from the 191-case pilot; over the whole release the constant is −805 ms in step mode and
  −665 ms in frequent-correction mode ([[parameter:eeg-ecg-offset]], [[observation:eeg-ecg-offset-by-mode]]).
limitations: Needs bursts; about one case in eight with BIS has none.
open_questions:
  - title: "Burst times as a derived variable"
    kind: next step
    summary: >-
      The electrocautery and muscle bursts found here in the SNUADC ECG and the BIS EEG are not a published
      label family, so they are not an atlas variable. Published with a version, they would be derived from
      [[variable:snuadc-ecg-ii]] and [[variable:bis-eeg]].
code:
  - vitaldb-bench/tools/shared_artifacts.py
  - vitaldb-bench/tools/direct_rate_from_bursts.py
  - vitaldb-bench/tools/shared_bursts_slopes.py
  - vitaldb-bench/tools/burst_figures.py
figures:
  - id: shared-bursts-examples
    file: shared-bursts-examples.png
    theme: example traces
    source: vitaldb-bench tools/burst_figures.py
    records: [750, 5534, 5311, 5780, 1936, 5872, 2778, 359]
    caption: 'Shared electrocautery bursts show the BIS EEG stamped about 0.79 s earlier than the SNUADC ECG, with ramps set by both clocks’ drift: steep ramps in [[case:750]] and [[case:1936]], small-correction-mode SNUADC in [[case:5311]] and [[case:5780]]. Histograms over the whole release (36,788 good windows in 2,702 recordings): median offset −794 ms; in the same window ECG~EEG1 and ECG~EEG2 differ by 12 ms (median; p90 37 ms; 20,173 windows).'
    alt: Eight scatter plots of EEG lag against hours above three lag histograms.
  - id: shared-bursts-slopes
    file: shared-bursts-slopes.png
    theme: agreement and residuals
    source: vitaldb-bench tools/shared_bursts_slopes.py
    caption: Lag ramps measured from shared bursts on the recorded stamps against the drift predicted from the clock corrections (whole release; 252 of 335 recordings within 25 ppm, r = 0.83), and the share of 1,872 lag jumps that fall on a record-stamp step (74%, against 9% 40 minutes later).
    alt: Scatter of measured against predicted ppm with an identity line, and a two-bar chart.
