id: solar-snuadc-clock
name: The SNUADC clock through the Solar8000 numerics, whole release
summary: >-
  On the SNUADC's own sample count, the delay from the waveform to the PC-stamped Solar8000 heart rate and mean
  arterial pressure ramps at the SNUADC's drift against the PC, measured without its stamps or resets. In recordings
  with whole reset intervals it agrees with them (−61 ppm against −66 ppm from their resets; median difference
  per recording +1.5 ppm, 581 recordings). It is too
  noisy per recording, and in recordings under 6 h its rate is biased toward zero; from 6 h it is unbiased against
  the resets and joins the clock network as an edge ([[study:loop-closure]]).
date: 2026-10-19
status: current
methods: [shared-events, delays-and-windows]
techniques: [windowed-cross-correlation]
clocks: [snuadc-sample, recorder-pc, solar8000-clock]
devices: [snuadc, solar8000, vital-recorder]
variables: [snuadc-ecg-ii, snuadc-art, solar8000-hr, solar8000-art-numerics]
data: |
  All 6,388 recordings were read; 50 had no 500 Hz ECG. A rate needs at least 4 usable 30-minute blocks over
  1.5 h: 4,552 recordings for the combined rate (heart rate 4,447; mean arterial pressure 2,968). Reset-interval
  rates for 581 of them come from the clock-network edge table; the shared-burst residuals of the adopted stamp model
  (model3) for comparison.
background: |
  The Solar8000 computes heart rate and mean arterial pressure from the same ECG and arterial pressure that SNUADC
  samples from its analogue outputs, and the recorder stamps each value on arrival with the PC clock. Within a
  recording the numeric's delay behind the waveform is fixed ([[study:numeric-delay-variability]]). Placed on the
  SNUADC's sample count, the waveform drifts against the PC at the SNUADC crystal's rate, and the delay ramps with it.
  A 66-case pilot ([[study:numeric-clock-check]], superseded; its pooled numbers were not saved) first showed the ramp.
method: |
  Two timelines per recording: the sample count (one offset per stretch between gaps, the 17.7 ms lost at each reset
  added back, rate 0) and the adopted stamp model. On each, the numeric's delay was fitted per 30-minute block on a
  0.05 s grid with the likelihood of [[study:numeric-delay-variability]], and a robust line (Theil–Sen) through the
  block delays gave the rate; heart rate and mean arterial pressure were combined by inverse variance. Recordings
  were grouped by SNUADC correction mode, and step-mode recordings by whether they have a whole reset interval.
results: |
  - **Where it can be checked, it closes:** in step-mode recordings with whole reset intervals the median is
    −61.1 ppm (580 recordings; −66.4 ppm from the same recordings' resets), and against those recordings' own reset intervals the median difference is +1.5 ppm (p25–p75 −24 to
    +36; 581 recordings; median |z| 1.11).
  - **Per recording it is noisy:** a median standard error of 40 ppm from mean arterial pressure and 83 ppm from
    heart rate.
  - **It is biased toward zero in short recordings:** in every group the median rises toward 0 as recordings get
    shorter (step mode without a whole reset interval: about +10 ppm under 2.5 h, −38 to −46 ppm over 4 h). A 30-minute
    block ramps by only about 0.11 s at −63 ppm, two steps of the delay grid, and with few blocks the robust line
    is pulled flat by tied delays and by the first block, which often sits apart. Against the resets, by recording
    length: +21.7 ppm at 4.5–6 h (197 recordings), −1.4 ppm at 6–8 h (237) and −7.0 ppm at 8 h or more (95), so the
    bias reaches beyond 4 h but not beyond 6 h ([[code:vitaldb-bench/tools/solar_length_check.py]]).
  - **Its stated standard error is too small:** over the 332 recordings of 6 h or more with whole reset intervals,
    the median |route − reset rate| is 1.14 of its standard error, against 0.67 for a normal, because the
    Solar8000's delay occasionally steps. In the clock network it is widened by that 1.7.
  - **Step-mode recordings without resets sit slower than the model:** at 6–8 h, where the route is unbiased against
    the resets, it lies a median +19.6 ppm above the stamp model's rate in 134 step-mode recordings without a whole
    reset interval (+7.5 ppm in 24 of 8 h or more).
  - **The burst check disagrees with the short-recording medians:** on the adopted stamp model, the ECG–EEG burst lag
    in recordings without a whole reset interval has a median slope of −7 ms/h (step mode, 906 recordings) and
    +10 ms/h (no correction, 521), close to zero, so the port's step-mode rate the model gives them fits on average.

  [[figure:solar-snuadc-rate]]
discussion: |
  A third route to the SNUADC's drift, beside the resets and the shared bursts, and the only one that needs neither
  the SNUADC's stamps nor the BIS. Where resets exist it agrees with them, which closes a loop through the Solar8000;
  in recordings of 6 h or more it is now an edge of the clock network, where it closes against the resets and,
  without the SNUADC's stamps, against the BIS ([[study:loop-closure]]). Its group medians under 6 h are an artefact
  of the estimator; the burst residuals support the stamp model's choice of the port's rate there. At 6–8 h, where
  the route is unbiased, step-mode recordings without resets still sit about 20 ppm slower than the model's rate,
  which leans toward slower units for the long recordings that show no correction
  ([[observation:snuadc-long-uncorrected]]), but it rests on 134 recordings and is not yet checked against the
  bursts.
limitations: |
  Per-recording rates are too noisy to correct a single recording. The delay grid (0.05 s) and the 30-minute blocks
  limit the estimator in short recordings. The Solar8000's delay occasionally steps; heart rate is truncated and
  polled every 2 s.
open_questions:
  - title: "A finer estimator for short recordings"
    kind: next step
    summary: >-
      Fitting the delay's slope directly in the likelihood (a delay that ramps within the recording), on a finer grid
      and without the first block, would remove the bias toward zero and let this route test recordings with no
      SNUADC reset.
  - title: "Do step-mode units without resets run slower?"
    kind: phenomenon
    summary: >-
      At 6–8 h, where the route agrees with the resets, step-mode recordings without a whole reset interval sit a
      median +19.6 ppm above the stamp model's rate (134 recordings). If real, the stamp model gives those units a rate
      too fast, which would bear on [[observation:snuadc-long-uncorrected]]. The burst lag in the same recordings, and a
      finer estimator for shorter ones, would test it.
code:
  - vitaldb-bench/tools/solar_snuadc_clock.py
  - vitaldb-bench/tools/solar_length_check.py
  - vitaldb-bench/tools/clock_route_figs.py
figures:
  - id: solar-snuadc-rate
    file: solar-snuadc-rate.png
    theme: population results
    source: vitaldb-bench tools/clock_route_figs.py
    caption: >-
      The SNUADC's drift against the recorder PC through the Solar8000 numerics, median by recording length (bins with
      at least 15 recordings). In recordings with whole reset intervals (blue) it approaches the resets' step-mode rate (−63 ppm, the dashed line); in every
      group the estimate rises toward zero as recordings get shorter, an artefact of the estimator rather than of the
      clocks.
    alt: >-
      Three lines of median rate against recording length from 1.5 to 8 hours. All rise toward 0 ppm for short
      recordings; the blue line for recordings with reset intervals settles near the −63 ppm reference line beyond 5 hours.
supersedes: [numeric-clock-check]
