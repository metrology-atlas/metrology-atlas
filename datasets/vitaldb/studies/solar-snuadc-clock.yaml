figures:
  - id: solar-snuadc-rate
    file: solar-snuadc-rate.png
    theme: population results
    source: vitaldb-bench tools/clock_route_figs.py
    caption: >-
      The SNUADC's drift against the recorder PC through the Solar8000 numerics, median by recording length (bins with
      at least 15 recordings). In recordings with whole reset intervals (blue) it approaches the resets' step-mode rate (−63 ppm, the dashed line); in every
      group the estimate rises toward zero as recordings get shorter, an artefact of the estimator rather than of the
      clocks.
    alt: >-
      Three lines of median rate against recording length from 1.5 to 8 hours. All rise toward 0 ppm for short
      recordings; the blue line for recordings with reset intervals settles near the −63 ppm reference line beyond 5 hours.
supersedes: [numeric-clock-check]
