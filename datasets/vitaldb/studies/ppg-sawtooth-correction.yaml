    file: ppg-correction-check-rebuilt.png
    theme: example traces
    source: vitaldb-bench tools/ppg_sawtooth_figures.py
    records: [2156, 6241, 1094]
    caption: The final rebuilt correction on the cases of [[study:ppg-sawtooth]]'s check ([[case:2156]], [[case:6241]], [[case:1094]], panels a–c; grey the corrected slips, orange dashed slips placed only within an interval, corrected as ramps). Across 265 recordings the 663 whole-frame steps corrected shrink from 31.9 ms to −0.5 ms (median) and the slope inside the teeth from −29 to +1 ppm (154 recordings whose creep is corrected); the sawtooth rate groups by setup, not by SNUADC drift (panels d–i).
    alt: Three long PAT traces of measured and corrected values beside six aggregate histograms and scatter plots.
