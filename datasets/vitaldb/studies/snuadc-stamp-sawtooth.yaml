figures:
  - id: sync-demo-stamp-model
    file: sync-demo-1216.png
    theme: example traces
    source: vitaldb-bench tools/sync_demo.py
    records: [1216]
    caption: >-
      One recording ([[case:1216]], 8.7 hours), before synchronisation (left) and after (right), on the same scales.
      Top: each clock's time minus the synchronised time. The SNUADC's stamps drift and are pulled back by half a
      second about every two hours; the BIS's stamps sit about 0.8 s off and are pushed forward every 8,192 s; the
      Primus drifts about 4 s over the recording and steps at its airway-pressure pauses (dotted lines). After
      synchronisation the typical error left is about 3 ms (SNUADC), 42 ms (BIS) and 55 ms (Primus, whole-release
      medians; bands). Middle: the same electrocautery and muscle bursts seen in the ECG and the EEG, as recorded
      and on the synchronised times, a check independent of the correction. Bottom: the airway-to-central-venous
      pressure lag of the breath cycle, as recorded and, after, as the error left when each 10-minute window is
      predicted from all the others.
    alt: >-
      Six panels over 9 hours. Left column: sawtooth lines for SNUADC and BIS and a rising line for the Primus
      spanning about 3.5 seconds; burst lags ramping between minus 0.6 and minus 1.2 seconds; breath lags rising
      from minus 2 to plus 2 seconds. Right column: the same quantities flat near zero.
  - id: stamp-model-validation
    file: stamp-model-validation.png
    theme: agreement and residuals
    source: vitaldb-bench tools/burst_figures.py
    records: [4644, 359, 2580, 5780, 750, 1703]
    caption: The stamp sawtooth model flattens the EEG-minus-ECG offset in [[case:4644]], [[case:2580]], [[case:750]] and [[case:1703]] (step mode) and in [[case:359]] and [[case:5780]] (small-correction mode). Over the whole release (36,175 windows in 2,671 recordings; stamp model with setup-rate fallbacks, 9 November), with each recording's own constant the median timing error falls from 794 ms to 15 ms; the constant left is −805 ms in step mode (1,531 recordings) and −665 ms in small-correction mode (78); the within-recording SD falls from 100 to 20 ms (median).
    alt: Six scatter plots of recorded against model stamps beside bars of error by correction level and two histograms.
  - id: validation
    file: stamp-model-error-by-level.png
    theme: agreement and residuals
    source: vitaldb-bench tools/stamp_error_levels.py
    caption: |
      EEG–ECG timing error per 10-minute window at each level of correction, on the whole release (36,197 shared-burst
      windows good on both the recorded stamps and the adopted model, in 2,671 recordings; model4, 9 November).
    alt: >-
      Bar chart of median and 90th-percentile timing error for five correction levels, falling from 794 and 1,016 ms
      for recorded stamps to 15 and 75 ms for the stamp model with the recording's own constant.
  - id: burst-validation-full
    file: burst-validation-full.png
    theme: agreement and residuals
    source: vitaldb-bench tools/burst_validation_agg.py
    caption: >-
      The stamp model checked with ECG–EEG bursts in every recording (9 November, model4). Left: the constant left after the
      model, per recording, by SNUADC correction mode. Middle: the remaining timing error per 10-minute window,
      against the mode's constant (leave-one-out) and the recording's own. Right: the drift left over each
      recording: near zero where both clocks were fitted from whole teeth (blue), and centred near zero, but wider,
      where the SNUADC made no correction and was given a borrowed step-mode rate (grey; its setup's where there is
      one, else its port's; a BIS without a whole tooth likewise). Before borrowed rates the grey group sat near
      −176 ms/h.
    alt: Three panels; a sharp peak near −805 ms for step mode; two cumulative curves rising between 10 and 200 ms; a slope histogram with a narrow blue peak at zero and wider orange and grey humps also centred at zero.
