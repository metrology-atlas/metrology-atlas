id: snuadc-stamp-sawtooth
name: The stamp sawtooth model for SNUADC and BIS
summary: >-
  Fitting each track's record stamps against its sample count as a drift with corrections (a sawtooth) puts SNUADC
  and BIS on one timeline without any artefact. Checked against shared bursts, the EEG–ECG timing error falls from
  about 790 ms on the recorded stamps to 33 ms with one constant per SNUADC mode.
date: 2026-10-12
status: current
methods: [stamp-reading, shared-events]
techniques: [sawtooth-fit, windowed-cross-correlation]
clocks: [snuadc-sample, bis-clock, recorder-pc]
devices: [snuadc, bis, vital-recorder]
variables: [snuadc-ecg-ii, bis-eeg]
data: |
  191 benchmark cases with BIS; validation on 143 cases with at least 5 good burst windows each way, and on 3,683
  ten-minute windows in 165 cases. Later refitted on 250 cases with the signal lost at each SNUADC reset. Rerun on
  the whole release (19 October): all 5,520 recordings with ECG II and BIS EEG; 36,911 good burst windows in the
  2,714 recordings with at least 5.
background: |
  Between corrections a device stamps by its own sample count, so the offset between two devices ramps at the
  difference of their clock rates; the corrections pull each device back towards the recorder's clock. Both are
  visible in the stamps alone ([[study:shared-bursts]]).
method: |
  [[software:physiosync]]'s [[code:physiosync/physiosync/stamps.py|stamp_clock]] takes each record's stamp minus the time given by the sample count. It estimates one rate
  per recording from whole teeth (the drift each correction removes, divided by the time since the last), then one
  offset per stretch between real gaps; corrected_times places every sample on that line. VitalDB rules: SNUADC
  corrects downwards and BIS upwards, and steps the other way are gaps; a SNUADC track in frequent-correction mode
  keeps its stamps; a step-mode track without a whole tooth takes its port's typical rate (−47 to −74 ppm); a BIS
  track without one takes its unit's mean rate. Since 17 October the 17.7 ms lost at each SNUADC step-mode
  correction is added back ([[study:paced-ecg]]).

  [[figure:validation]]
results: |
  - **Whole teeth** on 151 SNUADC and 184 BIS tracks of 191; the rates agree with the correction scan where that is
    plausible.
  - **Within-case SD of the EEG–ECG offset:** 137 ms on the recorded stamps, 25 ms on the model (median); the bursts'
    own noise floor is about 11 ms. Ramps flatten (median slope 53 → 12 ms/h) and lag jumps fall from 1.5 to 0.38
    per case.
  - **A constant offset is left:** EEG minus ECG −803 ms in step mode (117 cases) and −690 ms in frequent-correction
    mode (29 cases), tight within a port or unit.

  | Correction | Median error | p90 |
  |---|---|---|
  | Recorded stamps | 792 ms | 1,005 ms |
  | Stamps minus one constant | 126 ms | 259 ms |
  | Model minus one constant | 38 ms | 154 ms |
  | Model minus the SNUADC mode's constant (leave-one-out; no artefact needed) | 33 ms | 116 ms |
  | Model minus the case's own constant from its bursts | 16 ms | 67 ms |
  **Whole release (19 October).** The model's ECG–EEG burst check, rerun on every recording
  ([[code:vitaldb-bench/tools/burst_validation_agg.py]]):

  - **The constants hold:** EEG minus ECG −804.5 ms in step mode (1,530 recordings; interquartile range −835 to
    −776) and −667.5 ms in frequent-correction mode (78), against −803 and −690 ms on the benchmark.
  - **Where both clocks have whole teeth** (377 recordings) the result matches the benchmark: within-recording SD
    18 ms, drift left 8.7 ms/h (median absolute slope). Against the step-mode constant, a typical window is off by
    35 ms (median; p90 135 ms).
  - **Recordings with no SNUADC correction at all** (1,099) are the weak spot. The model reads them as
    frequent-correction mode and gives the SNUADC no drift, but their EEG–ECG offset drifts by about −200 ms/h,
    the step-mode drift (about −56 ppm against the BIS's +25): these are step-mode recordings that end before the
    first reset. Their median error is 81 ms. Giving them their port's step-mode rate instead of zero should remove
    most of it.
  - Over all 2,714 recordings: a median error of 46 ms against the mode's constant and 22 ms against the
    recording's own constant (p90 165 and 106 ms).

  [[figure:burst-validation-full]]
discussion: |
  The model needs no artefact; the bursts only check it and supply the constant. With the constant for the case's
  SNUADC mode, a typical window lines up to about 33 ms; with the case's own bursts, to about 16 ms. These are the
  numbers behind the BIS EEG "after sync" timing in the planner.
limitations: |
  Recordings that change correction mode partway, or have many gaps, still fail (p99 about 250 ms). The error
  distributions come from the bursts, so they include the probe's own noise.
open_questions:
  - title: "Recordings without a SNUADC correction"
    kind: next step
    summary: >-
      1,099 recordings have no SNUADC correction, so the model gives the SNUADC zero drift; the bursts show they
      drift like step mode (about −200 ms/h against the EEG). Give them the port's step-mode rate (or the census rate
      of the setup), and keep zero only for recordings with the frequent mode's small steps.
  - title: "Recordings that change correction mode partway"
    kind: phenomenon
    summary: >-
      Recordings that change correction mode partway still fail the model (p99 about 250 ms). Why a recording
      changes mode, and how to fit both parts, is open.
  - title: "Why the constant offset differs between modes"
    kind: phenomenon
    summary: >-
      The EEG lags the ECG by −0.80 s in step mode and −0.69 s in frequent mode after the model; why the constant
      differs between modes is not known.
code:
  - physiosync/physiosync/stamps.py
  - vitaldb-bench/tools/sa_corrected.py
  - vitaldb-bench/tools/clock_model_fit.py
figures:
  - id: stamp-model-validation
    file: stamp-model-validation.png
    theme: agreement and residuals
    source: ad hoc (no script in vitaldb-bench yet; to be regenerated by one)
    records: [4644, 359, 2580, 5780, 750, 1703]
    caption: The stamp sawtooth model flattens the EEG-minus-ECG offset in [[case:4644]], [[case:2580]], [[case:750]] and [[case:1703]] (step mode) and in [[case:359]] and [[case:5780]] (small-correction mode). With a per-case constant the median timing error falls from 792 ms to 16 ms.
    alt: Six scatter plots of recorded against model stamps beside bars of error by correction level and two histograms.
  - id: validation
    file: stamp-model-error-by-level.png
    caption: |
      EEG–ECG timing error per 10-minute window at each level of correction (3,683 windows, 165 cases).
    alt: >-
      Bar chart of median and 90th-percentile timing error for five correction levels, falling from 792 and 1,005 ms
      for recorded stamps to 16 and 67 ms for the stamp model with a per-case constant.
    placeholder: true
  - id: burst-validation-full
    file: burst-validation-full.png
    theme: agreement and residuals
    source: vitaldb-bench tools/burst_validation_agg.py
    caption: >-
      The stamp model checked with ECG–EEG bursts in every recording (19 October). Left: the constant left after the
      model, per recording, by SNUADC correction mode. Middle: the remaining timing error per 10-minute window,
      against the mode's constant (leave-one-out) and the recording's own. Right: the drift left over each
      recording: near zero where both clocks were fitted from whole teeth (blue), about −200 ms/h where the SNUADC
      made no correction and its drift was taken as zero (grey).
    alt: Three panels; a sharp peak near −805 ms for step mode; two cumulative curves rising between 10 and 200 ms; a slope histogram with a blue peak at zero and a grey hump near −200 ms/h.
