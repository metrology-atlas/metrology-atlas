figures:
  - id: staircase
    file: staircase.png
    theme: example traces
    source: vitaldb-bench tools/waveform_staircase_plot.py
    records: [497]
    caption: >-
      The steepest 48 ms of each SNUADC channel in one recording, sample by sample: the arterial pressure and the
      plethysmogram change on almost every sample, so the 240 Hz cycle is not a held value.
    alt: Four step plots of stored codes over 48 ms, repeated samples marked.
  - id: fold-240
    file: fold-240.png
    theme: distributions of measured parameters
    source: vitaldb-bench tools/output_cycle_fold_plot.py
    caption: >-
      Step size by position in the monitor's 240 Hz output cycle, in three recordings: the arterial pressure and the
      plethysmogram swing by 10–13% at the same point of the cycle; the ECG stays flat.
    alt: Three panels of step size against cycle position for four channels.
  - id: bis-grid
    file: bis-grid.png
    theme: distributions of recorded values
    source: vitaldb-bench tools/bis_grid_plot.py
    caption: >-
      The BIS EEG values lie exactly on a 0.05 µV grid: small steps are whole multiples of it (left), and every sample
      sits on a grid line, against the same values randomly shifted (right).
    alt: A histogram of small steps at multiples of 0.05 µV, and a log histogram of position between grid lines.
  - id: primus-holds
    file: primus-holds.png
    theme: distributions of recorded values
    source: vitaldb-bench tools/primus_holds_plot.py
    records: [1]
    caption: >-
      Primus CO2 and airway pressure at 62.5 Hz, on their steepest 640 ms: CO2 holds each value for 2 or 3 samples (a
      25 Hz internal rate); airway pressure repeats only some samples. Right: how long repeats last, 200 recordings.
    alt: Two step plots with repeated samples marked, and a grouped bar chart of repeat lengths.
