id: loop-closure
name: Closing loops in the timing graph
summary: >-
  Where two independent routes reach the same clock, the offsets around the loop must sum to zero. Three measured
  loops close within their noise; the BIS loop closes up to a constant latency; the proposed EMR loop is not a loop
  at all. Adjusted as a network over the whole release, every loop type closes on average, including two that reach
  the SNUADC through the PC-stamped Solar8000 numerics instead of its own stamps.
date: 2026-10-13
status: current
methods: [shared-events]
techniques: [null-controls]
clocks: [snuadc-sample, bis-clock, primus-clock, cardioq-clock, recorder-pc, hospital-records]
devices: [snuadc, bis, primus, cardioq, ev1000, vital-recorder, clinical-records]
variables: [snuadc-art, cardioq-abp, ev1000-art-mbp, bis-eeg, primus-awp, emr-events]
data: |
  Four loops, each from data measured for another study:

  - **Arterial pressure three ways:** the 15 cases with SNUADC, CardioQ and EV1000 arterial pressure; 14 had usable
    30-minute EV1000 blocks (145 blocks).
  - **BIS EEG:** the burst lags of 145 benchmark cases with BIS ([[study:shared-bursts]]) against both devices'
    stamps.
  - **Ventilation:** 57 large changes in the breath-matched Primus lag from [[study:ventilator-breath-matching]].
  - **EMR clock and recorder clock:** the EMR times and the recorder EVENT track in all 6,388 cases.
background: |
  The links outward from UTC form a tree. Any further link between two nodes closes a loop, and a loop that does
  not close means one of its links rests on a wrong assumption. Where two routes meet is where an assumption can be
  tested rather than defended. With several loops, all links can be fitted together as a network adjustment, as in
  survey levelling or clock ensembles.
method: |
  For each loop, the offset measured directly between two devices was compared with the sum of the offsets along
  the other route:

  - **Arterial pressure three ways:** EV1000 − SNUADC against (EV1000 − CardioQ) + (CardioQ − SNUADC), per
    30-minute EV1000 block; EV1000 − CardioQ is measured without SNUADC.
  - **BIS EEG:** the burst lag's ramps, steps and constant against both devices' own stamps.
  - **Ventilation:** jumps in the breath-matched Primus lag against Primus stamp re-anchors; two physiological
    arms (CVP; systolic pressure) against each other.
  - **EMR clock and recorder clock:** the proposed offset from where entries cluster on 5-minute marks.
results: |
  | Loop | Result | Verdict |
  |---|---|---|
  | Arterial pressure three ways | 14 cases, 145 blocks: residual median +0.13 s (p10–p90 −0.97 to +1.18 s); within 1 s in 75%, 2 s in 96% | Closes, within the CardioQ's re-anchoring spread |
  | BIS EEG | Drift within 25 ppm in 252 of 335 recordings (r = 0.83); 74% of lag jumps on a stamp step (chance 9%); a constant −0.80 s (step mode) or −0.69 s (frequent mode; −0.67 s over the whole release) remains | Closes in drift and steps; the constant is a latency |
  | Ventilation | 72% of 57 large lag changes fall on a Primus stamp jump; the physiological arms differ by 37–46 ppm | Partly closes; physiological arms too weak |
  | EMR and recorder | Both arms are measured from the recorder's case start, so any offset cancels; the recorder EVENT track repeats the clinical table's times exactly | Degenerate: not a loop |

  **Network adjustment over the whole release (19 October; rerun 1 November with the remeasured SNUADC correction, [[value:snuadc-step-correction-size]]; 6 November with the Solar8000 route, run r5).** Every measured link of every recording is an edge
  with a value and a standard error (2,109 recordings; [[code:vitaldb-bench/tools/clock_edges.py]] `--reset-loss
  --drop-missed --solar-min-h 6`), and each recording's clock network is adjusted by weighted least squares
  ([[code:vitaldb-bench/tools/clock_reconcile.py]], on the dataset-independent [[code:physiosync/physiosync/network.py]]).

  The Solar8000 route ([[study:solar-snuadc-clock]]) links the SNUADC's sample count to the PC through the heart rate
  and mean arterial pressure the PC stamps on arrival, without the SNUADC's stamps or the BIS. It enters only in
  recordings of 6 hours or more: shorter ones are biased toward zero, by +22 ppm against the resets at 4.5–6 h and
  −1.4 ppm at 6–8 h ([[code:vitaldb-bench/tools/solar_length_check.py]], `$W/clock_network/solar_length_check.json`).
  Its stated standard error, the slope's, misses the Solar8000's occasional delay steps, so it is multiplied by 1.7:
  the median |route − reset rate| over its standard error in the 332 recordings of 6 hours or more with whole reset
  intervals, over the 0.674 a normal would give. With the stated errors its variance factor was 9.8, and the
  adjustment pushed its misfit onto the resets (5.1 to 17.2).

  The fundamental loops give the misclosures:

  | Loop | Loops | Misclosure, median (p25–p75) | Share with abs(z) > 3 |
  |---|---|---|---|
  | BIS–SNUADC–PC through the resets (BIS steps, ECG–EEG bursts, SNUADC resets) | 253 | +[[value:loop-bis-misclosure]] (−4.0 to +7.7) | [[value:loop-bis-z3-share]] |
  | SNUADC–PC, resets against the Solar8000 route | 178 | [[value:loop-solar-reset-misclosure]] (−20.3 to +20.0) | 2.8% |
  | BIS–SNUADC–PC through the Solar8000 route (BIS steps, ECG–EEG bursts, Solar8000) | 245 | +[[value:loop-solar-bis-misclosure]] (−17.3 to +28.2) | 6.5% |
  | Primus–PC, two routes (breath matching, PIP numerics) | 166 | −2.9 ppm (−48.9 to +46.7) | 5% |

  All four close on average. The third is the new test: the BIS loop closes through a route that uses neither the
  SNUADC's stamps nor its resets, so the reset model is not hiding a bias in the first. Its z also tests the
  Solar8000's 1.7 factor, which was set on the resets and not on the BIS (the second row's z cannot, for that reason);
  its bursts and the Solar8000 route both use the ECG, so the loop is not wholly independent. The variance factors
  (2.0 to 6.8 by method, [[parameter:loop-variance-factor]]; 1 would mean the stated standard errors are right) show the standard errors are
  still too small, so single-recording flags are not yet trusted.

  [[figure:loop-network-adjustment]]
discussion: |
  The relative uncertainty between two signals depends only on the links between them and their nearest common
  node; everything above that node is shared and cancels. The BIS constant belongs in the BIS link as a latency.
  The EMR clock's offset cannot be separated from documentation lag without a time from outside the release.
open_questions:
  - title: "The BIS constant as processing latency"
    kind: hypothesis
    summary: >-
      The loop closes in drift and steps but leaves −0.80 s (step mode) or −0.69 s (frequent mode; −0.67 s over the whole release). A processing
      latency in the BIS is the working explanation; it fits the sign and size but has no direct evidence, and it
      does not explain why the constant differs between modes.
  - title: "The ventilation loop only partly closes"
    kind: phenomenon
    summary: >-
      The ventilation loop only partly closes: its two physiological arms differ by 37–46 ppm.
