figures:
  - id: loop-network-adjustment
    file: loop-network-adjustment.png
    theme: population results
    source: vitaldb-bench tools/clock_reconcile_figs.py
    caption: >-
      Closing loops in the clock network, run r5. (A) Misclosures of the BIS–SNUADC–PC loops through the SNUADC
      resets; (B) the loops through the Solar8000 route: SNUADC–PC against the resets (green) and BIS–SNUADC–PC
      without the SNUADC stamps (red); (C) the Primus–PC loops. (D) Misclosures over their standard errors, against
      the standard normal expected if those errors were right. (E) Variance factor per method; 1 would mean the
      stated standard errors are correct.
    alt: >-
      Five panels: three of misclosure histograms centred near zero (BIS loops through the resets; two step
      histograms through the Solar8000 route; Primus loops), one of z histograms for the four loop types with a
      dashed normal curve, and a bar chart of variance factors between 2.0 and 6.8.
