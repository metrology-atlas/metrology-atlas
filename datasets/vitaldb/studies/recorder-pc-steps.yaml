id: recorder-pc-steps
name: Recorder PC clock steps and recording pauses
summary: >-
  A step of the recorder PC clock would move every record the PC stamps on arrival (the Solar8000 and Primus
  numerics) for good, against the waveforms the devices stamp from their own sample counts. None of 0.5 s or more
  shows in any of the 6,388 files: simultaneous delays of the numerics, up to 23 s, are recorder stalls, after which
  the numerics sit where they were, and what moves everything together is recording pauses.
date: 2026-10-17
status: current
methods: [stamp-reading]
techniques: [coincident-jumps]
clocks: [recorder-pc, utc, snuadc-sample, bis-clock]
devices: [vital-recorder, solar8000, primus, snuadc, bis]
data: |
  All 6,388 files; 19,006 recording hours with both Solar8000 and Primus numerics.
background: |
  The link from the recorder PC to UTC is the only one in the timing graph that cannot be measured from the
  signals, because the release shifts every date. But a step of the PC clock (a time synchronisation, a manual
  change) would leave a trace. Numeric tracks such as the Solar8000 and Primus numerics have no device clock of their
  own: the recorder stamps them on arrival, so every one after the step moves by its size. Waveforms are stamped from
  each device's own sample count and re-anchored to the PC only now and then, so they do not move with it at once,
  and the numerics then sit later against them for good. A recorder stall delays or loses the numerics for a while
  too, but afterwards they are stamped on the right time again.
method: |
  For every file, the intervals between consecutive Solar8000 HR and Primus ETCO2 records were scanned for jumps
  that appear in both at the same time, and the SNUADC and BIS waveform stamps were checked for a jump at the same
  moment. A jump in every track is a recording pause; one in the numerics alone is a PC step or a recorder stall,
  told apart by the numerics' lag behind the waveforms before and after it
  ([[code:vitaldb-bench/tools/pc_step_check.py]] `--events CASE:SECONDS ...`, output `$W/pc_step_check/check.json`):
  the lag of the Solar8000 mean arterial pressure behind the mean of the arterial waveform, and of the Solar8000
  heart rate behind the rate from the ECG's R peaks, in 20 minutes each side, from the best correlation of their
  10 s changes. A PC step changes the lag by its own size; a stall leaves it.
results: |
  - **No PC step of 0.5 s or more** in any file.
  - **No backward steps.** No numeric track stamped by the PC (Solar8000, Primus, Orchestra, EV1000, Vigileo,
    Vigilance, CardioQ) ever steps backwards. The only back-steps are in BIS numerics, in 9 files, which suggests
    the BIS monitor stamps its own numerics. (Read once from every file's numeric record times; that check is not
    saved. pc_clock_steps.py covers only the Solar8000 HR and Primus ETCO2, where no step back occurs either.)
  - **Recording pauses explain the familiar gaps.** In 1,846 files (29%) there are 2,025 moments when every device
    jumps forward together, by a median [[value:recording-pause]] (p10–p90 15.7–29.8 s). Data are missing there, and the stamps
    show it honestly.
  - **Small simultaneous delays are not PC steps.** 20 delays of 0.5–1.0 s in 11 files hit both numerics with no
    waveform jump ([[code:vitaldb-bench/tools/adhoc/pc_steps_summary.py]]), and are followed by an ordinary next SNUADC reset (−0.481 s) and ordinary BIS corrections. The
    PC clock did not move; these are recorder stalls or shifts in polling.
  - **Nor are the large ones.** Four delays of 1 s or more hit both numerics by the same amount (within 0.5 s) with
    no SNUADC jump (`$W/results/clock/pc_steps_*.jsonl`, pc_steps_summary.py): 23 s in [[case:184]], 15 s in [[case:3805]], 14 s in
    [[case:4552]] and 6.6 s in [[case:5213]]. In the three with an arterial line, the mean arterial pressure numeric
    lags the arterial waveform by the same amount before and after, to within 1.5 s (+0.5, −1.5 and +1.5 s;
    correlations 0.37–0.87), where a PC step would have moved it by the whole delay: they are recorder stalls.
    [[case:4552]] has no arterial line, and its heart rate correlates too weakly to decide (lag change −2 s, r 0.20
    and 0.27); but its Primus waveform records arrive bunched just after the gap, about 0.03 s apart against 0.48 s,
    as buffered data catching up after a stall would. The Primus waveforms lose the same stretch in all four and the
    BIS waveform jumps at or soon after three of them; only the SNUADC carries straight through.
discussion: |
  The PC–UTC link stays an assumption, but now a bounded one: whatever the time synchronisation does, it never
  steps the clock by half a second or more. Steps smaller than that, and the gradual slewing Windows normally uses,
  remain invisible.
limitations: |
  Detection is limited to steps of 0.5 s and above. A slow slew of the PC clock cannot be told apart from device
  drift with these data.
open_questions:
  - title: "PC clock steps, not slews"
    kind: assumption
    summary: >-
      The analysis assumes the recorder PC's clock corrects in steps. Slow slewing would look like device drift and
      cannot be told apart from it with these data.
  - title: "The UTCk synchronisations"
    kind: next step
    summary: >-
      The PCs were synchronised with KRISS's UTCk, by hand at irregular times, and no logs were kept
      ([[reference:lee2026correspondence-nov]]). At the PCs' tens of ppm against the grid, each synchronisation
      should leave a simultaneous step of every device of tens to a few hundred milliseconds, below this study's
      0.5 s threshold. A finer search for those steps is the only way left to find when they happened.
code:
  - vitaldb-bench/tools/pc_clock_steps.py
  - vitaldb-bench/tools/pc_step_check.py
  - vitaldb-bench/tools/adhoc/pc_steps_summary.py
