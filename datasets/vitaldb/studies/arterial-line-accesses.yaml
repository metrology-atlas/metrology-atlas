    caption: >-
      Left: arterial pressure around one detected access in [[case:1]]: the pulse is lost, the line is flushed (high
      pressure from the bag), and the pulse returns. Right: time from the start of the latest access to each blood-gas
      stamp (blue), against random times in the same recordings (grey; 30% of them have an access in the 15 minutes
