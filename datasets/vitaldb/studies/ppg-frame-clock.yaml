    file: pat-resolution.png
    theme: distributions of measured parameters
    source: ad hoc (no script in vitaldb-bench yet; to be regenerated by one)
    records: [2]
    caption: PPG fiducials lie on whole 2 ms samples and per-beat PAT noise is about 3.5 ms; detected resets cluster at about 32 ms, one 30 Hz frame. Panel f shows [[case:2]], with a reset every 11.4 min.
    alt: Six panels of histograms and spectra, ending with a sawtooth scatter of PAT against minutes with red reset lines.
  - id: fiducial-resolution
    file: fiducial-resolution.png
    theme: distributions of measured parameters
    source: vitaldb-bench tools/fid_res.py
