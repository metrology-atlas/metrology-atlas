id: ppg-frame-clock
name: The PPG's 30 Hz frame clock
summary: >-
  ECG and PPG fiducials resolve to one 2 ms sample, but PPG fiducials taken on raw samples lock to a hidden 33.3 ms
  frame grid. Scanning for it finds the oximeter's frame clock to about 1 ppm, a fixed fingerprint of each recording
  setup.
date: 2026-10-10
status: current
methods: [signal-borne-clocks]
techniques: [phase-step-detection, null-controls]
clocks: [oximeter-frame-clock, snuadc-sample]
devices: [snuadc, solar8000]
variables: [snuadc-pleth, snuadc-ecg-ii, snuadc-art]
data: SNUADC ECG II and PLETH at 500 Hz in 266 cases with at least 20 minutes of continuous data (the longest stretch of up to 90 minutes each; 378 hours).
background: |
  A coarser time grid hidden under the sample grid would limit how finely PPG timing can be read. A published test
  (differences of consecutive inter-beat intervals) found one in other monitor data at 125 Hz.
method: |
  Inter-beat intervals of nine detectors were tested for any grid of 2–16 samples. Fiducials on raw samples were
  tested for locking to a comb at the 33.3 ms frame period (the interval resultant: 0 for no locking, 1 when every
  interval is a whole number of frames). In absolute sample index, the frame period was scanned in 1 ppm steps for
  the phase that keeps the systolic peaks on one grid through the whole recording, and the two halves of each
  recording compared. Arterial pressure was scanned the same way as a control.
results: |
  - **No coarser grid in the intervals:** 50.2% even differences for ECG R peaks and 50.1% for PPG onsets, against
    50% for no grid.
  - **Raw-sample PPG fiducials lock to the frame:** interval resultant at 33.3 ms of 0.38 for the raw systolic
    maximum, 0.10 for the raw foot and steepest rise, 0.01 for the sharpest kink, and 0.02 for the steepest upstroke
    on the filtered signal. The PLETH shows weak lines at 30, 60, 90 and 120 Hz; the 90 Hz line rules out mains hum.
  - **The frame clock is found in 189 of 266 cases;** the two halves of a recording agree within 2 ppm (median). The
    frame period against the SNUADC sample clock is fixed per setup, for example +84 ppm (IQR 82–88) for one port in
    step mode, +39 ppm for the same port in frequent-correction mode, +72 and +24 ppm for two others. It keeps its
    phase through the sawtooth slips.
  - **The best frame anchor** is pyPPG's d point with a light filter (0.5–45 Hz): it finds the clock in 176 cases,
    against 135 for the raw peak. pyPPG's default filter destroys the lock.
  - **Arterial pressure has no frame** at any period from 2 to 100 samples.
discussion: |
  Locked fiducials carry up to ±17 ms of frame quantisation, so PPG timing should use a fiducial that does not lock
  (the steepest upstroke on the filtered signal). The frame clock is a second clock inside the PPG chain, separate
  from the sawtooth of its content ([[study:ppg-sawtooth]]).
code:
  - physiosync/physiosync/frames.py
  - physiosync/physiosync/quantisation.py
  - vitaldb-bench/tools/frame_an.py
figures:
