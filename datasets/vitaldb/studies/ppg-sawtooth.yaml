id: ppg-sawtooth
name: The PPG sawtooth and its correction
summary: >-
  The ECG→PPG delay creeps at 18–52 ppm and jumps up by one 33.3 ms frame at each slip, every 11–31 minutes. A
  tooth-by-tooth model removes it; where the correction is confident it is essentially exact on injected test data.
date: 2026-10-10
status: current
methods: [signal-borne-clocks]
techniques: [beat-matching, phase-step-detection, null-controls]
clocks: [oximeter-frame-clock, snuadc-sample]
devices: [snuadc, solar8000]
variables: [snuadc-pleth, snuadc-ecg-ii]
data: The same 266 cases (378 hours); a benchmark of a known sawtooth injected into 35 real recordings without one.
background: |
  SNUADC samples ECG and PPG together, so its own drift cannot move one against the other. Any drift between them
  comes from inside the monitor.
method: |
  The PPG delay is modelled as D(t) = offset + frame × (slips so far) − creep. The fit detects resets in the
  beat-matched pulse arrival time and keeps a slip only if it is one frame and falls between two beats
  (physiological changes build over several beats); puts back missed slips only where a gap holds whole teeth and
  the data show a step; gives each tooth the creep rate frame ÷ length, so a wrong slip distorts only its own tooth;
  and shifts the median to the adopted pulse arrival time. Each tooth gets a confidence tier: A (rate corroborated,
  clean slips, low noise), B, C, N (no sawtooth evident for 45 minutes or 1.5 teeth) or U (possibly affected, not
  corrected).

  Figures. ppg-correction-check: `python tools/ppg_sawtooth_figures.py inputs --per-case
  $W/results/pat/ppg_correction_check_per_case.json --out $W/ppg_correction_check`, then `python tools/ppg_fix_check.py --root $R --cases
  $W/ppg_correction_check/cases266.json --out $W/ppg_correction_check/check_tierC.jsonl --adopted-pat 0.27 --priors
  $W/ppg_correction_check/priors266.json --apply-min-tier C` (resumable; about 11 minutes), then `python
  tools/ppg_sawtooth_figures.py check --scan $W/ppg_correction_check/check_tierC.jsonl --units
  $W/results/sync_full/units.csv --modes $W/results/sync_full/snuadc_mode_label.json --out $W/ppg_correction_check`.
  The case list and the per-case setup priors are those of the saved first run
  (`results/pat/ppg_correction_check_per_case.json`, whose priors file was not kept). pat-timeseries: `python
  tools/ppg_sawtooth_figures.py timeseries --root $R --cases 1912 2 2153 2611 476 3964 4194 5581 489 1599 1759 1858
  --out $W/pat_timeseries`.
results: |
  - **One frame per slip:** the step has a median of [[value:pleth-slip-step]] (IQR 30.4–34.8); other sizes are no more common than in
    a sign-flipped control.
  - **Regular:** slips recur every frame ÷ rate, stable to about 0.2 ppm; a few recordings creep by about 1 ppm over
    90 minutes.
  - **Fixed per setup, 18–52 ppm,** unrelated to the SNUADC drift (r = −0.22) or the frame clock (r = 0.13). One
    port hosts two PPG sources: step-mode cases at 51 ppm and frequent-mode cases at 27 ppm.
  - **Invisible in the waveform:** no repeated or held 33 ms segment at a slip (3.5% against 5% by chance).

  | Tier | Share of injected time | Error after correction (RMS) | Time over 10 ms | Share of real time |
  |---|---|---|---|---|
  | A | 60% | 0.2 ms | 0.1% | 17.0% |
  | B | 17% | 1.6 ms | 3.7% | 16.6% |
  | C | 19% | 5.3 ms | 14% | 26.8% |
  | U (not corrected) | 3% | 9.0 ms | 34% | 24.5% |
  | N (no sawtooth) | 0.5% (wrongly) | — | — | 15.0% |

  Uncorrected, the injected sawtooth has an RMS of 9.5 ms.
discussion: |
  Tiers A and B cover 34% of the real time analysed (378 h in 266 recordings; ppg_sawtooth_labels.csv), 49% with the stretches where no sawtooth is running. The
  benchmark is optimistic: its physiology came from quiet recordings. Labels carry each tooth's tier, so a user can
  choose how much time to trust.

  The last step of the fit, shifting each recording's median to the adopted pulse arrival time, also removes real
  differences between patients. [[study:pat-offset-census]] later showed that one global delay ([[value:pleth-chain-delay]],
  [[parameter:pleth-chain-delay]]) fits the whole release, so the atlas removes that instead and keeps those
  differences ([[example:pulse-arrival-time]]).
code:
  - physiosync/physiosync/ecg_ppg.py
  - physiosync/physiosync/labels.py
  - vitaldb-bench/tools/tier_bench.py
  - vitaldb-bench/tools/ppg_fix_check.py
  - vitaldb-bench/tools/ppg_sawtooth_figures.py
figures:
  - id: ppg-correction-check
    file: ppg-correction-check.png
    theme: example traces
    source: vitaldb-bench tools/ppg_sawtooth_figures.py
    records: [2156, 6241, 1094]
    caption: The sawtooth correction removes the PPG frame slips in [[case:2156]], [[case:6241]] and [[case:1094]] (panels a–c). Across the 266 cases the steps at 831 modelled slips shrink from 32.4 ms to 0.3 ms (median), the slope inside the teeth from −24 to +3 ppm (169 cases with full teeth), and the sawtooth rate groups by recording setup rather than by SNUADC drift (panels d–i). Drawn with every fitted tooth corrected (tier C and above), as before the tiers existed; with physiosync's default (B and above) the teeth of [[case:6241]] and [[case:1094]], all tier C, keep the offset only.
    alt: Three long PAT traces of measured and corrected values beside six aggregate histograms and scatter plots.
  - id: pat-timeseries
    file: pat-timeseries.png
    theme: example traces
    source: vitaldb-bench tools/ppg_sawtooth_figures.py
    records: [1912, 2, 2153, 2611, 476, 3964, 4194, 5581, 489, 1599, 1759, 1858]
    caption: Pulse-foot PAT through 12 cases, SNUADC clock corrections dashed. Most ([[case:2]], [[case:4194]], [[case:5581]]) show a regular sawtooth that does not follow the corrections; [[case:489]] shows none; [[case:3964]] and [[case:1759]] show no clear sawtooth. (In the first, ad hoc drawing those two looked like noise around 310 ms because their beats had been paired one beat out; with beat matching their PAT is 694 and 667 ms.)
    alt: Twelve scatter plots of 30 s median PAT against hours, with orange dashed vertical lines.
