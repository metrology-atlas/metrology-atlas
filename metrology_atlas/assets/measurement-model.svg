<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter" viewBox="0 40 760 340" role="img" aria-label="How a record was made, and what the atlas does to correct it" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="inv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"></path></marker><marker id="inv-fix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e8b57"></path></marker></defs><text x="24" y="56" font-size="11.5" fill="#5a6170">How the record was made: the measurement model, forward from the truth to the recorded pair</text><g fill="none" stroke="#8a8f98" stroke-width="1.25"><g><path d="M145 96H159" marker-end="url(#inv-arrow)"></path><path d="M257 96H271" marker-end="url(#inv-arrow)"></path><path d="M369 96H383" marker-end="url(#inv-arrow)"></path><path d="M481 96H495" marker-end="url(#inv-arrow)"></path><path d="M593 96H607" marker-end="url(#inv-arrow)"></path></g><g><path d="M145 168H159" marker-end="url(#inv-arrow)"></path><path d="M257 168H271" marker-end="url(#inv-arrow)"></path><path d="M369 168H383" marker-end="url(#inv-arrow)"></path><path d="M481 168H495" marker-end="url(#inv-arrow)"></path><path d="M593 168H607" marker-end="url(#inv-arrow)"></path></g></g><g><rect x="24" y="70" width="120" height="52" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><text x="84" y="93" text-anchor="middle" font-weight="600" fill="#1b2333">True time</text><text x="84" y="109" text-anchor="middle" font-size="11" fill="#5a6170">when it happened</text></g><g><rect x="24" y="142" width="120" height="52" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><text x="84" y="165" text-anchor="middle" font-weight="600" fill="#1b2333">True value</text><text x="84" y="181" text-anchor="middle" font-size="11" fill="#5a6170">what it was</text></g><g><rect x="160" y="70" width="96" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><g><text x="208" y="93" text-anchor="middle" font-weight="400" fill="#1b2333">Delay after</text><text x="208" y="109" text-anchor="middle" font-weight="400" fill="#1b2333">its window</text></g></g><g><rect x="272" y="70" width="96" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><g><text x="320" y="93" text-anchor="middle" font-weight="400" fill="#1b2333">Clock</text><text x="320" y="109" text-anchor="middle" font-weight="400" fill="#1b2333">drift</text></g></g><g><rect x="384" y="70" width="96" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><g><text x="432" y="93" text-anchor="middle" font-weight="400" fill="#1b2333">Resynchron-</text><text x="432" y="109" text-anchor="middle" font-weight="400" fill="#1b2333">isations</text></g></g><g><rect x="496" y="70" width="96" height="52" rx="8" fill="#e8a33d" fill-opacity="0.14" stroke="#e8a33d" stroke-width="1.75"></rect><g><text x="544" y="93" text-anchor="middle" font-weight="400" fill="#1b2333">Stamp</text><text x="544" y="109" text-anchor="middle" font-weight="400" fill="#1b2333">grid</text></g></g><g><rect x="160" y="142" width="96" height="52" rx="8" fill="#e8a33d" fill-opacity="0.14" stroke="#e8a33d" stroke-width="1.75"></rect><g><text x="208" y="165" text-anchor="middle" font-weight="400" fill="#1b2333">Sensor</text><text x="208" y="181" text-anchor="middle" font-weight="400" fill="#1b2333">error</text></g></g><g><rect x="272" y="142" width="96" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><g><text x="320" y="165" text-anchor="middle" font-weight="400" fill="#1b2333">Scale</text><text x="320" y="181" text-anchor="middle" font-weight="400" fill="#1b2333">factor</text></g></g><g><rect x="384" y="142" width="96" height="52" rx="8" fill="#e8a33d" fill-opacity="0.14" stroke="#e8a33d" stroke-width="1.75"></rect><g><text x="432" y="165" text-anchor="middle" font-weight="400" fill="#1b2333">Quantisation</text><text x="432" y="181" text-anchor="middle" font-weight="400" fill="#1b2333">(A/D steps)</text></g></g><g><rect x="496" y="142" width="96" height="52" rx="8" fill="#e8a33d" fill-opacity="0.14" stroke="#e8a33d" stroke-width="1.75"></rect><g><text x="544" y="165" text-anchor="middle" font-weight="400" fill="#1b2333">Rounding,</text><text x="544" y="181" text-anchor="middle" font-weight="400" fill="#1b2333">heaping</text></g></g><g><rect x="608" y="70" width="120" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><g><text x="668" y="93" text-anchor="middle" font-weight="600" fill="#1b2333">Recorded</text><text x="668" y="109" text-anchor="middle" font-weight="600" fill="#1b2333">time stamp</text></g></g><g><rect x="608" y="142" width="120" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><g><text x="668" y="165" text-anchor="middle" font-weight="600" fill="#1b2333">Recorded</text><text x="668" y="181" text-anchor="middle" font-weight="600" fill="#1b2333">value</text></g></g><line x1="24" x2="728" y1="214" y2="214" stroke="#8a8f98" stroke-width="0.75" stroke-dasharray="3 3"></line><text x="24" y="240" font-size="11.5" fill="#5a6170">What the atlas does: the correction, from the recorded pair back towards the truth</text><g><rect x="608" y="260" width="120" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><g><text x="668" y="283" text-anchor="middle" font-weight="600" fill="#1b2333">Recorded</text><text x="668" y="299" text-anchor="middle" font-weight="600" fill="#1b2333">pair</text></g></g><g><rect x="384" y="260" width="208" height="52" rx="8" fill="#2e8b57" fill-opacity="0.12" stroke="#2e8b57" stroke-width="1.75"></rect><text x="488" y="277" text-anchor="middle" font-weight="600" fill="#1b2333">Undo the measured steps</text><text x="488" y="292" text-anchor="middle" font-size="10.5" fill="#5a6170">delay, drift,</text><text x="488" y="305" text-anchor="middle" font-size="10.5" fill="#5a6170">resynchronisations, scale</text></g><g><rect x="160" y="260" width="208" height="52" rx="8" fill="#2e8b57" fill-opacity="0.12" stroke="#2e8b57" stroke-width="1.75"></rect><text x="264" y="277" text-anchor="middle" font-weight="600" fill="#1b2333">Carry the rest</text><text x="264" y="292" text-anchor="middle" font-size="10.5" fill="#5a6170">as an interval or a spread:</text><text x="264" y="305" text-anchor="middle" font-size="10.5" fill="#5a6170">grid, quantisation, rounding</text></g><g><rect x="24" y="260" width="120" height="52" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><g><text x="84" y="283" text-anchor="middle" font-weight="600" fill="#1b2333">Corrected</text><text x="84" y="299" text-anchor="middle" font-weight="600" fill="#1b2333">pair</text></g></g><g fill="none" stroke="#2e8b57" stroke-width="1.5"><path d="M607 286H593" marker-end="url(#inv-fix)"></path><path d="M383 286H369" marker-end="url(#inv-fix)"></path><path d="M159 286H145" marker-end="url(#inv-fix)"></path></g><text x="24" y="334" font-size="11.5" fill="#1b2333">The corrected pair is a joint distribution over the true time and true value, with its own, smaller, error model</text><g><rect x="24" y="352" width="18" height="14" rx="3" fill="none" stroke="#8a8f98" stroke-width="1.25"></rect><text x="50" y="363" font-size="11.5" fill="#5a6170">can be undone once measured</text><rect x="252" y="352" width="18" height="14" rx="3" fill="#e8a33d" fill-opacity="0.14" stroke="#e8a33d" stroke-width="1.75"></rect><text x="278" y="363" font-size="11.5" fill="#5a6170">many-to-one or random: leaves an interval or a spread</text><rect x="600" y="352" width="18" height="14" rx="3" fill="#2e8b57" fill-opacity="0.12" stroke="#2e8b57" stroke-width="1.75"></rect><text x="626" y="363" font-size="11.5" fill="#5a6170">the atlas&#x27;s correction</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>